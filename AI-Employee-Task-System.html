/* ============================================================
   Employee messages + exporters (PDF / Excel / Word / CSV)
   ============================================================ */
function L(task, key){
  // localise a message label in the TASK language, not the UI language
  const lang = task.lang || LANG;
  const d = I18N[lang] || I18N.ar;
  return d[key] || I18N.en[key] || key;
}

function taskPlainText(task, emp){
  const lines = [];
  lines.push(L(task,"task.task") + ": " + task.title);
  lines.push("");
  if (task.isSimulation) lines.push("[" + L(task,"task.simNote") + "]", "");
  lines.push(task.scenario || "");
  if ((task.given||[]).length){
    lines.push("", (task.lang==="en" ? "Given data / context:" : "المعطيات:"));
    task.given.forEach(g => lines.push("- " + g));
  }
  if (task.objective) lines.push("", L(task,"task.objective") + ": " + task.objective);
  if ((task.instructions||[]).length){
    lines.push("", L(task,"task.instructions") + ":");
    task.instructions.forEach((s,i) => lines.push((i+1) + ". " + s));
  }
  if ((task.deliverable||[]).length){
    lines.push("", L(task,"task.deliverable") + ":");
    task.deliverable.forEach((s,i) => lines.push((i+1) + ". " + s));
  }
  lines.push("", L(task,"task.deadline") + ": " + fmtDate(task.deadline));
  lines.push(L(task,"task.estTime") + ": " + task.estimatedTime + " " + L(task,"common.min"));
  return lines.join("\n");
}

function employeeMessage(task, emp, channel){
  const lang = task.lang || LANG;
  const ar = lang === "ar";
  const name = emp ? emp.fullName : "";
  const head = ar ? ("السلام عليكم " + name + "،") : ("Dear " + name + ",");
  const parts = [head, "", L(task,"msg.intro"), ""];
  parts.push(L(task,"task.task") + ": " + task.title, "");
  if (task.isSimulation) parts.push("(" + L(task,"task.simNote") + ")", "");
  parts.push(task.scenario || "");
  if ((task.given||[]).length){
    parts.push("", (ar ? "المعطيات:" : "Given data / context:"));
    task.given.forEach(g => parts.push("• " + g));
  }
  if ((task.instructions||[]).length){
    parts.push("", L(task,"task.instructions") + ":");
    task.instructions.forEach((s,i) => parts.push((i+1) + ". " + s));
  }
  parts.push("", L(task,"msg.required"));
  (task.deliverable||[]).forEach((d,i) => parts.push((i+1) + ". " + d));
  parts.push("", L(task,"msg.deadline") + " " + fmtDate(task.deadline));
  parts.push("", L(task,"msg.closing"), "", L(task,"msg.thanks"));
  if (channel === "email"){
    return (ar ? "الموضوع: " : "Subject: ") + L(task,"task.emailSubject") + " — " + task.title + "\n\n" + parts.join("\n");
  }
  return parts.join("\n");
}

/* Excel 2003 XML — supports one worksheet per employee */
function xlCell(v, type){
  const s = String(v === null || v === undefined ? "" : v);
  return '<Cell><Data ss:Type="'+(type||"String")+'">'+esc(s)+'</Data></Cell>';
}
function xlSheetName(n){ return String(n||"Sheet").replace(/[\\\/\?\*\[\]:]/g,"-").slice(0,28) || "Sheet"; }
function exportTasksExcel(tasks, includeSolution){
  const groups = groupTasksByEmployee(tasks);
  const headers = [t("task.title"), t("task.competency"), t("gen.type"), t("gen.difficulty"), t("task.deadline"),
                   t("common.status"), t("common.score"), t("task.desc"), t("task.deliverable")];
  if (includeSolution) headers.push(t("task.expected"), t("task.keyPoints"));
  const used = {};
  let sheets = "";
  Object.keys(groups).forEach(empId => {
    const emp = DB.get("employees", empId);
    let nm = xlSheetName(emp ? emp.fullName : "Unknown");
    if (used[nm]) { nm = xlSheetName(nm + " " + (++used[nm])); } else used[nm] = 1;
    let rows = '<Row>' + headers.map(h => xlCell(h)).join("") + '</Row>';
    groups[empId].forEach(tk => {
      const ev = evalOfTask(tk.id);
      const cells = [
        xlCell(tk.title), xlCell(tk.competency||""), xlCell(t("type."+tk.type)), xlCell(t("diff."+tk.difficulty)),
        xlCell(fmtDate(tk.deadline)), xlCell(t("st."+effectiveTaskStatus(tk))),
        ev ? xlCell(ev.score,"Number") : xlCell(""),
        xlCell(tk.scenario||""), xlCell((tk.deliverable||[]).join(" | "))
      ];
      if (includeSolution){
        cells.push(xlCell((tk.solution||{}).expectedAnswer||""));
        cells.push(xlCell(((tk.solution||{}).keyPoints||[]).join(" | ")));
      }
      rows += '<Row>' + cells.join("") + '</Row>';
    });
    sheets += '<Worksheet ss:Name="'+esc(nm)+'"><Table>' + rows + '</Table></Worksheet>';
  });
  const xml = '<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n'+
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
    (sheets || '<Worksheet ss:Name="Empty"><Table><Row>'+xlCell("—")+'</Row></Table></Worksheet>') + '</Workbook>';
  downloadFile("tasks_" + todayISO() + ".xls", xml, "application/vnd.ms-excel;charset=utf-8");
}

function toCSV(rows){
  return rows.map(r => r.map(c => {
    const s = String(c === null || c === undefined ? "" : c);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(",")).join("\n");
}

  downloadFile("employees_" + todayISO() + ".csv", toCSV(rows), "text/csv;charset=utf-8");

/* ---------- the generation runner ---------- */
async function runGeneration(empIds, perEmp){
  Busy.show(t("gen.working"), "");
  await nextFrame();
  const created = [];
  AI_LAST_ERROR = "";
  try{
    for (let i = 0; i < empIds.length; i++){
      const emp = DB.get("employees", empIds[i]);
      if (!emp) continue;
      Busy.msg(emp.fullName + "  (" + (i+1) + "/" + empIds.length + ")");
      await nextFrame();
      const existing = tasksOf(emp.id).map(x => x.competency).filter(Boolean);
      const cores = await generateEmployeeTask(emp, {
        count: perEmp, difficulty: GenState.difficulty, type: GenState.type,
        lang: GenState.lang, focus: GenState.focus, avoid: existing,
        salt: String(DB.all("tasks").length)
      });
      for (let k = 0; k < cores.length; k++){
        const core = cores[k];
        if (!core.solution){
          Busy.msg(emp.fullName + " — " + (isRTL()?"إعداد الحل المتوقع":"building expected solution") + " (" + (k+1) + "/" + cores.length + ")");
          await nextFrame();
          core.solution = await generateExpectedSolution(emp, core);
        }
        const deadlineDays = GenState.deadlineDays || (DIFF_META[core.difficulty]||DIFF_META.medium).days;
        const row = DB.insert("tasks", Object.assign({}, core, {
          employeeId: emp.id,
          employeeSnapshot: {name: emp.fullName, jobTitle: emp.jobTitle, department: emp.department, level: emp.level},
          deadline: isoDate(addDays(new Date(), deadlineDays)),
          status: "draft", version: 1, parentId: null
        }));
        created.push(row);
      }
    }
    GenState.lastBatch = created;
    Busy.hide();
    toast(created.length + " " + t("gen.done"), "ok");
    if (AI_LAST_ERROR) toast(t("ai.fallback"), "warn", 5000);
    Router.render();
  }catch(err){
    Busy.hide();
    console.error(err);
    toast(String(err.message||err), "err", 5000);
  }
}

function wireTask(root, id){
  const tk = DB.get("tasks", id); if (!tk) return;
  const emp = DB.get("employees", tk.employeeId);
  const sub = submissionOfTask(tk.id);

  $("#tBack", root).onclick = () => history.length > 1 ? history.back() : (location.hash = "#/library");
  $$("[data-tab]", root).forEach(b => b.onclick = () => { TaskTab.current = b.dataset.tab; Router.render(true); });
  $("#tPdf", root).onclick = () => exportTasksPDF([tk], false);
  $("#tDup", root).onclick = () => {
    const copy = Object.assign({}, tk); delete copy.id; delete copy.createdAt; delete copy.updatedAt;
    copy.status = "draft"; copy.title = tk.title + (isRTL()?" (نسخة)":" (copy)");
    const row = DB.insert("tasks", copy); toast(t("common.saved"),"ok"); location.hash = "#/task/"+row.id;
  };
  $("#tDel", root).onclick = () => confirmDialog(t("task.deleteConfirm"), () => {
    DB.removeWhere("evaluations", e => e.taskId === tk.id);
    DB.removeWhere("submissions", s => s.taskId === tk.id);
    DB.remove("tasks", tk.id);
    toast(t("common.deleted"),"ok"); location.hash = "#/library";
  }, true);
  $("#tVariation", root).onclick = async () => {
    Busy.show(t("gen.working"), tk.competency||"");
    await nextFrame();
    try{
      const versions = DB.where("tasks", x => (x.parentId === (tk.parentId||tk.id)) || x.id === (tk.parentId||tk.id));
      const core = await generateTaskVariation(emp, tk, versions.length);
      if (!core.solution) core.solution = await generateExpectedSolution(emp, core);
      const row = DB.insert("tasks", Object.assign({}, core, {
        employeeId: tk.employeeId, employeeSnapshot: tk.employeeSnapshot,
        deadline: isoDate(addDays(new Date(), (DIFF_META[core.difficulty]||DIFF_META.medium).days)),
        status:"draft", version: versions.length + 1, parentId: tk.parentId || tk.id
      }));
      Busy.hide(); toast(t("common.saved"),"ok"); location.hash = "#/task/"+row.id;
    }catch(e){ Busy.hide(); toast(String(e.message||e),"err"); }
  };

  if (TaskTab.current === "employee"){
    $("#cpTask", root).onclick = () => copyText(taskPlainText(tk, emp));
    $("#cpWa", root).onclick = () => copyText(employeeMessage(tk, emp, "wa"));
    $("#cpMail", root).onclick = () => copyText(employeeMessage(tk, emp, "email"));
    $("#openWa", root).onclick = () => {
      const n = (emp && emp.whatsapp || "").replace(/[^\d]/g,"");
      const url = "https://wa.me/" + n + "?text=" + encodeURIComponent(employeeMessage(tk, emp, "wa"));
      window.open(url, "_blank");
    };
    $("#openMail", root).onclick = () => {
      const body = employeeMessage(tk, emp, "wa");
      location.href = "mailto:" + encodeURIComponent(emp && emp.email || "") +
        "?subject=" + encodeURIComponent(L(tk,"task.emailSubject") + " — " + tk.title) +
        "&body=" + encodeURIComponent(body);
    };
    $("#mkSent", root).onclick = () => { DB.update("tasks", tk.id, {status:"sent", sentAt:new Date().toISOString()}); toast(t("common.saved"),"ok"); Router.render(); };
  }
  if (TaskTab.current === "hr"){
    $("#cpSolution", root).onclick = () => {
      const s = tk.solution||{};
      copyText([t("task.expected")+":", s.expectedAnswer||"", "", t("task.keyPoints")+":",
        (s.keyPoints||[]).map((k,i)=>(i+1)+". "+k).join("\n"), "", t("task.mistakes")+":",
        (s.commonMistakes||[]).map(k=>"- "+k).join("\n")].join("\n"));
    };
    $("#hrPdf", root).onclick = () => exportTasksPDF([tk], true);
  }
  if (TaskTab.current === "sub"){
    let attach = sub ? {name: sub.attachmentName, data: sub.attachmentData} : null;
    const fileEl = $("#sFile", root);
    if (fileEl) fileEl.onchange = function(){
      const f = this.files[0]; if (!f) return;
      if (f.size > 1.6*1024*1024){ toast(isRTL()?"الملف كبير (الحد 1.5 ميجابايت)":"File too large (1.5 MB max)","err"); this.value=""; return; }
      const r = new FileReader();
      r.onload = () => { attach = {name:f.name, data:r.result}; toast(f.name,"ok"); };
      r.readAsDataURL(f);
    };
    const dl = $("#dlAttach", root);
    if (dl) dl.onclick = (e) => { e.preventDefault(); const a=document.createElement("a"); a.href=sub.attachmentData; a.download=sub.attachmentName; a.click(); };

    const saveSub = () => {
      const answer = $("#sAnswer", root).value.trim();
      const payload = {
        taskId: tk.id, employeeId: tk.employeeId, answer: answer,
        submittedAt: new Date($("#sDate", root).value || todayISO()).toISOString(),
        hrNotes: $("#sNotes", root).value.trim(),
        attachmentName: attach ? attach.name : "", attachmentData: attach ? attach.data : ""
      };
      let row;
      if (sub) row = DB.update("submissions", sub.id, payload); else row = DB.insert("submissions", payload);
      if (tk.status === "draft" || tk.status === "sent") DB.update("tasks", tk.id, {status:"submitted"});
      return row;
    };
    $("#sSave", root).onclick = () => { if (!$("#sAnswer",root).value.trim()){ toast(t("sub.needAnswer"),"err"); return; } saveSub(); toast(t("sub.saved"),"ok"); Router.render(); };
    $("#sEval", root).onclick = async () => {
      const answer = $("#sAnswer", root).value.trim();
      if (!answer){ toast(t("sub.needAnswer"),"err"); return; }
      saveSub();
      Busy.show(t("ev.working"), tk.title);
      await nextFrame();
      try{
        AI_LAST_ERROR = "";
        const res = await evaluateEmployeeAnswer(emp, tk, answer);
        const s2 = submissionOfTask(tk.id);
        DB.removeWhere("evaluations", e => e.taskId === tk.id);
        DB.insert("evaluations", Object.assign({}, res, {taskId: tk.id, employeeId: tk.employeeId, submissionId: s2?s2.id:null, evaluatedAt: new Date().toISOString()}));
        DB.update("tasks", tk.id, {status:"evaluated"});
        Busy.hide();
        toast(t("ev.result")+": "+res.score+"/100", "ok");
        if (res.fallback) toast(t("ai.fallback"),"warn",5000);
        Router.render();
      }catch(e){ Busy.hide(); toast(String(e.message||e),"err",5000); }
    };
  }
}

/* ============================================================

   ============================================================ */
const LibFilters = {q:"", emp:"", dept:"", job:"", diff:"", type:"", status:"", from:"", to:""};
const LibSel = {};

function libMatches(tk){
  const emp = DB.get("employees", tk.employeeId) || {};
  const q = LibFilters.q.toLowerCase().trim();
  if (q){
    const hay = [tk.title, tk.competency, tk.scenario, emp.fullName, emp.jobTitle].join(" ").toLowerCase();
    if (hay.indexOf(q) < 0) return false;
  }
  if (LibFilters.emp  && tk.employeeId !== LibFilters.emp) return false;
  if (LibFilters.dept && emp.department !== LibFilters.dept) return false;
  if (LibFilters.job  && emp.jobTitle !== LibFilters.job) return false;
  if (LibFilters.diff && tk.difficulty !== LibFilters.diff) return false;
  if (LibFilters.type && tk.type !== LibFilters.type) return false;
  if (LibFilters.status && effectiveTaskStatus(tk) !== LibFilters.status) return false;
  if (LibFilters.from && isoDate(tk.createdAt) < LibFilters.from) return false;
  if (LibFilters.to   && isoDate(tk.createdAt) > LibFilters.to) return false;
  return true;
}

  let html = '<div class="stack">';

function wireLibrary(root){
  const q = $("#libQ", root); if (q) q.oninput = debounce(function(){ LibFilters.q = this.value; Router.render(true); }, 250);
  const bind = (id,key) => { const e = $(id, root); if (e) e.onchange = function(){ LibFilters[key] = this.value; Router.render(true); }; };
  bind("#lEmp","emp"); bind("#lDept","dept"); bind("#lJob","job"); bind("#lDiff","diff");
  bind("#lType","type"); bind("#lStatus","status"); bind("#lFrom","from"); bind("#lTo","to");
  const rs = $("#lReset", root); if (rs) rs.onclick = () => { Object.keys(LibFilters).forEach(k=>LibFilters[k]=""); Router.render(); };

  $$("[data-open]", root).forEach(b => b.onclick = () => location.hash = "#/task/" + b.dataset.open);
  $$("[data-lsel]", root).forEach(cb => cb.onchange = function(){ LibSel[this.dataset.lsel] = this.checked; this.closest("tr").classList.toggle("selrow", this.checked); });
  const all = $("#libAll", root);
  if (all) all.onchange = function(){
    const on = this.checked;
    $$("[data-lsel]", root).forEach(cb => { cb.checked = on; LibSel[cb.dataset.lsel] = on; cb.closest("tr").classList.toggle("selrow", on); });
  };
  $$("[data-ldel]", root).forEach(b => b.onclick = () => confirmDialog(t("task.deleteConfirm"), () => {
    const id = b.dataset.ldel;
    DB.removeWhere("evaluations", e => e.taskId === id);
    DB.removeWhere("submissions", s => s.taskId === id);
    DB.remove("tasks", id); toast(t("common.deleted"),"ok"); Router.render();
  }, true));
  $$("[data-reuse]", root).forEach(b => b.onclick = () => reuseTaskDialog(DB.get("tasks", b.dataset.reuse)));

  const ex = $("#libExport", root);
  if (ex) ex.onclick = () => {
    const selected = DB.all("tasks").filter(tk => LibSel[tk.id]);
    const list = selected.length ? selected : DB.all("tasks").filter(libMatches);
    if (!list.length){ toast(t("common.noData"),"warn"); return; }
    exportDialog(list);
  };
}

function reuseTaskDialog(tk){
  if (!tk) return;
  const emps = sortBy(DB.all("employees"), e=>e.fullName);
  Modal.open(
    '<div class="modal-h"><h3>'+esc(t("lib.reuseTitle"))+'</h3><button class="x" data-close>&times;</button></div>'+
    '<div class="modal-b"><div class="field"><label>'+esc(t("gen.selectEmp"))+'</label>'+
      '<select class="sel" id="ruEmp">'+emps.map(e=>'<option value="'+esc(e.id)+'">'+esc(e.fullName+" — "+(e.jobTitle||""))+'</option>').join("")+'</select></div>'+
      '<div class="field"><label>'+esc(t("gen.deadlineDays"))+'</label><input class="inp" type="number" id="ruDays" min="1" max="90" value="5"></div>'+
      '<div class="note note-blue">'+esc(isRTL()?"سيتم إنشاء نسخة جديدة من نفس المهمة مسندة للموظف المختار.":"A fresh copy of this task will be assigned to the selected employee.")+'</div>'+
    '</div>'+
    '<div class="modal-f"><button class="btn" data-close>'+esc(t("common.cancel"))+'</button>'+
    '<button class="btn btn-primary" id="ruGo">'+esc(t("common.confirm"))+'</button></div>',
    {slim:true, onOpen(m){
      $("#ruGo", m).onclick = () => {
        const empId = $("#ruEmp", m).value;
        const emp = DB.get("employees", empId);
        const days = clamp(parseInt($("#ruDays", m).value,10)||5, 1, 90);
        const copy = Object.assign({}, tk);
        delete copy.id; delete copy.createdAt; delete copy.updatedAt;
        copy.employeeId = empId;
        copy.employeeSnapshot = {name:emp.fullName, jobTitle:emp.jobTitle, department:emp.department, level:emp.level};
        copy.status = "draft"; copy.version = 1; copy.parentId = null;
        copy.deadline = isoDate(addDays(new Date(), days));
        const row = DB.insert("tasks", copy);
        Modal.close(); toast(t("common.saved"),"ok"); location.hash = "#/task/"+row.id;
      };
    }});
}

function viewDashboard(){

    kpi(t("dash.totalEmp"), g.employees, "", "👥")+
    kpi(t("dash.activeTasks"), g.active, "p", "▶")+
    kpi(t("dash.completed"), g.completed, "g", "✓")+
    kpi(t("dash.pending"), g.pending, "a", "◔")+
  '</div>';
  html += '<div class="grid g3">'+
    kpi(t("dash.overdue"), g.overdue, "r", "!")+

    const ids = emps.filter(e=>e.department===d).map(e=>e.id);
    const tk = tasks.filter(x => ids.indexOf(x.employeeId)>=0);
    return {label:d, value: tk.filter(x=>x.status==="evaluated").length, total: tk.length};
  }).filter(x=>x.total>0);
  const scoreByDept = depts.map(d => {
    const ids = emps.filter(e=>e.department===d).map(e=>e.id);

    return {label:d, value: sc.length ? Math.round(avg(sc)) : 0, n: sc.length};

  html += '<div class="grid g3">'+
    '<div class="card" style="grid-column:span 2"><div class="card-h"><h3>'+esc(t("dash.byDept"))+'</h3></div>'+

      '<div class="card-b">'+donutChart(statusData, {centerLabel:t("task.tasks")})+'</div></div>'+
  '</div>';

  /* top performers / needs attention */
  const perf = emps.map(e => ({e:e, st:employeeStats(e.id)})).filter(x => x.st.avg !== null);
  const top = sortBy(perf, x => x.st.avg, true).slice(0,5);
  const low = sortBy(perf, x => x.st.avg).slice(0,5);

  html += '<div class="grid g3">'+
    '<div class="card"><div class="card-h"><h3>'+esc(t("dash.scoreByDept"))+'</h3></div><div class="card-b">'+
      hBarChart(scoreByDept.map(d=>({label:d.label, value:d.value, color:scoreBand(d.value).color})), {fmt:v=>v+"/100"})+'</div></div>'+
    '<div class="card"><div class="card-h"><h3>'+esc(t("dash.topPerformers"))+'</h3></div><div class="card-b">'+
      (top.length ? top.map(x=>'<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eef1f6;cursor:pointer" data-emp="'+esc(x.e.id)+'">'+
        '<div class="who"><div class="av">'+esc(initials(x.e.fullName))+'</div><div><div class="nm">'+esc(x.e.fullName)+'</div>'+
        '<div class="mut sm">'+esc(x.e.jobTitle||"")+'</div></div></div>'+
        '<b style="color:'+scoreBand(x.st.avg).color+'">'+num(x.st.avg)+'</b></div>').join("") : chartEmpty())+'</div></div>'+
    '<div class="card"><div class="card-h"><h3>'+esc(t("dash.needsAttention"))+'</h3></div><div class="card-b">'+
      (low.length ? low.map(x=>'<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eef1f6;cursor:pointer" data-emp="'+esc(x.e.id)+'">'+
        '<div class="who"><div class="av">'+esc(initials(x.e.fullName))+'</div><div><div class="nm">'+esc(x.e.fullName)+'</div>'+
        '<div class="mut sm">'+esc(x.st.overdue? x.st.overdue+" "+t("st.overdue") : x.e.jobTitle||"")+'</div></div></div>'+
        '<b style="color:'+scoreBand(x.st.avg).color+'">'+num(x.st.avg)+'</b></div>').join("") : chartEmpty())+'</div></div>'+
  '</div>';

  /* recent activity */
  const recent = sortBy(tasks, x => x.updatedAt || x.createdAt, true).slice(0,8);
  html += '<div class="card"><div class="card-h"><h3>'+esc(t("dash.recent"))+'</h3><div class="spacer"></div>'+
    '<a class="btn btn-sm" href="#/library">'+esc(t("lib.title"))+'</a></div>';
  if (!recent.length) html += '<div class="empty"><div class="e-ic">◲</div><div>'+esc(t("dash.noActivity"))+'</div>'+
    '<div style="margin-top:14px"><a class="btn btn-primary" href="#/employees">'+esc(t("emp.add"))+'</a> '+
    '<button class="btn" id="dashDemo">'+esc(t("set.demo"))+'</button></div></div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>'+esc(t("task.task"))+'</th><th>'+esc(t("emp.fullName"))+'</th>'+
      '<th>'+esc(t("common.status"))+'</th><th>'+esc(t("common.score"))+'</th><th>'+esc(t("common.date"))+'</th></tr></thead><tbody>';
    recent.forEach(tk => {
      const ev = evalOfTask(tk.id);
      html += '<tr data-task="'+esc(tk.id)+'" style="cursor:pointer"><td class="nm">'+esc(tk.title)+'</td>'+

    });
    html += '</tbody></table></div>';
  }
  html += '</div></div>';
  return html;
}

const EvFilters = {emp:"", dept:"", band:""};
function viewEvaluations(){
  let evs = sortBy(DB.all("evaluations"), e => e.evaluatedAt || e.createdAt, true);
  evs = evs.filter(e => {
    const emp = DB.get("employees", e.employeeId) || {};
    if (EvFilters.emp && e.employeeId !== EvFilters.emp) return false;
    if (EvFilters.dept && emp.department !== EvFilters.dept) return false;
    if (EvFilters.band && scoreBand(e.score).key !== EvFilters.band) return false;
    return true;
  });

  const scores = evs.map(e=>e.score);
  const dist = [
    {label:t("ev.excellent"),  value: scores.filter(s=>s>=90).length, color:"#16a34a"},
    {label:t("ev.good"),       value: scores.filter(s=>s>=75&&s<90).length, color:"#2563eb"},
    {label:t("ev.acceptable"), value: scores.filter(s=>s>=60&&s<75).length, color:"#d97706"},
    {label:t("ev.needs"),      value: scores.filter(s=>s<60).length, color:"#dc2626"}

        '<select class="sel" id="eBand"><option value="">'+esc(t("ev.final")+": "+t("common.all"))+'</option>'+
          ["excellent","good","acceptable","needs"].map(b=>'<option value="'+b+'"'+(b===EvFilters.band?" selected":"")+'>'+esc(t("ev."+b))+'</option>').join("")+'</select>'+
        '<button class="btn" id="eReset">'+esc(t("common.reset"))+'</button>'+
      '</div>'+
      '<div class="hr"></div>'+
      '<div class="row" style="gap:24px">'+
        '<div><div class="lbl mut sm">'+esc(t("common.total"))+'</div><div style="font-size:24px;font-weight:800;color:#0f2540">'+evs.length+'</div></div>'+
        '<div><div class="lbl mut sm">'+esc(t("common.average"))+'</div><div style="font-size:24px;font-weight:800;color:'+(scores.length?scoreBand(avg(scores)).color:"#0f2540")+'">'+(scores.length?num(avg(scores),1):"—")+'</div></div>'+
      '</div>'+
    '</div></div>'+
    '<div class="card"><div class="card-h"><h3>'+esc(t("ev.title"))+'</h3></div><div class="card-b">'+donutChart(dist,{centerLabel:t("ev.title")})+'</div></div>'+
  '</div>';

  html += '<div class="card"><div class="card-h"><h3>'+esc(t("ev.title"))+'</h3></div>';
  if (!evs.length) html += '<div class="empty"><div class="e-ic">✓</div><div>'+esc(t("ev.empty"))+'</div></div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
      '<th>'+esc(t("emp.fullName"))+'</th><th>'+esc(t("task.task"))+'</th><th>'+esc(t("common.score"))+'</th>'+

function wireReports(root){
  const se = $("#rEmp", root); if (se) se.onchange = function(){ RepState.empId = this.value; };

function wireReportButtons(root){
  if (!RepState.last) return;
  const emp = DB.get("employees", RepState.last.employeeId); if (!emp) return;
  const rep = RepState.last.content;
  const title = t("rep.reportFor") + " " + emp.fullName + " — " + (rep.period||"");
  const p = $("#repPdf", root); if (p) p.onclick = () => exportReportPDF(emp, rep, title);
  const w = $("#repDoc", root); if (w) w.onclick = () => exportReportWord(emp, rep, title);
  const c = $("#repCopy", root); if (c) c.onclick = () => copyText([
    title, "", t("rep.numTasks")+": "+rep.numTasks, t("rep.completedTasks")+": "+rep.completed,
    t("rep.avgScore")+": "+(rep.avgScore===null?"—":num(rep.avgScore,1)), "",
    t("rep.overall")+":", rep.overall||"", "",
    t("rep.strong")+":", (rep.strongAreas||[]).map(x=>"- "+x).join("\n"), "",
    t("rep.weak")+":", (rep.weakAreas||[]).map(x=>"- "+x).join("\n"), "",
    t("rep.recommend")+":", (rep.recommendations||[]).map((x,i)=>(i+1)+". "+x).join("\n")
  ].join("\n"));
}

async function generateReportFor(emp, month){
  if (!emp) return;
  let tasks = tasksOf(emp.id);
  if (month) tasks = tasks.filter(x => monthKey(x.createdAt) === month);
  if (!tasks.length){ toast(t("rep.noTasks"),"warn"); return; }
  const evals = tasks.map(x => evalOfTask(x.id)).filter(Boolean);
  const period = month ? monthLabel(month) : (isRTL() ? "كل الفترات" : "All time");
  Busy.show(t("rep.working"), emp.fullName);
  await nextFrame();
  try{
    const rep = await generateEmployeeReport(emp, tasks, evals, period, DB.settings.taskLang || LANG);
    rep.tasksTable = sortBy(tasks, x=>x.createdAt, true).map(tk => {
      const ev = evalOfTask(tk.id);
      return [tk.title, fmtDate(tk.createdAt), t("st."+effectiveTaskStatus(tk)), ev?String(ev.score):"—"];
    });
    const pack = DB.insert("reports", {employeeId: emp.id, type: month?"monthly":"employee", month: month||"", content: rep});
    RepState.last = pack; RepState.empId = emp.id;
    Busy.hide();
    toast(t("common.saved"),"ok");
    if (location.hash.indexOf("#/reports") !== 0) location.hash = "#/reports"; else Router.render();
    window.scrollTo(0,0);
  }catch(e){ Busy.hide(); toast(String(e.message||e),"err",5000); }
}

  };
  if (g("#stTest")) g("#stTest").onclick = async () => {
    DB.saveSettings({provider:g("#stProvider").value, model:g("#stModel").value.trim(), apiKey:g("#stKey").value.trim(),
      baseUrl:g("#stBase").value.trim(), useProxy: g("#stProxy").checked, proxyUrl: g("#stProxyUrl").value.trim()});
    const out = g("#stTestOut"); out.textContent = t("set.testing"); out.className = "sm mut";
    try{ await testAIConnection(); out.textContent = "✓ " + t("set.testOk"); out.className = "sm"; out.style.color = "#16a34a"; updateAIBadge(); }
    catch(e){ out.textContent = "✕ " + t("set.testFail") + " — " + String(e.message||e).slice(0,140); out.className="sm"; out.style.color="#dc2626"; }
  };
  if (g("#stSavePrivacy")) g("#stSavePrivacy").onclick = () => { DB.saveSettings({redactPII:g("#stRedact").checked}); toast(t("set.savedOk"),"ok"); };

  if (g("#dtExport")) g("#dtExport").onclick = () =>
    downloadFile("aitms_backup_"+todayISO()+".json", JSON.stringify(DB.exportAll(), null, 2), "application/json");
  if (g("#dtImport")) g("#dtImport").onclick = () => g("#dtFile").click();
  if (g("#dtFile")) g("#dtFile").onchange = function(){
    const f = this.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{ DB.importAll(JSON.parse(r.result), false); setLang(DB.settings.lang, false); toast(t("set.imported"),"ok"); Router.render(); }
      catch(e){ toast(t("set.importBad"),"err"); }
    };
    r.readAsText(f);
  };
  if (g("#dtDemo")) g("#dtDemo").onclick = () => { loadDemoData(); toast(t("set.demoAdded"),"ok"); Router.render(); };
  if (g("#dtWipe")) g("#dtWipe").onclick = () => confirmDialog(t("set.wipeConfirm"), () => {
    const keep = DB.settings; DB.wipe(); DB.saveSettings(keep); toast(t("common.deleted"),"ok"); Router.render();
  }, true);
}

/* ============================================================
   Router + bootstrap + demo data
   ============================================================ */
const ROUTES = {
  dashboard:   {title:"dash.title",  sub:"dash.sub",  view: viewDashboard,   wire: wireDashboard},
  employees:   {title:"emp.title",   sub:"emp.sub",   view: viewEmployees,   wire: wireEmployees},
  generate:    {title:"gen.title",   sub:"gen.sub",   view: viewGenerate,    wire: wireGenerate},
  library:     {title:"lib.title",   sub:"lib.sub",   view: viewLibrary,     wire: wireLibrary},
  evaluations: {title:"ev.title",    sub:"ev.sub",    view: viewEvaluations, wire: wireEvaluations},
  reports:     {title:"rep.title",   sub:"rep.sub",   view: viewReports,     wire: wireReports},
  settings:    {title:"set.title",   sub:"set.sub",   view: viewSettings,    wire: wireSettings}
};

const Router = {
  parse(){
    const h = (location.hash || "#/dashboard").replace(/^#\/?/,"");
    const parts = h.split("/").filter(Boolean);
    return {name: parts[0] || "dashboard", param: parts[1] || ""};
  },
  render(keepScroll){
    const r = this.parse();
    const view = $("#view");
    const y = window.scrollY;
    let html = "", wire = null, titleKey = "", subKey = "";

    if (r.name === "employee" && r.param){
      const e = DB.get("employees", r.param);
      html = viewEmployeeProfile(r.param);
      wire = root => wireEmployeeProfile(root, r.param);
      titleKey = "emp.profile"; subKey = "";
      $("#pageTitle").textContent = e ? e.fullName : t("emp.profile");
      $("#pageSub").textContent = e ? ((e.jobTitle||"") + (e.department? " · "+e.department : "")) : "";
    } else if (r.name === "task" && r.param){
      const tk = DB.get("tasks", r.param);
      html = viewTask(r.param);
      wire = root => wireTask(root, r.param);
      $("#pageTitle").textContent = tk ? tk.title : t("task.task");
      $("#pageSub").textContent = tk ? employeeName(tk.employeeId) : "";
    } else {
      const route = ROUTES[r.name] || ROUTES.dashboard;
      html = route.view();
      wire = route.wire;
      $("#pageTitle").textContent = t(route.title);
      $("#pageSub").textContent = route.sub ? t(route.sub) : "";
    }

    view.innerHTML = html;
    if (wire) try{ wire(view); }catch(e){ console.error("wire error", e); }

    $$("#nav a").forEach(a => {
      const active = a.dataset.route === r.name ||
        (r.name === "employee" && a.dataset.route === "employees") ||
        (r.name === "task" && a.dataset.route === "library");
      a.classList.toggle("active", active);
    });
    updateStorageInfo();
    if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
    closeSidebar();
  }
};

function updateAIBadge(){
  const el = $("#aiStatus"), tx = $("#aiStatusTxt");
  if (!el) return;
  const on = aiEnabled();
  el.className = "aistat no-print " + (on ? "on" : "off");
  tx.textContent = aiLabel();
  el.title = on ? aiLabel() : t("ai.needKey");
  el.onclick = () => { SetTab.current = "ai"; location.hash = "#/settings"; };
}
function updateStorageInfo(){
  const el = $("#storageInfo"); if (!el) return;
  const b = DB.adapter.usage ? DB.adapter.usage() : 0;
  el.textContent = DB.all("employees").length + " " + t("emp.count") + " · " + DB.all("tasks").length + " " + t("task.tasks") + " · " + num(b/1024,0) + " KB";
}
function openSidebar(){ $("#sidebar").classList.add("open"); $("#scrim").classList.add("show"); }
function closeSidebar(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }

/* ---------- boot ---------- */
function boot(){
  DB.init();
  setLang(DB.settings.lang || "ar", false);

  $$(".lang-sw button").forEach(b => b.onclick = () => {
    setLang(b.dataset.lang, false);
    DB.saveSettings({lang: b.dataset.lang});
    updateAIBadge();
    Router.render(true);
  });
  $("#burger").onclick = () => $("#sidebar").classList.contains("open") ? closeSidebar() : openSidebar();
  $("#scrim").onclick = closeSidebar;
  $$("#nav a").forEach(a => a.onclick = () => { location.hash = "#/" + a.dataset.route; });
  $("#modalBg").onclick = (e) => { if (e.target.id === "modalBg") Modal.close(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") Modal.close(); });

  window.addEventListener("hashchange", () => Router.render());
  DB.onChange(() => updateStorageInfo());

  updateAIBadge();
  if (!location.hash) location.hash = "#/dashboard";
  Router.render();
}

window.addEventListener("error", e => { console.error("App error:", e.error || e.message); });
document.addEventListener("DOMContentLoaded", boot);
