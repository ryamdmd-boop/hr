<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>AI Employee Task Management System</title>
<style>
/* ============================================================
   AI Employee Task Management System — Corporate HR SaaS theme
   ============================================================ */
:root{
  --navy:#0f2540; --navy-2:#16314f; --navy-3:#1d3d61;
  --blue:#2563eb; --blue-600:#1d4ed8; --blue-50:#eff5ff; --blue-100:#dbe7fe;
  --gray-50:#f5f7fa; --gray-100:#eef1f6; --gray-200:#e2e8f0; --gray-300:#cbd5e1;
  --gray-400:#94a3b8; --gray-500:#64748b; --gray-600:#475569; --gray-700:#334155;
  --white:#ffffff;
  --green:#16a34a; --green-bg:#ecfdf5;
  --amber:#d97706; --amber-bg:#fffbeb;
  --red:#dc2626;  --red-bg:#fef2f2;
  --purple:#7c3aed; --purple-bg:#f5f3ff;
  --radius:10px; --radius-sm:7px; --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(15,37,64,.06),0 1px 3px rgba(15,37,64,.08);
  --shadow:0 4px 16px rgba(15,37,64,.08);
  --shadow-lg:0 18px 50px rgba(15,37,64,.18);
  --sidebar-w:250px;
  --font-en:"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  --font-ar:"Segoe UI","Tahoma","Noto Naskh Arabic","Dubai",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--gray-50);color:var(--gray-700);font-family:var(--font-en);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:var(--font-ar)}
h1,h2,h3,h4{margin:0;color:var(--navy);font-weight:700;line-height:1.35}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--navy);color:#c9d7e8;display:flex;flex-direction:column;position:fixed;inset-block:0;inset-inline-start:0;z-index:60;transition:transform .22s ease}
.sidebar .brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:11px;align-items:center}
.sidebar .brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#60a5fa);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:0 0 auto}
.sidebar .brand b{color:#fff;font-size:14px;display:block;line-height:1.25}
.sidebar .brand span{font-size:11px;color:#8fa8c4;display:block}
.nav{padding:12px 10px;overflow-y:auto;flex:1}
.nav-label{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#6d87a6;padding:14px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);color:#c9d7e8;font-size:13.5px;margin-bottom:2px;transition:.15s;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.nav a .ic{width:18px;text-align:center;flex:0 0 18px}
.sidebar .foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7f97b4}
.main{flex:1;min-width:0;margin-inline-start:var(--sidebar-w);display:flex;flex-direction:column}
.topbar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:17px}
.topbar .sub{font-size:12px;color:var(--gray-500);margin-top:1px}
.topbar .spacer{flex:1}
.content{padding:22px;flex:1}
.hamburger{display:none;background:none;border:1px solid var(--gray-200);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,37,64,.45);z-index:55}
.scrim.show{display:block}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--gray-200);background:var(--white);color:var(--gray-700);padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--gray-50);border-color:var(--gray-300)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-600);border-color:var(--blue-600)}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn-danger{background:var(--white);border-color:#f0c2c2;color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--gray-600)}
.btn-ghost:hover{background:var(--gray-100)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:11px 20px;font-size:14px}
.btn-block{width:100%}

/* ---------- Cards & grid ---------- */
.card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:14.5px}
.card-h .spacer{flex:1}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- KPI ---------- */
.kpi{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi .lbl{font-size:11.5px;color:var(--gray-500);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kpi .val{font-size:27px;font-weight:800;color:var(--navy);margin-top:6px;line-height:1.1}
.kpi .hint{font-size:11.5px;color:var(--gray-500);margin-top:4px}
.kpi .ico{position:absolute;inset-block-start:14px;inset-inline-end:14px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--blue-50);color:var(--blue)}
.kpi.g .ico{background:var(--green-bg);color:var(--green)}
.kpi.a .ico{background:var(--amber-bg);color:var(--amber)}
.kpi.r .ico{background:var(--red-bg);color:var(--red)}
.kpi.p .ico{background:var(--purple-bg);color:var(--purple)}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--gray-700);margin-bottom:6px}
.field .help{font-size:11.5px;color:var(--gray-500);margin-top:5px}
.inp,.sel,.ta{width:100%;padding:9px 11px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);background:var(--white);color:var(--gray-700);transition:.15s}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.ta{min-height:110px;resize:vertical;line-height:1.7}
.sel{cursor:pointer}
.req:after{content:" *";color:var(--red)}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.checkline input{width:16px;height:16px;cursor:pointer;accent-color:var(--blue)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:start;padding:10px 12px;background:var(--gray-50);color:var(--gray-600);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--gray-200);white-space:nowrap}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--blue-50)}
table.tbl tbody tr:last-child td{border-bottom:none}
.tbl .nm{font-weight:700;color:var(--navy)}
.tbl .mut{color:var(--gray-500);font-size:12px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-blue{background:var(--blue-50);color:var(--blue-600)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--gray-100);color:var(--gray-600)}
.b-purple{background:var(--purple-bg);color:var(--purple)}
.b-navy{background:#e8eef6;color:var(--navy)}

/* ---------- Avatar ---------- */
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--navy-3),var(--blue));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:0 0 auto}
.av.lg{width:58px;height:58px;font-size:19px}
.who{display:flex;align-items:center;gap:10px}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--gray-200);overflow-x:auto}
.tabs button{background:none;border:none;padding:11px 16px;font-size:13px;font-weight:700;color:var(--gray-500);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--navy)}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,37,64,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:720px;box-shadow:var(--shadow-lg);margin:auto;animation:pop .18s ease}
.modal.wide{max-width:1000px}
.modal.slim{max-width:480px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:15.5px;flex:1}
.modal-b{padding:20px;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;gap:10px;justify-content:flex-end;background:var(--gray-50);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.x{background:none;border:none;font-size:20px;color:var(--gray-400);cursor:pointer;line-height:1;padding:2px 6px}
.x:hover{color:var(--navy)}

/* ---------- Toast ---------- */
#toasts{position:fixed;inset-block-end:22px;inset-inline-end:22px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;box-shadow:var(--shadow-lg);animation:sl .2s ease;max-width:380px}
.toast.ok{background:var(--green)} .toast.err{background:var(--red)} .toast.warn{background:var(--amber)}
@keyframes sl{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Misc ---------- */
.empty{text-align:center;padding:52px 20px;color:var(--gray-500)}
.empty .e-ic{font-size:38px;margin-bottom:10px;opacity:.5}
.empty h4{color:var(--navy);margin-bottom:6px;font-size:15px}
.sec-title{font-size:12px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.7px;margin:0 0 9px}
.hr{height:1px;background:var(--gray-200);margin:16px 0;border:0}
.mut{color:var(--gray-500)}
.sm{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.pre{white-space:pre-wrap;word-break:break-word}
.list-check{list-style:none;padding:0;margin:0}
.list-check li{padding:6px 0 6px 0;display:flex;gap:9px;align-items:flex-start;font-size:13.2px;border-bottom:1px dashed var(--gray-100)}
.list-check li:last-child{border-bottom:none}
.list-check li .mk{flex:0 0 auto;font-weight:800}
.list-num{counter-reset:s;list-style:none;padding:0;margin:0}
.list-num li{counter-increment:s;padding:7px 0;display:flex;gap:10px;font-size:13.2px;border-bottom:1px dashed var(--gray-100)}
.list-num li:last-child{border-bottom:none}
.list-num li:before{content:counter(s);flex:0 0 22px;height:22px;border-radius:50%;background:var(--blue-50);color:var(--blue-600);font-weight:800;font-size:11.5px;display:grid;place-items:center}
.note{padding:12px 14px;border-radius:var(--radius-sm);font-size:12.8px;border:1px solid}
.note-blue{background:var(--blue-50);border-color:var(--blue-100);color:#1e40af}
.note-amber{background:var(--amber-bg);border-color:#fde68a;color:#92400e}
.note-red{background:var(--red-bg);border-color:#fecaca;color:#991b1b}
.note-green{background:var(--green-bg);border-color:#bbf7d0;color:#166534}
.hrbox{border:1.5px dashed #f0b429;background:#fffdf5;border-radius:var(--radius);padding:16px}
.hrbox .tag{display:inline-block;background:#f0b429;color:#4a3000;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.5px;margin-bottom:10px}
.msgbox{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:14px;white-space:pre-wrap;font-size:13px;line-height:1.85;max-height:320px;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--gray-100);color:var(--gray-600);padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.bar{height:7px;background:var(--gray-200);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:6px}
.score-ring{width:96px;height:96px;flex:0 0 auto}
.dim{margin-bottom:11px}
.dim .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:4px}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:12px}
.selrow{background:var(--blue-50)!important}
.load{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.load.dark{border-color:var(--gray-300);border-top-color:var(--blue)}
@keyframes sp{to{transform:rotate(360deg)}}
.overlay-load{position:fixed;inset:0;background:rgba(255,255,255,.82);z-index:150;display:none;place-items:center;text-align:center}
.overlay-load.show{display:grid}
.overlay-load .box{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:28px 40px;box-shadow:var(--shadow-lg);min-width:280px}
.overlay-load .box b{display:block;color:var(--navy);margin-top:12px;font-size:14px}
.overlay-load .box span{font-size:12px;color:var(--gray-500)}
.lang-sw{display:flex;border:1px solid var(--gray-200);border-radius:8px;overflow:hidden}
.lang-sw button{border:none;background:var(--white);padding:6px 11px;font-size:12px;font-weight:700;color:var(--gray-500);cursor:pointer}
.lang-sw button.active{background:var(--navy);color:#fff}
.aistat{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--gray-100);color:var(--gray-600);cursor:pointer}
.aistat .dot{width:7px;height:7px;border-radius:50%;background:var(--gray-400)}
.aistat.on{background:var(--green-bg);color:var(--green)} .aistat.on .dot{background:var(--green)}
.aistat.off{background:var(--amber-bg);color:var(--amber)} .aistat.off .dot{background:var(--amber)}

/* ---------- Print ---------- */
@media print{
  .sidebar,.topbar,.no-print,#toasts{display:none!important}
  .main{margin:0!important} .content{padding:0!important}
  body{background:#fff}
  .card{box-shadow:none;border-color:#ddd;break-inside:avoid}
}

/* ---------- Responsive ---------- */
@media (max-width:1200px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:980px){ .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .sidebar{transform:translateX(-100%)} html[dir="rtl"] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:none!important}
  .main{margin-inline-start:0}
  .hamburger{display:block}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .content{padding:14px}
  .topbar{padding:10px 14px}
  .modal-b{max-height:none}
  .modal-bg{padding:10px}
}
@media (max-width:560px){
  #aiStatusTxt{display:none}
  .aistat{padding:6px 8px}
  .topbar{gap:8px}
  .topbar h1{font-size:15px}
  .topbar .sub{display:none}
  .lang-sw button{padding:6px 8px;font-size:11.5px}
  .kpi .val{font-size:23px}
  .btn{padding:7px 11px}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <b data-i18n="app.name">AI Task System</b>
        <span data-i18n="app.tagline">HR Task &amp; Evaluation</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label" data-i18n="nav.main">Main</div>
      <a data-route="dashboard"><span class="ic">◲</span><span data-i18n="nav.dashboard">Dashboard</span></a>
      <a data-route="employees"><span class="ic">☰</span><span data-i18n="nav.employees">Employees</span></a>
      <div class="nav-label" data-i18n="nav.tasks">Tasks</div>
      <a data-route="generate"><span class="ic">✦</span><span data-i18n="nav.generate">Generate Tasks</span></a>
      <a data-route="library"><span class="ic">▤</span><span data-i18n="nav.library">Task Library</span></a>
      <a data-route="evaluations"><span class="ic">✓</span><span data-i18n="nav.evaluations">Evaluations</span></a>
      <div class="nav-label" data-i18n="nav.insights">Insights</div>
      <a data-route="reports"><span class="ic">▦</span><span data-i18n="nav.reports">Reports</span></a>
      <a data-route="settings"><span class="ic">⚙</span><span data-i18n="nav.settings">Settings</span></a>
    </nav>
    <div class="foot">
      <div id="storageInfo">—</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger no-print" id="burger">☰</button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <div class="aistat no-print" id="aiStatus" title=""><span class="dot"></span><span id="aiStatusTxt">—</span></div>
      <div class="lang-sw no-print">
        <button data-lang="ar">عربي</button>
        <button data-lang="en">EN</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="overlay-load" id="busy"><div class="box"><span class="load dark" style="width:26px;height:26px;border-width:3px"></span><b id="busyTitle">Working…</b><span id="busyMsg"></span></div></div>
<div id="toasts"></div>
<script>
"use strict";

/* ======= 01-i18n.js ======= */
/* ============================================================
   i18n — Arabic / English with full RTL support
   ============================================================ */
const I18N = {
  en: {
    "app.name":"AI Task System","app.tagline":"HR Task & Evaluation",
    "nav.main":"Main","nav.tasks":"Tasks","nav.insights":"Insights",
    "nav.dashboard":"Dashboard","nav.employees":"Employees","nav.generate":"Generate Tasks",
    "nav.library":"Task Library","nav.evaluations":"Evaluations","nav.reports":"Reports","nav.settings":"Settings",

    "common.save":"Save","common.cancel":"Cancel","common.delete":"Delete","common.edit":"Edit","common.close":"Close",
    "common.search":"Search","common.filter":"Filters","common.reset":"Reset","common.all":"All","common.none":"None",
    "common.yes":"Yes","common.no":"No","common.actions":"Actions","common.view":"View","common.back":"Back",
    "common.confirm":"Confirm","common.copy":"Copy","common.copied":"Copied to clipboard","common.export":"Export",
    "common.print":"Print / PDF","common.excel":"Excel","common.word":"Word","common.pdf":"PDF","common.csv":"CSV",
    "common.select":"Select","common.selectAll":"Select all","common.clear":"Clear","common.date":"Date","common.status":"Status",
    "common.score":"Score","common.of":"of","common.results":"results","common.loading":"Loading…","common.working":"Working…",
    "common.required":"This field is required","common.saved":"Saved successfully","common.deleted":"Deleted",

  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

  if(!d) return "—";

  const y = dt.getFullYear(), m = String(dt.getMonth()+1).padStart(2,"0"), day = String(dt.getDate()).padStart(2,"0");

/* deterministic pseudo random from a string seed — keeps variations stable */
function seedRand(seed){
  let h = 2166136261;
  const s = String(seed);
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){ h += 0x6D2B79F5; let x = Math.imul(h ^ (h>>>15), 1|h); x ^= x + Math.imul(x ^ (x>>>7), 61|x); return ((x ^ (x>>>14))>>>0)/4294967296; };
}
function pick(arr, rnd){ return arr[Math.floor(rnd()*arr.length) % arr.length]; }
function shuffle(arr, rnd){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); const tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
  return a;
}

/* ============================================================
   Data layer
   -----------------------------------------------------------
   All persistence goes through StorageAdapter. The default is
   LocalStorageAdapter. To move to Supabase / Firebase later you
   only implement the same 4 methods (read / write / all / clear)
   and swap the adapter in DB.use(...). No view code changes.
   ============================================================ */
const SCHEMA_VERSION = 1;
const NS = "aitms.v1.";

const LocalStorageAdapter = {
  name: "localStorage",
  read(coll){
    try { return JSON.parse(localStorage.getItem(NS + coll) || "[]"); }
    catch(e){ console.warn("read failed", coll, e); return []; }
  },
  write(coll, rows){
    try { localStorage.setItem(NS + coll, JSON.stringify(rows)); return true; }
    catch(e){
      console.error(e);
      toast(isRTL() ? "تعذّر الحفظ — مساحة التخزين ممتلئة" : "Save failed — storage is full", "err", 5000);
      return false;
    }
  },
  readObj(key, def){
    try { const v = localStorage.getItem(NS + key); return v ? JSON.parse(v) : def; }
    catch(e){ return def; }
  },
  writeObj(key, obj){
    try { localStorage.setItem(NS + key, JSON.stringify(obj)); return true; } catch(e){ return false; }
  },
  clearAll(){ Object.keys(localStorage).filter(k=>k.indexOf(NS)===0).forEach(k=>localStorage.removeItem(k)); },
  usage(){
    let bytes = 0;
    Object.keys(localStorage).filter(k=>k.indexOf(NS)===0).forEach(k=> bytes += (localStorage.getItem(k)||"").length*2 + k.length*2);
    return bytes;
  }
};

/* Example of the interface a future backend adapter must satisfy:
const SupabaseAdapter = {
  name:"supabase",
  async read(coll){ const {data} = await sb.from(coll).select("*"); return data; },
  async write(coll, rows){ ... upsert ... },
  ...
}
Because every call site goes through DB.*, only DB needs to become async.
*/

const COLLECTIONS = ["employees","tasks","submissions","evaluations","reports"];

const DEFAULT_SETTINGS = {
  schema: SCHEMA_VERSION,
  orgName: "",
  lang: "ar",
  taskLang: "ar",
  provider: "offline",          // offline | openai | anthropic | gemini | openrouter | custom
  apiKey: "",
  model: "",
  baseUrl: "",
  temperature: 0.6,
  redactPII: true,
  useProxy: false,
  proxyUrl: "",
  defaultDeadlineDays: 5
};

const DB = {
  adapter: LocalStorageAdapter,
  cache: {},
  listeners: [],
  use(a){ this.adapter = a; this.cache = {}; },
  init(){
    COLLECTIONS.forEach(c => { this.cache[c] = this.adapter.read(c); });
    this.settings = Object.assign({}, DEFAULT_SETTINGS, this.adapter.readObj("settings", {}));
  },
  all(coll){ return this.cache[coll] || []; },
  get(coll, id){ return this.all(coll).find(r => r.id === id) || null; },
  where(coll, fn){ return this.all(coll).filter(fn); },
  insert(coll, row){
    row.id = row.id || uid(coll.slice(0,3));
    row.createdAt = row.createdAt || new Date().toISOString();
    row.updatedAt = row.createdAt;
    this.cache[coll] = this.all(coll).concat([row]);
    this.adapter.write(coll, this.cache[coll]);
    this.emit(coll);
    return row;
  },
  insertMany(coll, rows){
    const now = new Date().toISOString();
    rows.forEach(r => { r.id = r.id || uid(coll.slice(0,3)); r.createdAt = r.createdAt || now; r.updatedAt = now; });
    this.cache[coll] = this.all(coll).concat(rows);
    this.adapter.write(coll, this.cache[coll]);
    this.emit(coll);
    return rows;
  },
  update(coll, id, patch){
    const rows = this.all(coll);
    const i = rows.findIndex(r => r.id === id);
    if (i < 0) return null;
    rows[i] = Object.assign({}, rows[i], patch, {updatedAt: new Date().toISOString()});
    this.cache[coll] = rows;
    this.adapter.write(coll, rows);
    this.emit(coll);
    return rows[i];
  },
  remove(coll, id){
    this.cache[coll] = this.all(coll).filter(r => r.id !== id);
    this.adapter.write(coll, this.cache[coll]);
    this.emit(coll);
  },
  removeWhere(coll, fn){
    this.cache[coll] = this.all(coll).filter(r => !fn(r));
    this.adapter.write(coll, this.cache[coll]);
    this.emit(coll);
  },
  saveSettings(patch){
    this.settings = Object.assign({}, this.settings, patch);
    this.adapter.writeObj("settings", this.settings);
    this.emit("settings");
    return this.settings;
  },
  emit(coll){ this.listeners.forEach(fn => { try{ fn(coll); }catch(e){ console.error(e); } }); },
  onChange(fn){ this.listeners.push(fn); },

  /* ---- backup / restore ---- */
  exportAll(){
    const out = { schema: SCHEMA_VERSION, exportedAt: new Date().toISOString(), settings: Object.assign({}, this.settings, {apiKey:""}) };
    COLLECTIONS.forEach(c => out[c] = this.all(c));
    return out;
  },
  importAll(obj, merge){
    if (!obj || typeof obj !== "object") throw new Error("bad");
    COLLECTIONS.forEach(c => {
      if (!Array.isArray(obj[c])) return;
      const rows = merge ? this.all(c).concat(obj[c].filter(r => !this.get(c, r.id))) : obj[c];
      this.cache[c] = rows;
      this.adapter.write(c, rows);
    });
    if (obj.settings) this.saveSettings(Object.assign({}, obj.settings, {apiKey: this.settings.apiKey}));
    this.emit("*");
  },
  wipe(){ this.adapter.clearAll(); this.init(); this.emit("*"); }
};

  };

/* ---------- family detection ---------- */
function detectFamily(jobTitle, jd, department){
  const hay = ((jobTitle||"") + " " + (department||"") + " " + (jd||"")).toLowerCase();
  const titleHay = ((jobTitle||"") + " " + (department||"")).toLowerCase();
  let best = null, bestScore = 0;
  KB.forEach(fam => {
    let score = 0;
    fam.match.forEach(kw => {
      const k = kw.toLowerCase().trim();
      if (!k) return;
      if (titleHay.indexOf(k) >= 0) score += 6;
      else if (hay.indexOf(k) >= 0) score += 2;
    });
    if (score > bestScore){ bestScore = score; best = fam; }
  });
  return bestScore >= 4 ? best : null;
}
function familyName(fam){ return fam ? fam[isRTL()?"ar":"en"].name : null; }

/* ---------- job-description parsing ----------
   Used when no family matches, and to inject real JD wording into
   every generated task so the task is always tied to the actual job. */
const STOPWORDS_EN = "the a an and or of to for with in on at by from as is are be will shall must should any all other their our your his her its this that these those which who whom whose within into per across including etc".split(" ");
const STOPWORDS_AR = "في من على عن الى إلى مع أو و ثم التي الذي هذا هذه ذلك تلك كل بعض جميع أي كما بما عند لدى بين حول قد لقد كان يكون تكون سوف يجب ينبغي كذلك أيضا حيث بحسب وفق وفقا خلال ضمن لدي عبر".split(" ");

function jdSentences(jd){
  if (!jd) return [];
  return String(jd)
    .split(/[\n•\-–—;؛\.۔]|(?:\d+[\).])/g)
    .map(s => s.replace(/\s+/g," ").trim())
    .filter(s => s.length >= 18 && s.length <= 240);
}
function jdKeywords(jd, limit){
  if (!jd) return [];
  const words = String(jd).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(Boolean);
  const stop = STOPWORDS_EN.concat(STOPWORDS_AR);
  const freq = {};
  words.forEach(w => {
    if (w.length < 3 || stop.indexOf(w) >= 0) return;
    freq[w] = (freq[w]||0)+1;
  });
  return Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0, limit||12);
}
/* Build ad-hoc competencies straight out of the job description */
function competenciesFromJD(emp, lang){
  const sents = jdSentences(emp.jd);
  const ar = lang === "ar";
  const out = [];
  sents.slice(0, 8).forEach((s, i) => {
    const short = s.length > 90 ? s.slice(0, 88) + "…" : s;
    out.push({
      id: "jd_" + i,
      fromJD: true,
      raw: s,
      n: short,
      f: ar ? ("تنفيذ وتحسين المسؤولية التالية من وصفك الوظيفي: " + s) : ("executing and improving this responsibility from your job description: " + s),
      meth: ar
        ? "ابدأ بتوضيح الوضع الحالي، ثم حدّد المعايير التي يُقاس عليها الأداء، ثم قدّم خطوات تنفيذ مرتبة مع الأدلة والأرقام."
        : "Start from the current situation, define how performance is measured, then give ordered execution steps supported by evidence and numbers.",
      d: ar
        ? ["وصف الوضع الحالي والمعطيات المستخدمة","الخطوات التنفيذية مرتبة","المعايير أو المؤشرات المستخدمة","المخاطر أو المعوقات المتوقعة","التوصية النهائية"]
        : ["Current situation and inputs used","Ordered execution steps","Standards or KPIs applied","Expected risks or obstacles","Final recommendation"],
      k: ar
        ? ["ربط الإجابة مباشرة بالمسؤولية المذكورة في الوصف الوظيفي","تقديم خطوات تنفيذية واضحة وقابلة للتطبيق","استخدام معايير أو مؤشرات لقياس النتيجة","ذكر الافتراضات والمعطيات المستخدمة","الختام بتوصية عملية محددة"]
        : ["Ties the answer directly to the responsibility in the job description","Gives clear, executable steps","Uses standards or KPIs to measure the outcome","States the assumptions and inputs used","Ends with a specific, practical recommendation"],
      m: ar
        ? ["إجابة عامة لا ترتبط بالمسؤولية المذكورة","سرد نظري بلا خطوات تنفيذية","غياب أي مؤشر أو معيار للقياس"]
        : ["A generic answer not tied to the stated responsibility","Theory with no execution steps","No measure or standard applied"]
    });
  });
  return out;
}

/* simulated data blocks — keeps the employee from inventing facts */
function buildGiven(comp, emp, type, rnd, lang){
  const ar = lang === "ar";
  const monthsEn = ["Month 1","Month 2","Month 3","Month 4","Month 5","Month 6"];
  const monthsAr = ["الشهر 1","الشهر 2","الشهر 3","الشهر 4","الشهر 5","الشهر 6"];
  const months = ar ? monthsAr : monthsEn;
  const base = 400 + Math.floor(rnd()*900);
  const trend = (rnd() > .45 ? 1 : -1) * (0.02 + rnd()*0.08);
  const series = months.map((m,i) => {
    const season = 1 + Math.sin((i+1)/2) * 0.09;
    const noise  = 1 + (rnd()-0.5) * 0.10;
    return m + ": " + Math.round(base * Math.pow(1+trend, i) * season * noise);
  });
  const given = [];
  const needsData = ["analytical","case","report","problem"].indexOf(type) >= 0;
  if (needsData){
    given.push((ar ? "سلسلة بيانات محاكاة لآخر 6 فترات (وحدات/عدد): " : "Simulated series for the last 6 periods (units / count): ") + series.join(" | "));
    given.push(ar
      ? "مدة التوريد / مدة التنفيذ المعتمدة: " + (5 + Math.floor(rnd()*20)) + " يومًا، ومستوى الخدمة المستهدف: " + (90 + Math.floor(rnd()*8)) + "%."
      : "Assumed lead / processing time: " + (5 + Math.floor(rnd()*20)) + " days, target service level: " + (90 + Math.floor(rnd()*8)) + "%.");
    given.push(ar
      ? "حدث خلال الفترة 4 حدث استثنائي (عرض ترويجي / توقف مؤقت) أثّر على الأرقام."
      : "In period 4 an exceptional event (promotion / temporary stoppage) affected the numbers.");
  } else {
    given.push(ar
      ? "الفريق المعني يتكون من 4 أشخاص، والوقت المتاح لإنجاز المهمة محدود بأسبوع عمل واحد."
      : "The team involved is 4 people and the available window is one working week.");
    given.push(ar
      ? "لا توجد ميزانية إضافية؛ الحل يجب أن يعتمد على الموارد الحالية."
      : "There is no extra budget; the solution must work with existing resources.");
  }
  given.push(ar
    ? "أي معلومة غير مذكورة هنا يجب أن تُكتب كافتراض صريح في إجابتك، ولا يجوز اختلاق بيانات حقيقية عن الشركة."
    : "Anything not stated here must be written as an explicit assumption in your answer. Do not invent real company data.");
  return given;
}

function buildOfflineTask(emp, opts, idx, salt){
  const lang = opts.lang || "ar";
  const ar   = lang === "ar";
  const rnd  = seedRand((emp.id||"e") + "|" + (opts.difficulty||"medium") + "|" + (opts.type||"mixed") + "|" + idx + "|" + (salt||""));
  const fam  = detectFamily(emp.jobTitle, emp.jd, emp.department);

  /* competency pool: KB family competencies first (fully localised), then
     competencies extracted straight from the employee's own job description */
  let famComps = fam ? fam.comps.map(c => Object.assign({id:c.id, family:fam.key}, c[lang])) : [];
  let jdComps = competenciesFromJD(emp, lang);
  if (opts.focus){
    const f = opts.focus.toLowerCase();
    const rank = (list) => {
      const hit = list.filter(c => (c.n+" "+c.f).toLowerCase().indexOf(f) >= 0);
      return hit.length ? hit.concat(list.filter(c => hit.indexOf(c) < 0)) : list;
    };
    famComps = rank(famComps); jdComps = rank(jdComps);
  }
  const ord = seedRand(emp.id + "|order|" + (salt||""));
  let pool = shuffle(famComps, ord).concat(shuffle(jdComps, ord));
  if (!pool.length) pool = competenciesFromJD({jd: (emp.jobTitle||"") + ". " + (emp.department||"")}, lang);
  if (!pool.length) pool = [{
    id:"generic", n: ar? "المسؤوليات الأساسية للوظيفة" : "Core job responsibilities",
    f: ar? ("أداء المسؤوليات الأساسية لوظيفة " + (emp.jobTitle||"")) : ("performing the core responsibilities of a " + (emp.jobTitle||"role")),
    meth: ar? "وضّح الوضع الحالي، ثم الخطوات، ثم النتيجة المتوقعة." : "Describe the situation, then the steps, then the expected result.",
    d: ar? ["الخطوات التنفيذية","المعايير المستخدمة","النتيجة المتوقعة","المخاطر","التوصية"] : ["Execution steps","Standards applied","Expected result","Risks","Recommendation"],

    m: ar? ["إجابة عامة","لا توجد خطوات","بلا مؤشرات"] : ["Generic answer","No steps","No measures"]
  }];

  const comp = pool[idx % pool.length];

  const type = (!opts.type || opts.type === "mixed") ? pick(TYPES, rnd) : opts.type;
  const diff = opts.difficulty || "medium";
  const meta = DIFF_META[diff] || DIFF_META.medium;

  const job  = emp.jobTitle || (ar ? "الموظف" : "the employee");
  const dept = emp.department || (ar ? "إدارتك" : "your department");

      .split("{job}").join(job).split("{dept}").join(dept).split("{focus}").join(comp.f);

  const titlePrefix = ar
    ? {practical:"مهمة عملية",analytical:"مهمة تحليلية",problem:"حل مشكلة",case:"دراسة حالة",research:"مهمة بحثية",report:"تقرير",scenario:"سيناريو"}[type]
    : {practical:"Practical Task",analytical:"Analysis",problem:"Problem Solving",case:"Case Study",research:"Research Task",report:"Report",scenario:"Scenario"}[type];

  const given = buildGiven(comp, emp, type, rnd, lang);
  const deliverable = comp.d.slice(0, Math.min(comp.d.length, 3 + meta.depth));

  const instructions = ar ? [
    "اقرأ السيناريو والمعطيات بعناية، ولا تفترض معلومات غير مذكورة إلا بذكرها صراحة كافتراض.",
    meta.guide ? ("المنهجية المقترحة: " + comp.meth) : "اختر المنهجية المناسبة بنفسك وبرّر سبب اختيارها مقارنة ببديل واحد على الأقل.",
    "قدّم جميع بنود «المخرج المطلوب» بالترتيب وبعناوين واضحة.",
    "ادعم إجابتك بأرقام أو أدلة كلما أمكن، وبيّن طريقة الحساب.",
    "اختم بتوصية عملية واحدة قابلة للتنفيذ مع مسؤول وتاريخ."
  ] : [
    "Read the scenario and the given data carefully. Do not assume anything that is not stated unless you write it down as an explicit assumption.",
    meta.guide ? ("Suggested methodology: " + comp.meth) : "Choose your own methodology and justify it against at least one alternative.",
    "Deliver every item of the required deliverable, in order, under clear headings.",

  const steps = ar ? [

  ];

  const expectedAnswer = ar
    ? ("الإجابة القوية تعالج " + comp.f + " بشكل منظم: تبدأ بتحديد المعطيات والافتراضات، ثم تطبّق منهجية واضحة (" + comp.meth + ") ، ثم تعرض جميع بنود المخرج المطلوب (" + deliverable.join("، ") + ") بأرقام أو أدلة، وتنتهي بتوصية محددة قابلة للتنفيذ. الإجابة المقبولة تغطي أغلب النقاط الأساسية أدناه حتى لو اختلفت الصياغة أو المنهجية، فالمعيار هو صحة المعنى والمنطق وليس تطابق الكلمات.")
    : ("A strong answer handles " + comp.f + " in a structured way: it starts by separating the given data from the assumptions, applies a clear methodology (" + comp.meth + "), presents every required deliverable (" + deliverable.join(", ") + ") with numbers or evidence, and closes with a specific, actionable recommendation. An acceptable answer covers most of the key points below even if the wording or the chosen method differs — what matters is the reasoning, not matching words.");

  const criteria = ar ? [
    {name:"الدقة", weight:25, description:"صحة الحسابات والمعلومات والمنهجية المستخدمة، وخلوّ الإجابة من الأخطاء الجوهرية."},
    {name:"الاكتمال", weight:25, description:"تغطية جميع بنود المخرج المطلوب دون نقص."},
    {name:"الفهم", weight:20, description:"فهم سياق المهمة ومسؤوليات الوظيفة وليس مجرد إعادة صياغة السؤال."},
    {name:"حل المشكلات", weight:15, description:"جودة التحليل وربط السبب بالنتيجة والمفاضلة بين البدائل."},
    {name:"التطبيق العملي", weight:15, description:"قابلية التنفيذ الفعلي: خطوات محددة، مسؤول، تاريخ، وأرقام."}
  ] : [
    {name:"Accuracy", weight:25, description:"Correctness of the calculations, facts and methodology; no material errors."},
    {name:"Completeness", weight:25, description:"Every required deliverable item is covered."},
    {name:"Understanding", weight:20, description:"Real understanding of the context and the role, not a restatement of the question."},
    {name:"Problem Solving", weight:15, description:"Quality of the analysis, cause-effect reasoning and trade-offs between options."},
    {name:"Practical Application", weight:15, description:"Can actually be executed: concrete steps, owner, date and numbers."}
  ];

  const rubric = ar ? [
    {band:"ممتاز", range:"90-100", description:"يغطي جميع البنود بدقة، منهجية واضحة ومبررة، أرقام صحيحة، وتوصية قابلة للتنفيذ فورًا."},
    {band:"جيد", range:"75-89", description:"يغطي معظم البنود بمنهجية سليمة مع نقص محدود في التفاصيل أو الأدلة."},
    {band:"مقبول", range:"60-74", description:"فهم أساسي صحيح لكن مع نقص في التغطية أو ضعف في الأدلة والأرقام."},
    {band:"يحتاج تحسين", range:"أقل من 60", description:"إجابة عامة أو ناقصة أو غير مرتبطة بالمعطيات والمسؤوليات."}
  ] : [
    {band:"Excellent", range:"90-100", description:"All items covered accurately, methodology clear and justified, numbers correct, recommendation immediately actionable."},
    {band:"Good", range:"75-89", description:"Most items covered with a sound method; limited gaps in detail or evidence."},
    {band:"Acceptable", range:"60-74", description:"Basic understanding is right but coverage is incomplete or evidence is weak."},
    {band:"Needs Improvement", range:"below 60", description:"Generic, incomplete, or disconnected from the given data and the role."}

  return {
    title: titlePrefix + ": " + comp.n,
    scenario: opener,
    given: given,
    objective: objective,
    instructions: instructions,
    deliverable: deliverable,
    difficulty: diff,
    type: type,
    estimatedTime: meta.time,
    competency: comp.n,
    competencyId: comp.id,
    family: fam ? fam.key : "jd",
    lang: lang,
    isSimulation: true,
    solution: {
      expectedAnswer: expectedAnswer,
      steps: steps,
      keyPoints: comp.k,
      criteria: criteria,
      commonMistakes: comp.m,
      rubric: rubric

  };
}
function levelLabelIn(level, lang){
  const m = {en:{junior:"Junior",mid:"Mid-Level",senior:"Senior",manager:"Manager"},
             ar:{junior:"مبتدئ",mid:"متوسط",senior:"خبير",manager:"مدير"}};
  return (m[lang]||m.en)[level] || (m[lang]||m.en).mid;
}

/* ============================================================
   Offline evaluation — multi-signal, not plain keyword matching
   ============================================================ */
const AR_DIACRITICS = /[ً-ْٰـ]/g;
function normText(s){
  return String(s||"")
    .toLowerCase()
    .replace(AR_DIACRITICS,"")
    .replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[^\p{L}\p{N}\s%]/gu," ")
    .replace(/\s+/g," ").trim();
}
function stem(w){
  if (/[؀-ۿ]/.test(w)){
    let x = w;
    x = x.replace(/^(وال|بال|فال|كال|ال|و|ف|ب|ل|ك)/,"");
    x = x.replace(/(ات|ون|ين|ان|ها|هم|هن|كم|نا|يه|ية|يه)$/,"");
    return x.length >= 3 ? x : w;
  }
  return w.replace(/(ing|ed|es|s)$/,"").replace(/(ies)$/,"y");
}
const STOP_ALL = new Set(STOPWORDS_EN.concat(STOPWORDS_AR).concat(
  "على من في عن مع الى إلى هذا هذه ذلك التي الذي كل بعض كان يكون قد ما لا نعم بين حول عند لدى".split(" ")));
function tokens(s){
  return normText(s).split(" ").filter(w => w.length >= 3 && !STOP_ALL.has(w)).map(stem);
}
/* concept groups let a different wording still count as covered */
const CONCEPTS = [
  ["method","methodology","approach","منهج","منهجيه","طريقه","اسلوب"],
  ["assumption","assume","افتراض","افتراضات","نفترض"],
  ["risk","مخاطر","خطر","تهديد"],
  ["recommend","recommendation","اوصي","توصيه","توصيات","مقترح","اقترح"],
  ["trend","اتجاه","نمو","تراجع","انخفاض","ارتفاع"],
  ["season","seasonality","موسم","موسميه"],
  ["accuracy","error","mape","دقه","خطا","انحراف","انحياز"],
  ["cause","root","سبب","اسباب","جذري"],
  ["owner","responsible","مسؤول","المسؤول","مالك"],
  ["deadline","date","timeline","تاريخ","موعد","جدول","زمني"],
  ["cost","تكلفه","تكاليف","ميزانيه"],
  ["policy","سياسه","نظام","لائحه","اجراء","إجراء"],
  ["document","توثيق","مستند","سجل","ارشفه"],
  ["kpi","metric","measure","مؤشر","مؤشرات","قياس","معيار","معايير"],
  ["compare","comparison","مقارنه","قارن","مقابل"],
  ["step","خطوه","خطوات","مرحله","مراحل"],
  ["service","level","خدمه","مستوى"],
  ["stock","inventory","مخزون","رصيد","تغطيه"],
  ["forecast","تنبؤ","توقع","خطه الطلب"],
  ["quality","جوده","مطابقه"],
  ["train","coach","تدريب","توجيه","تطوير"],
  ["escalate","تصعيد","رفع"],
  ["evidence","دليل","ادله","اثبات","مرفق"]
];
const CONCEPT_INDEX = (function(){
  const m = {};
  CONCEPTS.forEach((g, i) => g.forEach(w => { m[stem(normText(w))] = i; }));
  return m;
})();
function conceptSet(toks){
  const s = new Set();
  toks.forEach(w => { const c = CONCEPT_INDEX[w]; if (c !== undefined) s.add("c"+c); });
  return s;
}
function coverageOf(target, answerToks, answerConcepts){
  const tt = tokens(target);
  if (!tt.length) return 0;
  const aset = new Set(answerToks);
  let hits = 0;
  const seen = new Set();
  tt.forEach(w => {
    if (seen.has(w)) return; seen.add(w);
    if (aset.has(w)) { hits++; return; }
    const c = CONCEPT_INDEX[w];
    if (c !== undefined && answerConcepts.has("c"+c)) { hits += 0.9; return; }
    // partial (prefix) match handles morphology the stemmer missed
    for (const a of aset){ if (a.length>4 && (a.indexOf(w)===0 || w.indexOf(a)===0)) { hits += 0.75; return; } }
  });
  return clamp(hits / seen.size, 0, 1);
}

function evaluateOffline(task, answerText){
  const ans = String(answerText||"");
  const lang = task.lang || "ar";
  const ar = lang === "ar";
  const aToks = tokens(ans);
  const aCon  = conceptSet(aToks);
  const sol = task.solution || {};
  const keyPoints = sol.keyPoints || [];
  const deliver   = task.deliverable || [];
  const mistakes  = sol.commonMistakes || [];

  const words = ans.trim().split(/\s+/).filter(Boolean).length;
  const lines = ans.split(/\n/).filter(l => l.trim().length > 1).length;
  const hasNumbers   = (ans.match(/\d+([.,]\d+)?/g) || []).length;
  const hasPercent   = /%|بالمائه|بالمئة|percent/i.test(ans);
  const hasStructure = /(^|\n)\s*([-•*]|\d+[\).])/.test(ans) || lines >= 4;
  const reasonRe = ar
    ? /(لان|بسبب|بالتالي|لذلك|نتيجه|السبب|مما ادى|يترتب|وبناء عليه|مقارنه|بينما|في المقابل)/
    : /(because|therefore|as a result|due to|which means|caused by|compared to|whereas|however|trade-?off)/i;
  const actionRe = ar
    ? /(اوصي|نوصي|التوصيه|خطه|خطوات|سنقوم|يجب|المسؤول|تاريخ|خلال|موعد)/
    : /(recommend|action plan|next step|owner|by \d|deadline|within \d|we will|should)/i;
  const normAns = normText(ans);
  const normDesc = normText((task.scenario||"") + " " + (task.instructions||[]).join(" "));
  // how much of the answer is just the question copied back
  let copied = 0;
  if (normDesc.length > 40){
    const dToks = new Set(tokens(normDesc));
    const same = aToks.filter(w => dToks.has(w)).length;
    copied = aToks.length ? same / aToks.length : 0;
  }

  /* --- key point coverage --- */
  const kpCov = keyPoints.map(k => coverageOf(k, aToks, aCon));
  const kpScore = kpCov.length ? avg(kpCov) : 0.5;
  /* --- deliverable coverage --- */
  const dCov = deliver.map(d => coverageOf(d, aToks, aCon));
  const dScore = dCov.length ? avg(dCov) : 0.5;
  /* --- mistakes detected --- */
  const mistakeHits = mistakes.filter(m => coverageOf(m, aToks, aCon) > 0.72).length;

  /* --- length adequacy: enough substance for the difficulty --- */
  const expectWords = {easy:90, medium:160, hard:260, expert:360}[task.difficulty] || 160;
  const lenFactor = clamp(words / expectWords, 0, 1.15);

  /* --- dimensions (0..100) --- */
  let accuracy = 100 * (0.60*kpScore + 0.20*clamp(hasNumbers/4,0,1) + 0.20*(reasonRe.test(ans)?1:0.35));
  accuracy -= mistakeHits * 9;
  let completeness = 100 * (0.65*dScore + 0.20*clamp(lenFactor,0,1) + 0.15*(hasStructure?1:0.3));
  let understanding = 100 * (0.55*kpScore + 0.25*(reasonRe.test(ans)?1:0.3) + 0.20*(1-clamp(copied*1.4,0,1)));
  let problem = 100 * (0.45*kpScore + 0.30*(reasonRe.test(ans)?1:0.25) + 0.25*clamp((hasNumbers?1:0.4) * (hasPercent?1:0.85),0,1));
  let practical = 100 * (0.40*dScore + 0.30*(actionRe.test(ans)?1:0.3) + 0.30*(hasStructure?1:0.35));

  /* very short or empty answers cannot score well */
  if (words < 25){ const f = clamp(words/25, 0.05, 1); accuracy*=f; completeness*=f; understanding*=f; problem*=f; practical*=f; }

  const dims = {
    accuracy: clamp(Math.round(accuracy),0,100),
    completeness: clamp(Math.round(completeness),0,100),
    understanding: clamp(Math.round(understanding),0,100),
    problemSolving: clamp(Math.round(problem),0,100),
    practicalApplication: clamp(Math.round(practical),0,100)
  };
  const score = clamp(Math.round(
    dims.accuracy*0.25 + dims.completeness*0.25 + dims.understanding*0.20 +
    dims.problemSolving*0.15 + dims.practicalApplication*0.15), 0, 100);

  /* --- narrative --- */
  const strengths = [];
  const improvements = [];
  keyPoints.forEach((k,i) => { if (kpCov[i] >= 0.6) strengths.push(k); });
  keyPoints.forEach((k,i) => { if (kpCov[i] < 0.4) improvements.push((ar? "لم تُعالج بوضوح: " : "Not clearly addressed: ") + k); });
  deliver.forEach((d,i) => { if (dCov[i] < 0.35) improvements.push((ar? "بند ناقص من المخرج المطلوب: " : "Missing deliverable item: ") + d); });
  if (hasNumbers < 2) improvements.push(ar ? "دعّم الإجابة بأرقام أو حسابات واضحة." : "Support the answer with explicit numbers or calculations.");
  if (!reasonRe.test(ans)) improvements.push(ar ? "اربط النتائج بأسبابها (لماذا حدث ذلك وماذا يترتب عليه)." : "Connect findings to their causes (why it happened and what follows).");
  if (!actionRe.test(ans)) improvements.push(ar ? "اختم بتوصية تنفيذية محددة مع مسؤول وتاريخ." : "Close with a specific recommendation, an owner and a date.");
  if (copied > 0.55) improvements.push(ar ? "جزء كبير من الإجابة إعادة صياغة لنص المهمة — أضف تحليلك أنت." : "A large part of the answer restates the task text — add your own analysis.");
  if (mistakeHits) improvements.push(ar ? "ظهرت مؤشرات على أخطاء شائعة مذكورة في معايير التقييم." : "Signals of the documented common mistakes were detected.");
  if (hasStructure) strengths.push(ar ? "إجابة منظمة وسهلة المتابعة" : "Well structured and easy to follow");
  if (words >= expectWords*0.8) strengths.push(ar ? "عمق كافٍ يتناسب مع مستوى صعوبة المهمة" : "Depth appropriate to the difficulty level");

  const band = scoreBand(score);
  const finalTxt = ar
    ? {excellent:"أداء قوي جدًا — الإجابة مكتملة ومدعّمة وقابلة للتنفيذ.",
       good:"أداء جيد — الأساس صحيح مع فجوات محدودة في التفاصيل أو الأدلة.",
       acceptable:"أداء مقبول — الفهم الأساسي موجود لكن التغطية والأدلة تحتاج تقوية.",
       needs:"يحتاج تحسين — الإجابة عامة أو ناقصة مقارنة بما تتطلبه المهمة."}[band.key]
    : {excellent:"Strong Performance — complete, evidenced and ready to act on.",
       good:"Good Performance — sound basis with limited gaps in detail or evidence.",
       acceptable:"Acceptable — the basic understanding is there but coverage and evidence need work.",
       needs:"Needs Improvement — the answer is generic or incomplete against what the task required."}[band.key];

  return {
    score: score,
    dimensions: dims,
    strengths: unique(strengths).slice(0,6),
    improvements: unique(improvements).slice(0,7),
    finalAssessment: finalTxt,
    band: band.key,
    rationale: ar
      ? ("تمت المقارنة مع الحل المتوقع: تغطية النقاط الأساسية " + Math.round(kpScore*100) + "%، تغطية بنود المخرج " + Math.round(dScore*100) + "%، عدد الكلمات " + words + "، مؤشرات تحليل سببي: " + (reasonRe.test(ans)?"نعم":"لا") + ".")
      : ("Compared against the expected solution: key-point coverage " + Math.round(kpScore*100) + "%, deliverable coverage " + Math.round(dScore*100) + "%, " + words + " words, causal reasoning markers: " + (reasonRe.test(ans)?"yes":"no") + "."),
    engine: "builtin"
  };
}

/* ---------- offline report ---------- */
function buildOfflineReport(emp, tasks, evals, lang, periodLabel){
  const ar = lang === "ar";
  const scores = evals.map(e => e.score);
  const a = scores.length ? avg(scores) : null;
  const dimNames = ["accuracy","completeness","understanding","problemSolving","practicalApplication"];
  const dimLabels = {
    accuracy: ar?"الدقة":"Accuracy", completeness: ar?"الاكتمال":"Completeness",
    understanding: ar?"الفهم":"Understanding", problemSolving: ar?"حل المشكلات":"Problem Solving",
    practicalApplication: ar?"التطبيق العملي":"Practical Application"
  };
  const dimAvg = {};
  dimNames.forEach(d => { const v = evals.map(e => (e.dimensions||{})[d]).filter(x => typeof x === "number"); dimAvg[d] = v.length ? avg(v) : null; });
  const ranked = dimNames.filter(d => dimAvg[d] !== null).sort((x,y) => dimAvg[y]-dimAvg[x]);
  const strong = ranked.slice(0,2).map(d => dimLabels[d] + " (" + num(dimAvg[d]) + ")");
  const weak   = ranked.slice(-2).map(d => dimLabels[d] + " (" + num(dimAvg[d]) + ")");

  const compStrength = {};
  tasks.forEach(tk => { const e = evals.find(x => x.taskId === tk.id); if (e && tk.competency){ (compStrength[tk.competency] = compStrength[tk.competency]||[]).push(e.score); } });
  const compRank = Object.keys(compStrength).map(k => ({k:k, v:avg(compStrength[k])})).sort((x,y)=>y.v-x.v);

  const completed = tasks.filter(x => x.status === "evaluated").length;
  const overdue = tasks.filter(x => effectiveTaskStatus(x) === "overdue").length;

  const overall = a === null
    ? (ar ? "لا توجد مهام مُقيّمة في هذه الفترة، لذلك لا يمكن إصدار حكم على الأداء." : "No evaluated tasks in this period, so no performance judgement can be made.")
    : (ar ? ("متوسط الأداء " + num(a) + "/100 وهو ضمن مستوى «" + bandLabelIn(a, lang) + "». أنجز الموظف " + completed + " مهمة مُقيّمة من أصل " + tasks.length + (overdue?("، مع " + overdue + " مهمة متأخرة"):"") + ".")
          : ("Average performance is " + num(a) + "/100, which falls in the \"" + bandLabelIn(a, lang) + "\" band. " + completed + " of " + tasks.length + " tasks were completed and evaluated" + (overdue?(", with " + overdue + " overdue"):"") + "."));

  const recs = [];
  if (a !== null && a < 75) recs.push(ar ? ("التركيز التدريبي على: " + (weak[0]||"") + " من خلال مهمة تطبيقية أسبوعية مع مراجعة مباشرة.") : ("Focus development on: " + (weak[0]||"") + " through one applied task per week with direct review."));
  if (compRank.length > 1) recs.push(ar ? ("أضعف جدارة حاليًا: " + compRank[compRank.length-1].k + " — أعطِ مهمتين متتاليتين في هذه الجدارة بمستوى أعلى.") : ("Weakest competency: " + compRank[compRank.length-1].k + " — assign two consecutive tasks in it at a higher level."));
  if (overdue) recs.push(ar ? "معالجة التأخر في التسليم بالاتفاق على مواعيد أقصر وأكثر وضوحًا." : "Address late delivery by agreeing shorter, clearer deadlines.");
  if (a !== null && a >= 90) recs.push(ar ? "الأداء متقدم — ارفع مستوى الصعوبة إلى Expert وأسند مهامًا ذات أثر على القسم." : "Performance is advanced — raise difficulty to Expert and assign department-impact tasks.");
  if (!recs.length) recs.push(ar ? "الاستمرار على نفس الوتيرة مع مهمة واحدة على الأقل شهريًا لضمان استمرارية القياس." : "Keep the current pace with at least one task per month to maintain a measurement trend.");

  return {
    period: periodLabel,
    numTasks: tasks.length,
    completed: completed,
    avgScore: a,
    strongAreas: strong.concat(compRank.slice(0,1).map(c => c.k + " (" + num(c.v) + ")")),
    weakAreas: weak.concat(compRank.slice(-1).map(c => c.k + " (" + num(c.v) + ")")).filter((v,i,s)=>s.indexOf(v)===i),
    overall: overall,
    recommendations: recs,
    engine: "builtin"
  };
}
function bandLabelIn(score, lang){
  const k = scoreBand(score).key;
  const m = {en:{excellent:"Excellent",good:"Good",acceptable:"Acceptable",needs:"Needs Improvement"},
             ar:{excellent:"ممتاز",good:"جيد",acceptable:"مقبول",needs:"يحتاج تحسين"}};
  return (m[lang]||m.en)[k];
}

             defaultBase:"https://api.openai.com/v1"},
  anthropic:{label:"Anthropic (Claude)", models:["claude-sonnet-4-5","claude-opus-4-5","claude-haiku-4-5"], needsKey:true,
             defaultBase:"https://api.anthropic.com/v1"},
  gemini:   {label:"Google Gemini",   models:["gemini-2.0-flash","gemini-2.5-pro","gemini-2.5-flash"], needsKey:true,
             defaultBase:"https://generativelanguage.googleapis.com/v1beta"},
  openrouter:{label:"OpenRouter",     models:["openai/gpt-4o-mini","anthropic/claude-sonnet-4.5","google/gemini-2.0-flash-001"], needsKey:true,
             defaultBase:"https://openrouter.ai/api/v1"},
  custom:   {label:"Custom (OpenAI-compatible)", models:[], needsKey:true, defaultBase:""}

function aiEnabled(){

  return s.provider !== "offline" && !!s.apiKey;
}
function aiLabel(){
  const s = DB.settings;
  if (s.useProxy && s.proxyUrl) return "Proxy";
  if (!aiEnabled()) return t("ai.builtin");
  return (PROVIDERS[s.provider] ? (PROVIDERS[s.provider].label.indexOf("set.")===0 ? t(PROVIDERS[s.provider].label) : PROVIDERS[s.provider].label) : s.provider) + (s.model ? " · " + s.model : "");
}

/* ---------- employee context sent to the model (PII-aware) ---------- */
function employeeContext(emp){
  const s = DB.settings;
  const ctx = {
    jobTitle: emp.jobTitle || "",
    department: emp.department || "",
    experienceLevel: emp.level || "mid",
    skills: emp.skills || [],
    jobDescription: emp.jd || ""
  };
  if (!s.redactPII){
    ctx.fullName = emp.fullName;
    ctx.employeeId = emp.empId || "";
    ctx.manager = emp.manager || "";
  }
  const fam = detectFamily(emp.jobTitle, emp.jd, emp.department);
  if (fam) ctx.domainHint = fam.en.name + " — typical competencies: " + fam.comps.map(c => c.en.n).join(", ");
  return ctx;
}

const QUALITY_RULES =
"TASK QUALITY RULES (must all hold for every task you produce):\n"+
"1. The task must be directly tied to the employee's job description. Never produce a generic task.\n"+
"2. It must match the stated experience level.\n"+
"3. It must be executable with the information given inside the task itself.\n"+
"4. It must have one clear, concrete deliverable.\n"+
"5. It must have an expected solution that a reviewer can compare against.\n"+
"6. It must have explicit evaluation criteria.\n"+
"7. No vague, purposeless or 'write about' tasks.\n"+
"8. Never ask the employee to invent facts. If data is needed, put simulated data inside the task and label it as simulated.\n"+
"9. Never use real, confidential or personal company data unless it was explicitly supplied in the input.\n"+
"10. If the task is a simulation or case study, say so clearly inside the task text.\n";

function langInstruction(lang){
  return lang === "ar"
    ? "Write ALL output values in formal, professional Arabic (Modern Standard Arabic used in Gulf corporate HR). Keep JSON keys in English."
    : "Write ALL output values in clear professional English. Keep JSON keys in English.";
}

/* ---------- provider transport ---------- */
async function callProvider(system, user, opts){
  const s = DB.settings;
  opts = opts || {};
  const temperature = typeof opts.temperature === "number" ? opts.temperature : Number(s.temperature || 0.6);

  if (s.useProxy && s.proxyUrl){
    const r = await fetch(s.proxyUrl, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({fn: opts.fn || "generic", system: system, user: user, temperature: temperature})
    });
    if (!r.ok) throw new Error("Proxy error " + r.status + ": " + (await r.text()).slice(0,200));
    const j = await r.json();
    return j.text || j.content || j.output || "";
  }

  const p = s.provider;
  const key = s.apiKey;
  if (!key) throw new Error("No API key");

  if (p === "anthropic"){
    const base = s.baseUrl || PROVIDERS.anthropic.defaultBase;
    const r = await fetch(base + "/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({model: s.model || "claude-sonnet-4-5", max_tokens: opts.maxTokens || 4000, temperature: temperature,
        system: system, messages:[{role:"user", content:user}]})
    });
    if (!r.ok) throw new Error("Anthropic " + r.status + ": " + (await r.text()).slice(0,300));
    const j = await r.json();
    return (j.content || []).map(c => c.text || "").join("");
  }

  if (p === "gemini"){
    const base = s.baseUrl || PROVIDERS.gemini.defaultBase;
    const model = s.model || "gemini-2.0-flash";
    const r = await fetch(base + "/models/" + model + ":generateContent?key=" + encodeURIComponent(key), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        systemInstruction:{parts:[{text:system}]},
        contents:[{role:"user", parts:[{text:user}]}],
        generationConfig:{temperature: temperature, responseMimeType:"application/json", maxOutputTokens: opts.maxTokens || 4000}
      })
    });
    if (!r.ok) throw new Error("Gemini " + r.status + ": " + (await r.text()).slice(0,300));
    const j = await r.json();
    return (((j.candidates||[])[0]||{}).content||{}).parts ? j.candidates[0].content.parts.map(x=>x.text||"").join("") : "";
  }

  /* openai / openrouter / custom — OpenAI-compatible chat completions */
  const base = s.baseUrl || (PROVIDERS[p] && PROVIDERS[p].defaultBase) || PROVIDERS.openai.defaultBase;
  const headers = {"Content-Type":"application/json","Authorization":"Bearer " + key};
  const r = await fetch(base.replace(/\/$/,"") + "/chat/completions", {
    method:"POST", headers: headers,
    body: JSON.stringify({
      model: s.model || "gpt-4o-mini",
      temperature: temperature,
      max_tokens: opts.maxTokens || 4000,
      response_format: {type:"json_object"},
      messages:[{role:"system", content:system},{role:"user", content:user}]
    })
  });
  if (!r.ok) throw new Error("Provider " + r.status + ": " + (await r.text()).slice(0,300));
  const j = await r.json();
  return (((j.choices||[])[0]||{}).message||{}).content || "";
}

function parseJSONLoose(txt){
  if (!txt) throw new Error("empty response");
  let s = String(txt).trim();
  s = s.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  const a2 = s.indexOf("["), b2 = s.lastIndexOf("]");
  let cand = s;
  if (a >= 0 && b > a && (a2 < 0 || a < a2)) cand = s.slice(a, b+1);
  else if (a2 >= 0 && b2 > a2) cand = s.slice(a2, b2+1);
  return JSON.parse(cand);
}
function arr(x){ return Array.isArray(x) ? x.filter(v => v !== null && v !== undefined && String(v).trim() !== "") : (x ? [String(x)] : []); }
function str(x, d){ return (x === null || x === undefined) ? (d||"") : String(x); }

/* ============================================================
   1) generateEmployeeTask()
   ============================================================ */
async function generateEmployeeTask(emp, opts){
  const lang = opts.lang || DB.settings.taskLang || "ar";
  const count = clamp(opts.count || 1, 1, 20);
  const offline = () => {
    const out = [];
    for (let i = 0; i < count; i++) out.push(buildOfflineTask(emp, Object.assign({}, opts, {lang:lang}), (opts.startIndex||0) + i, opts.salt));
    return out;
  };
  if (!aiEnabled()) return offline();

  const system =
    "You are an expert HR task designer for a Saudi/Gulf corporate HR department. You design practical, job-specific "+
    "assessment and development tasks for employees, based strictly on their job description.\n" + QUALITY_RULES +
    "\nReturn ONLY valid JSON. No commentary.";
  const user =
    "EMPLOYEE CONTEXT:\n" + JSON.stringify(employeeContext(emp), null, 1) +
    "\n\nREQUEST:\n" + JSON.stringify({
      numberOfTasks: count, difficulty: opts.difficulty || "medium",
      taskType: opts.type && opts.type !== "mixed" ? opts.type : "choose the most suitable type per task from: practical, analytical, problem, case, research, report, scenario",
      focusArea: opts.focus || null,
      avoidRepeating: (opts.avoid || []).slice(0,20)
    }, null, 1) +
    "\n\n" + langInstruction(lang) +
    "\nEach task must target a DIFFERENT competency taken from the job description.\n" +
    "OUTPUT JSON SHAPE:\n" +
    '{"tasks":[{"title":"","competency":"","type":"practical|analytical|problem|case|research|report|scenario",'+
    '"scenario":"the situation, written to the employee in second person","given":["simulated data or constraints, clearly labelled as simulated"],'+
    '"objective":"","instructions":["step"],"deliverable":["required output item"],"estimatedTime":90}]}';

  try{
    const txt = await callProvider(system, user, {fn:"generateEmployeeTask", maxTokens: 1200 + count*700});
    const j = parseJSONLoose(txt);
    const list = arr(j.tasks).length ? j.tasks : (Array.isArray(j) ? j : [j]);
    const meta = DIFF_META[opts.difficulty] || DIFF_META.medium;
    const out = list.slice(0, count).map(x => ({
      title: str(x.title, "Task"),
      scenario: str(x.scenario),
      given: arr(x.given),
      objective: str(x.objective),
      instructions: arr(x.instructions),
      deliverable: arr(x.deliverable),
      difficulty: opts.difficulty || "medium",
      type: TYPES.indexOf(x.type) >= 0 ? x.type : (opts.type && opts.type !== "mixed" ? opts.type : "practical"),
      estimatedTime: Number(x.estimatedTime) || meta.time,
      competency: str(x.competency, ""),
      competencyId: "ai",
      family: "ai",
      lang: lang,
      isSimulation: true,
      engine: "ai:" + (DB.settings.model || DB.settings.provider)
    }));
    if (!out.length) throw new Error("no tasks returned");
    /* top up with the built-in engine if the model returned fewer than asked */
    while (out.length < count) out.push(buildOfflineTask(emp, Object.assign({}, opts, {lang:lang}), out.length, opts.salt));
    return out;
  }catch(e){
    console.warn("generateEmployeeTask fell back:", e);
    AI_LAST_ERROR = e.message || String(e);
    return offline();
  }
}

/* ============================================================
   2) generateExpectedSolution()
   ============================================================ */
async function generateExpectedSolution(emp, task){
  const lang = task.lang || "ar";
  if (!aiEnabled() || task.engine === "builtin"){
    if (task.solution) return task.solution;
    return buildOfflineTask(emp, {lang:lang, difficulty:task.difficulty, type:task.type}, 0, task.title).solution;
  }
  const system =
    "You are a senior HR assessor. For a given employee task you write the HR-only answer key: what a strong answer "+
    "contains, how to score it, and what mistakes to look for. The employee never sees this. Be concrete and measurable. "+
    "Return ONLY valid JSON.";
  const user =
    "EMPLOYEE CONTEXT:\n" + JSON.stringify(employeeContext(emp), null, 1) +
    "\n\nTASK:\n" + JSON.stringify({
      title: task.title, competency: task.competency, type: task.type, difficulty: task.difficulty,
      scenario: task.scenario, given: task.given, objective: task.objective,
      instructions: task.instructions, deliverable: task.deliverable
    }, null, 1) +
    "\n\n" + langInstruction(lang) +
    "\nThe criteria weights must sum to 100. The rubric must use the bands 90-100, 75-89, 60-74, below 60.\n" +
    "OUTPUT JSON SHAPE:\n" +
    '{"expectedAnswer":"","steps":["step-by-step model solution"],"keyPoints":["a point a correct answer must contain"],'+
    '"criteria":[{"name":"","weight":25,"description":""}],"commonMistakes":[""],'+
    '"rubric":[{"band":"","range":"90-100","description":""}]}';
  try{
    const txt = await callProvider(system, user, {fn:"generateExpectedSolution", maxTokens:2500, temperature:0.35});
    const j = parseJSONLoose(txt);
    const sol = {
      expectedAnswer: str(j.expectedAnswer),
      steps: arr(j.steps),
      keyPoints: arr(j.keyPoints),
      criteria: (Array.isArray(j.criteria)?j.criteria:[]).map(c => ({name:str(c.name), weight:Number(c.weight)||0, description:str(c.description)})),
      commonMistakes: arr(j.commonMistakes),
      rubric: (Array.isArray(j.rubric)?j.rubric:[]).map(r => ({band:str(r.band), range:str(r.range), description:str(r.description)}))
    };
    if (!sol.keyPoints.length || !sol.expectedAnswer) throw new Error("incomplete solution");
    return sol;
  }catch(e){
    console.warn("generateExpectedSolution fell back:", e);
    AI_LAST_ERROR = e.message || String(e);
    const fb = buildOfflineTask(emp, {lang:lang, difficulty:task.difficulty, type:task.type}, 0, task.title);
    return fb.solution;
  }
}

/* ============================================================
   3) evaluateEmployeeAnswer()
   ============================================================ */
async function evaluateEmployeeAnswer(emp, task, answerText){
  const lang = task.lang || "ar";
  if (!aiEnabled()) return evaluateOffline(task, answerText);

  const system =
    "You are a fair, evidence-based HR assessor. You compare an employee's answer against the expected solution and the "+
    "evaluation criteria. Judge MEANING and REASONING, not word matching: a different wording, a different valid method, "+
    "or a different structure must still score well if the reasoning and the outcome are correct. Penalise invented facts, "+
    "missing deliverables and unsupported claims. Be specific and quote the answer where useful. Return ONLY valid JSON.";
  const user =
    "TASK GIVEN TO THE EMPLOYEE:\n" + JSON.stringify({
      title: task.title, competency: task.competency, difficulty: task.difficulty,
      scenario: task.scenario, given: task.given, instructions: task.instructions, deliverable: task.deliverable
    }, null, 1) +
    "\n\nEXPECTED SOLUTION (HR only):\n" + JSON.stringify(task.solution || {}, null, 1) +
    "\n\nEMPLOYEE ANSWER:\n\"\"\"\n" + String(answerText||"").slice(0, 12000) + "\n\"\"\"\n\n" +
    langInstruction(lang) +
    "\nScoring bands: Excellent 90-100, Good 75-89, Acceptable 60-74, Needs Improvement below 60.\n" +
    "OUTPUT JSON SHAPE:\n" +
    '{"score":0,"dimensions":{"accuracy":0,"completeness":0,"understanding":0,"problemSolving":0,"practicalApplication":0},'+
    '"strengths":[""],"improvements":[""],"finalAssessment":"one short sentence","rationale":"2-4 sentences explaining the score"}';
  try{
    const txt = await callProvider(system, user, {fn:"evaluateEmployeeAnswer", maxTokens:2000, temperature:0.2});
    const j = parseJSONLoose(txt);
    const d = j.dimensions || {};
    const dims = {
      accuracy: clamp(Math.round(Number(d.accuracy)||0),0,100),
      completeness: clamp(Math.round(Number(d.completeness)||0),0,100),
      understanding: clamp(Math.round(Number(d.understanding)||0),0,100),
      problemSolving: clamp(Math.round(Number(d.problemSolving)||0),0,100),
      practicalApplication: clamp(Math.round(Number(d.practicalApplication)||0),0,100)
    };
    let score = Math.round(Number(j.score));
    if (!isFinite(score) || score <= 0) score = Math.round(dims.accuracy*.25+dims.completeness*.25+dims.understanding*.2+dims.problemSolving*.15+dims.practicalApplication*.15);
    score = clamp(score,0,100);
    return {
      score: score, dimensions: dims,
      strengths: arr(j.strengths), improvements: arr(j.improvements),
      finalAssessment: str(j.finalAssessment, bandLabelIn(score, lang)),
      band: scoreBand(score).key,
      rationale: str(j.rationale),
      engine: "ai:" + (DB.settings.model || DB.settings.provider)
    };
  }catch(e){
    console.warn("evaluateEmployeeAnswer fell back:", e);
    AI_LAST_ERROR = e.message || String(e);
    const r = evaluateOffline(task, answerText);
    r.fallback = true;
    return r;
  }
}

  try{
    const txt = await callProvider(system, user, {fn:"generateTaskVariation", maxTokens:3000});
    const x = parseJSONLoose(txt);
    const meta = DIFF_META[baseTask.difficulty] || DIFF_META.medium;
    const core = {
      title: str(x.title, baseTask.title),
      scenario: str(x.scenario), given: arr(x.given), objective: str(x.objective),
      instructions: arr(x.instructions), deliverable: arr(x.deliverable),
      difficulty: baseTask.difficulty, type: str(x.type, baseTask.type),
      estimatedTime: Number(x.estimatedTime) || meta.time,
      competency: str(x.competency, baseTask.competency),
      competencyId: baseTask.competencyId, family: baseTask.family, lang: lang, isSimulation: true,
      engine: "ai:" + (DB.settings.model || DB.settings.provider)
    };
    if (x.solution && x.solution.keyPoints) core.solution = {
      expectedAnswer: str(x.solution.expectedAnswer),
      steps: arr(x.solution.steps), keyPoints: arr(x.solution.keyPoints),
      criteria: (x.solution.criteria||[]).map(c=>({name:str(c.name),weight:Number(c.weight)||0,description:str(c.description)})),
      commonMistakes: arr(x.solution.commonMistakes),
      rubric: (x.solution.rubric||[]).map(r=>({band:str(r.band),range:str(r.range),description:str(r.description)}))
    };
    if (!core.scenario) throw new Error("empty variation");
    return core;
  }catch(e){
    console.warn("generateTaskVariation fell back:", e);
    AI_LAST_ERROR = e.message || String(e);
    return offline();
  }
}

async function generateEmployeeReport(emp, tasks, evals, periodLabel, lang){
  lang = lang || DB.settings.taskLang || "ar";
  if (!aiEnabled()) return buildOfflineReport(emp, tasks, evals, lang, periodLabel);

  const rows = tasks.map(tk => {
    const e = evals.find(x => x.taskId === tk.id);
    return {
      task: tk.title, competency: tk.competency, difficulty: tk.difficulty,
      status: effectiveTaskStatus(tk), score: e ? e.score : null,
      dimensions: e ? e.dimensions : null,
      strengths: e ? (e.strengths||[]).slice(0,3) : [],
      improvements: e ? (e.improvements||[]).slice(0,3) : []
    };
  });
  const system =
    "You are an HR performance analyst. From the employee's task results you write a short, honest performance report a "+
    "line manager can act on. No flattery, no filler. Base every statement on the data given. Return ONLY valid JSON.";
  const user =
    "EMPLOYEE:\n" + JSON.stringify(employeeContext(emp), null, 1) +
    "\n\nPERIOD: " + periodLabel +
    "\n\nTASK RESULTS:\n" + JSON.stringify(rows, null, 1) +
    "\n\n" + langInstruction(lang) +
    "\nOUTPUT JSON SHAPE:\n" +
    '{"numTasks":0,"completed":0,"avgScore":0,"strongAreas":[""],"weakAreas":[""],"overall":"3-5 sentences","recommendations":["specific, actionable"]}';
  try{
    const txt = await callProvider(system, user, {fn:"generateEmployeeReport", maxTokens:2000, temperature:0.35});
    const j = parseJSONLoose(txt);
    const scores = evals.map(e=>e.score);
    return {
      period: periodLabel,
      numTasks: Number(j.numTasks) || tasks.length,
      completed: Number(j.completed) || tasks.filter(x=>x.status==="evaluated").length,
      avgScore: scores.length ? avg(scores) : null,
      strongAreas: arr(j.strongAreas), weakAreas: arr(j.weakAreas),
      overall: str(j.overall), recommendations: arr(j.recommendations),
      engine: "ai:" + (DB.settings.model || DB.settings.provider)
    };
  }catch(e){
    console.warn("generateEmployeeReport fell back:", e);
    AI_LAST_ERROR = e.message || String(e);
    return buildOfflineReport(emp, tasks, evals, lang, periodLabel);
  }
}

/* ============================================================
   Tiny dependency-free SVG charts
   ============================================================ */
const CHART_COLORS = ["#2563eb","#16a34a","#d97706","#7c3aed","#0f2540","#0891b2","#dc2626","#65a30d"];

function chartEmpty(){ return '<div class="empty" style="padding:28px"><div class="mut sm">'+esc(t("chart.noData"))+'</div></div>'; }

function barChart(data, opts){
  opts = opts || {};
  if (!data || !data.length) return chartEmpty();
  const w = 100, h = 46;                    // viewBox units
  const max = Math.max.apply(null, data.map(d => d.value)) || 1;
  const n = data.length;
  const gap = 100 / n * 0.28;
  const bw = 100 / n - gap;
  let bars = "", labels = "";
  data.forEach((d, i) => {
    const bh = (d.value / max) * (h - 12);
    const x = i * (100/n) + gap/2;
    const y = (h - 6) - bh;
    const c = d.color || opts.color || CHART_COLORS[i % CHART_COLORS.length];
    bars += '<rect x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+Math.max(bh,0.6).toFixed(2)+'" rx="1" fill="'+c+'"><title>'+esc(d.label+": "+d.value)+'</title></rect>';
    bars += '<text x="'+(x+bw/2).toFixed(2)+'" y="'+(y-1.6).toFixed(2)+'" text-anchor="middle" font-size="3.1" fill="#475569" font-weight="700">'+esc(opts.fmt ? opts.fmt(d.value) : d.value)+'</text>';
    labels += '<div style="flex:1;text-align:center;font-size:11px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px" title="'+esc(d.label)+'">'+esc(d.label)+'</div>';
  });
  return '<div><svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+(opts.height||170)+'px" preserveAspectRatio="none">'+
    '<line x1="0" y1="'+(h-6)+'" x2="100" y2="'+(h-6)+'" stroke="#e2e8f0" stroke-width="0.3"/>'+bars+'</svg>'+
    '<div style="display:flex;margin-top:4px">'+labels+'</div></div>';
}

function hBarChart(data, opts){
  opts = opts || {};
  if (!data || !data.length) return chartEmpty();
  const max = Math.max.apply(null, data.map(d => d.value)) || 1;
  return '<div>' + data.map((d,i) => {
    const p = (d.value / max) * 100;
    const c = d.color || CHART_COLORS[i % CHART_COLORS.length];
    return '<div style="margin-bottom:11px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">'+
        '<span style="font-weight:600;color:#334155">'+esc(d.label)+'</span>'+
        '<span style="color:#64748b;font-weight:700">'+esc(opts.fmt ? opts.fmt(d.value) : d.value)+'</span></div>'+
      '<div class="bar"><i style="width:'+p.toFixed(1)+'%;background:'+c+'"></i></div></div>';
  }).join("") + '</div>';
}

function donutChart(data, opts){
  opts = opts || {};
  const items = (data||[]).filter(d => d.value > 0);
  if (!items.length) return chartEmpty();
  const total = items.reduce((s,d)=>s+d.value,0);
  const R = 16, C = 2*Math.PI*R;
  let off = 0, segs = "";
  items.forEach((d,i) => {
    const frac = d.value/total;
    const c = d.color || CHART_COLORS[i % CHART_COLORS.length];
    segs += '<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="'+c+'" stroke-width="7" '+
      'stroke-dasharray="'+(frac*C).toFixed(3)+' '+C.toFixed(3)+'" stroke-dashoffset="'+(-off*C).toFixed(3)+'" transform="rotate(-90 21 21)"><title>'+esc(d.label+": "+d.value)+'</title></circle>';
    off += frac;
  });
  const legend = items.map((d,i) =>
    '<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:6px">'+
    '<span style="width:10px;height:10px;border-radius:3px;background:'+(d.color||CHART_COLORS[i%CHART_COLORS.length])+';flex:0 0 auto"></span>'+
    '<span style="flex:1;color:#334155">'+esc(d.label)+'</span>'+
    '<b style="color:#0f2540">'+d.value+'</b></div>').join("");
  return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+
    '<svg viewBox="0 0 42 42" style="width:132px;height:132px;flex:0 0 auto">'+segs+
    '<text x="21" y="20.5" text-anchor="middle" font-size="7" font-weight="800" fill="#0f2540">'+total+'</text>'+
    '<text x="21" y="25.5" text-anchor="middle" font-size="3.2" fill="#64748b">'+esc(opts.centerLabel||t("common.total"))+'</text></svg>'+
    '<div style="flex:1;min-width:150px">'+legend+'</div></div>';
}

function lineChart(points, opts){
  opts = opts || {};
  if (!points || points.length < 2) return chartEmpty();
  const w = 100, h = 40, pad = 4;
  const vals = points.map(p => p.value);
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const span = (max - min) || 1;
  const xy = points.map((p,i) => {
    const x = pad + (i/(points.length-1))*(w-2*pad);
    const y = (h-pad) - ((p.value-min)/span)*(h-2*pad);
    return [x,y];
  });
  const path = xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" ");
  const area = path + " L"+xy[xy.length-1][0].toFixed(2)+" "+(h-pad)+" L"+xy[0][0].toFixed(2)+" "+(h-pad)+" Z";
  const dots = xy.map((p,i)=>'<circle cx="'+p[0].toFixed(2)+'" cy="'+p[1].toFixed(2)+'" r="0.9" fill="#2563eb"><title>'+esc(points[i].label+": "+points[i].value)+'</title></circle>').join("");
  const labels = points.map(p => '<div style="flex:1;text-align:center;font-size:10.5px;color:#94a3b8;white-space:nowrap;overflow:hidden">'+esc(p.label)+'</div>').join("");
  return '<div><svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+(opts.height||150)+'px" preserveAspectRatio="none">'+
    '<path d="'+area+'" fill="rgba(37,99,235,.10)"/>'+
    '<path d="'+path+'" fill="none" stroke="#2563eb" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>'+
    '<div style="display:flex;margin-top:2px">'+labels+'</div></div>';
}

function scoreRing(score, size){
  const R = 15.5, C = 2*Math.PI*R;
  const b = scoreBand(score);
  const frac = clamp(score,0,100)/100;
  return '<svg class="score-ring" viewBox="0 0 42 42" style="width:'+(size||96)+'px;height:'+(size||96)+'px">'+
    '<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="#e2e8f0" stroke-width="5"/>'+
    '<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="'+b.color+'" stroke-width="5" stroke-linecap="round" '+
    'stroke-dasharray="'+(frac*C).toFixed(2)+' '+C.toFixed(2)+'" transform="rotate(-90 21 21)"/>'+
    '<text x="21" y="22" text-anchor="middle" font-size="10" font-weight="800" fill="'+b.color+'">'+Math.round(score)+'</text>'+
    '<text x="21" y="27.5" text-anchor="middle" font-size="3.4" fill="#94a3b8">/ 100</text></svg>';
}
