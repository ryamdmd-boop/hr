/* ============================================================
   Wiring
   ============================================================ */
function wireImport(root){
  const S = ImportState;

  const pick = $("#impPick", root);
  if (pick) pick.onclick = () => $("#impFile", root).click();
  const fi = $("#impFile", root);
  if (fi) fi.onchange = async function(){
    const f = this.files[0]; if (!f) return;
    Busy.show(t("imp.reading"), f.name);
    await nextFrame();
    try{
      const sheets = await readSpreadsheetFile(f);
      S.fileName = f.name; S.sheets = sheets; S.sheetIndex = 0;
      loadSheet(0);
      S.step = 1; Busy.hide(); Router.render();
    }catch(e){ Busy.hide(); console.error(e); toast(t("imp.readFail") + " — " + (e.message||e), "err", 6000); }
  };

  const sh = $("#impSheet", root);
  if (sh) sh.onchange = function(){ loadSheet(parseInt(this.value,10)); Router.render(); };
  const b0 = $("#impBack0", root); if (b0) b0.onclick = () => { S.step = 0; Router.render(); };
  const b1 = $("#impBack1", root); if (b1) b1.onclick = () => { S.step = 1; Router.render(); };

  $$("[data-mapf]", root).forEach(sel => sel.onchange = function(){
    S.map[this.dataset.mapf] = parseInt(this.value,10);
  });
  const n1 = $("#impNext1", root);
  if (n1) n1.onclick = () => {
    if (S.map.fullName < 0 || S.map.companySrc < 0){ toast(t("imp.needCols"),"err",5000); return; }
    S.companyMap = {};
    S.step = 2; Router.render();
  };

  $$("[data-cmode]", root).forEach(sel => sel.onchange = function(){
    const raw = this.dataset.cmode;
    S.companyMap[raw].mode = this.value;
    if (this.value === "existing" && !S.companyMap[raw].companyId){
      const first = companies()[0]; S.companyMap[raw].companyId = first ? first.id : "";
    }
    Router.render(true);
  });
  $$("[data-cname]", root).forEach(inp => inp.oninput = function(){ S.companyMap[this.dataset.cname].name = this.value; });
  $$("[data-cid]", root).forEach(sel => sel.onchange = function(){ S.companyMap[this.dataset.cid].companyId = this.value; });

  const run = $("#impRun", root);
  if (run) run.onclick = async () => {
    Busy.show(t("imp.running"), "");
    await nextFrame();
    try{ runImport(); S.step = 3; Busy.hide(); Router.render(); refreshCompanySwitcher(); }
    catch(e){ Busy.hide(); console.error(e); toast(String(e.message||e),"err",6000); }
  };

  $$("[data-openco]", root).forEach(b => b.onclick = () => {
    setActiveCompany(b.dataset.openco); refreshCompanySwitcher(); location.hash = "#/employees";
  });
  const again = $("#impAgain", root);
  if (again) again.onclick = () => { ImportState.step = 0; ImportState.result = null; Router.render(); };
}

function loadSheet(i){
  const S = ImportState;
  S.sheetIndex = i;
  const raw = S.sheets[i].rows;
  S.headerRow = detectHeaderRow(raw);
  S.headers = (raw[S.headerRow] || []).map(h => String(h == null ? "" : h).replace(/\s+/g," ").trim());
  S.rows = raw.slice(S.headerRow + 1).filter(r => r.some(c => String(c||"").trim() !== ""));
  S.map = autoDetectColumns(S.headers);
}

/* the actual import — values are copied verbatim */
function runImport(){
  const S = ImportState;
  const val = (r, key) => {
    const i = S.map[key];
    if (i === undefined || i < 0) return "";
    const v = r[i];
    return v == null ? "" : String(v).trim();
  };

  /* companies: create or reuse, exactly with the name shown in the mapping step */
  const companyFor = {};
  const companyRows = [];
  Object.keys(S.companyMap).forEach(raw => {
    const m = S.companyMap[raw];
    if (m.mode === "skip"){ companyFor[raw] = null; return; }
    if (m.mode === "existing"){ companyFor[raw] = m.companyId || null; return; }
    const name = String(m.name||"").trim();
    if (!name){ companyFor[raw] = null; return; }
    let c = DB.all("companies").find(x => x.name === name);
    if (!c) c = DB.insert("companies", {name: name, industry:"", contact:"", notes: t("imp.fromFile") + ": " + raw});
    companyFor[raw] = c.id;
  });

  const existingEmps = DB.all("employees");
  const seen = { empId:{}, nationalId:{}, email:{}, mobile:{} };
  existingEmps.forEach(e => {
    if (e.empId) seen.empId[e.empId] = e;
    if (e.nationalId) seen.nationalId[e.nationalId] = e;
    if (e.email) seen.email[String(e.email).toLowerCase()] = e;
    if (e.mobile) seen.mobile[e.mobile] = e;
  });

  const toInsert = [], duplicates = [], unmatched = [], missing = [], notes = [];
  const emailOwners = {};

  S.rows.forEach(r => {
    const fullName = val(r,"fullName");
    if (!fullName) return;
    const empId = val(r,"empId"), nationalId = val(r,"nationalId");
    const email = val(r,"email"), mobile = val(r,"mobile");
    const rawCompany = String(r[S.map.companySrc]||"").replace(/\s+/g," ").trim();
    const companyId = companyFor[rawCompany];

    /* duplicates — within the file and against what is already stored */
    let dupReason = "";
    if (empId && seen.empId[empId]) dupReason = t("emp.empId") + ": " + empId;
    else if (nationalId && seen.nationalId[nationalId]) dupReason = t("imp.nationalId") + ": " + nationalId;
    else if (mobile && seen.mobile[mobile]) dupReason = t("imp.mobile") + ": " + mobile;
    if (dupReason){ duplicates.push({name: fullName, empId: empId, reason: dupReason}); return; }

    if (!companyId){ unmatched.push({name: fullName, empId: empId, raw: rawCompany}); return; }

    /* everything not mapped to a field is preserved as-is */
    const extra = {};
    S.headers.forEach((h, i) => {
      if (!h) return;
      const used = Object.keys(S.map).some(k => S.map[k] === i);
      if (used) return;
      const v = r[i];
      if (v != null && String(v).trim() !== "") extra[h] = String(v).trim();
    });

    const row = {
      companyId: companyId,
      fullName: fullName,
      nameEn: val(r,"nameEn"),
      empId: empId,
      nationalId: nationalId,
      mobile: mobile,
      whatsapp: mobile,
      email: email,
      jobTitle: val(r,"jobTitle"),
      department: val(r,"department"),
      manager: val(r,"manager"),
      joinDate: val(r,"joinDate"),
      location: val(r,"location"),
      nationality: val(r,"nationality"),
      gender: val(r,"gender"),
      birthDate: val(r,"birthDate"),
      contractSource: rawCompany,
      level: "mid",
      status: "active",
      skills: [],
      jd: "",
      extra: extra,
      source: "excel:" + S.fileName
    };

    const miss = [];
    if (!empId) miss.push(t("emp.empId"));
    if (!nationalId) miss.push(t("imp.nationalId"));
    if (!mobile) miss.push(t("imp.mobile"));
    if (!email) miss.push(t("emp.email"));
    if (!row.jobTitle) miss.push(t("emp.jobTitle"));
    if (!row.department) miss.push(t("emp.department"));
    if (miss.length) missing.push({name: fullName, fields: miss});

    if (empId) seen.empId[empId] = row;
    if (nationalId) seen.nationalId[nationalId] = row;
    if (mobile) seen.mobile[mobile] = row;
    if (email){
      const k = email.toLowerCase();
      if (emailOwners[k]) notes.push(t("imp.sameEmail") + ": " + email + " — " + emailOwners[k] + " / " + fullName);
      else emailOwners[k] = fullName;
    }
    toInsert.push(row);
  });

  if (toInsert.length) DB.insertMany("employees", toInsert);

  const perCompany = {};
  toInsert.forEach(r => { perCompany[r.companyId] = (perCompany[r.companyId]||0) + 1; });
  const companyList = Object.keys(perCompany).map(id => {
    const c = DB.get("companies", id);
    const src = Object.keys(companyFor).filter(k => companyFor[k] === id).join(" / ");
    return {id: id, name: c ? c.name : "—", count: perCompany[id], source: src};
  }).sort((a,b) => b.count - a.count);

  ImportState.result = {
    imported: toInsert.length,
    companies: companyList,
    duplicates: duplicates,
    unmatched: unmatched,
    missing: missing,
    notes: unique(notes)
  };
  toast(toInsert.length + " " + t("imp.imported"), "ok", 4000);
}

/* ======= 02b-theme.js ======= */
/* ============================================================
   Theme + brand
   -----------------------------------------------------------
   Theme:  light | dark | auto (follows the operating system).
           Applied to <html data-theme> before the first paint so
           there is never a white flash on a dark desktop.
   Brand:  company name, logo, cover image and description. The
           images live in the settings record, so a backup carries
           them and a refresh keeps them.
   ============================================================ */
const THEMES = ["light", "dark", "auto"];
const THEME_KEY = "aitms.theme";          // mirrored outside the DB so boot can read it synchronously

function systemPrefersDark(){
  try{ return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }
  catch(e){ return false; }
}
function storedTheme(){
  try{
    const v = localStorage.getItem(THEME_KEY);
    if (THEMES.indexOf(v) >= 0) return v;
  }catch(e){}
  return "light";
}
function effectiveTheme(mode){
  const m = mode || storedTheme();
  return m === "auto" ? (systemPrefersDark() ? "dark" : "light") : m;
}
function applyTheme(mode, save){
  const m = THEMES.indexOf(mode) >= 0 ? mode : storedTheme();
  const eff = effectiveTheme(m);
  document.documentElement.setAttribute("data-theme", eff);
  document.documentElement.setAttribute("data-theme-mode", m);
  if (save !== false){
    try{ localStorage.setItem(THEME_KEY, m); }catch(e){}
    if (typeof DB !== "undefined" && DB.settings && DB.settings.theme !== m) DB.saveSettings({theme: m});
  }
  paintThemeButton(m, eff);
  return eff;
}
function paintThemeButton(mode, eff){
  const b = document.getElementById("themeBtn");
  if (!b) return;
  b.innerHTML = icon(eff === "dark" ? "sun" : "moon", 18);
  const label = t("thm." + (mode || storedTheme()));
  b.title = t("thm.title") + " — " + label;
  b.setAttribute("aria-label", b.title);
}
function cycleTheme(){
  const cur = document.documentElement.getAttribute("data-theme-mode") || storedTheme();
  const next = cur === "light" ? "dark" : cur === "dark" ? "auto" : "light";
  applyTheme(next, true);
  toast(t("thm.title") + ": " + t("thm." + next), "ok", 1400);
}
/* keep "auto" honest when the OS switches while the app is open */
function watchSystemTheme(){
  try{
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = () => {
      if ((document.documentElement.getAttribute("data-theme-mode") || "light") === "auto") applyTheme("auto", false);
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }catch(e){}
}

/* ============================================================
   Brand — logo, cover, company identity
   ============================================================ */
const BRAND_ACCEPT = ".png,.jpg,.jpeg,.webp,.svg,image/png,image/jpeg,image/webp,image/svg+xml";
const BRAND_MAX_SVG = 400 * 1024;

function brand(){
  const s = (typeof DB !== "undefined" && DB.settings) ? DB.settings : {};
  return {
    name: s.brandName || "",
    tagline: s.brandTagline || "",
    logo: s.brandLogo || "",
    cover: s.brandCover || "",
    description: s.brandDescription || "",
    info: s.brandInfo || ""
  };
}
function brandInitials(){
  const n = (brand().name || "").trim();
  if (!n) return "HR";
  const parts = n.split(/\s+/).filter(Boolean);
  const letters = parts.length > 1 ? (parts[0][0] + parts[1][0]) : n.slice(0, 2);
  return letters.toUpperCase();
}
/* the mark used everywhere: the uploaded logo, or clean initials */
function brandMark(size, cls){
  const b = brand();
  const px = size || 40;
  if (b.logo)
    return '<span class="brand-logo '+(cls||"")+'" style="width:'+px+'px;height:'+px+'px">'+
           '<img src="'+esc(b.logo)+'" alt="'+esc(b.name||"logo")+'"></span>';
  return '<span class="brand-mark '+(cls||"")+'" style="width:'+px+'px;height:'+px+'px;font-size:'+Math.round(px*0.36)+'px">'+
         esc(brandInitials())+'</span>';
}
/* repaint the sidebar identity after a brand change */
function paintBrand(){
  const b = brand();
  const logoEl = document.getElementById("brandLogo");
  if (logoEl){
    if (b.logo){ logoEl.classList.add("has-img"); logoEl.innerHTML = '<img src="'+esc(b.logo)+'" alt="">'; }
    else { logoEl.classList.remove("has-img"); logoEl.textContent = brandInitials(); }
  }
  const nameEl = document.getElementById("brandName");
  if (nameEl){
    if (b.name){ nameEl.textContent = b.name; nameEl.removeAttribute("data-i18n"); }
    else { nameEl.setAttribute("data-i18n", "app.name"); nameEl.textContent = t("app.name"); }
  }
  const tagEl = document.getElementById("brandTag");
  if (tagEl){
    if (b.tagline){ tagEl.textContent = b.tagline; tagEl.removeAttribute("data-i18n"); }
    else { tagEl.setAttribute("data-i18n", "app.tagline"); tagEl.textContent = t("app.tagline"); }
  }
  document.title = (b.name ? b.name + " — " : "") + "HR Task Manager";
}

/* ---------- image handling ---------- */
/* logos are kept small: SVG as text, raster resized and re-encoded */
async function prepareBrandImage(file, maxPx, quality){
  const type = (file.type || "").toLowerCase();
  const name = (file.name || "").toLowerCase();
  const isSvg = type === "image/svg+xml" || /\.svg$/.test(name);
  const isRaster = type.indexOf("image/") === 0 || /\.(jpe?g|png|webp)$/.test(name);
  if (!isSvg && !isRaster) throw new Error(t("brand.badType"));

  if (isSvg){
    if (file.size > BRAND_MAX_SVG) throw new Error(t("tr.f.tooBig").split("{n}").join("400 KB"));
    const raw = await readFileAsDataURL(file);
    return {data: raw, kind: "svg", name: file.name || "logo.svg"};
  }

  const raw = await readFileAsDataURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error(t("tr.f.badImage")));
    i.src = raw;
  });
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  const scale = Math.min(1, (maxPx || 320) / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  cv.getContext("2d").drawImage(img, 0, 0, w, h);
  /* PNG keeps transparency for logos; covers go to JPEG because they are photos */
  const png = /png|webp/.test(type) || /\.(png|webp)$/.test(name);
  let data;
  try{ data = png ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", quality || 0.82); }
  catch(e){ data = raw; }
  if (png && data.length > raw.length && raw.length < 300000) data = raw;
  return {data: data, kind: png ? "png" : "jpeg", name: file.name || "image"};
}

function saveBrand(patch){
  DB.saveSettings(patch);
  paintBrand();

/* ======= 02c-table.js ======= */
/* ============================================================
   Table engine — sorting, paging and skeletons in one place
   -----------------------------------------------------------
   Every big list uses it, so they all behave identically and the
   DOM only ever holds one page of rows. With 5,000 records the
   browser paints 25 <tr> instead of 5,000, which is where nearly
   all of the rendering cost used to go.
   ============================================================ */
const TableState = {};        // id -> {sort, dir, page}

function tState(id){
  if (!TableState[id]) TableState[id] = {sort:"", dir:"asc", page:1};
  return TableState[id];
}
function tSetSort(id, key){
  const st = tState(id);
  if (st.sort === key) st.dir = st.dir === "asc" ? "desc" : "asc";
  else { st.sort = key; st.dir = "asc"; }
  st.page = 1;
}
function tPageSize(){
  const n = parseInt(DB.settings.pageSize, 10);
  return (isFinite(n) && n > 0) ? n : 25;
}

/* sortable header cell */
function th(id, key, label, opts){
  opts = opts || {};
  if (!key) return '<th'+(opts.style?' style="'+opts.style+'"':'')+'>'+esc(label||"")+'</th>';
  const st = tState(id);
  const on = st.sort === key;
  const ic = on ? (st.dir === "asc" ? "sortA" : "sortD") : "sortN";
  return '<th class="srt'+(on?" on":"")+'" data-sort="'+esc(key)+'" data-tid="'+esc(id)+'"'+(opts.style?' style="'+opts.style+'"':'')+'>'+
    esc(label||"") + '<span class="sic">' + icon(ic, 13) + '</span></th>';
}

/* sort + slice; returns what the view should actually render */
function tApply(id, rows, getters){
  const st = tState(id);
  let out = rows;
  if (st.sort && getters && getters[st.sort]){
    const g = getters[st.sort];
    out = rows.slice().sort((a, b) => {
      const x = g(a), y = g(b);
      const xn = (x === null || x === undefined || x === ""), yn = (y === null || y === undefined || y === "");
      if (xn && yn) return 0;
      if (xn) return 1;                    // blanks always sink, whichever direction
      if (yn) return -1;
      let r;
      if (typeof x === "number" && typeof y === "number") r = x - y;
      else r = String(x).localeCompare(String(y), isRTL() ? "ar" : "en", {numeric:true, sensitivity:"base"});
      return st.dir === "asc" ? r : -r;
    });
  }
  const size = tPageSize();
  const pages = Math.max(1, Math.ceil(out.length / size));
  if (st.page > pages) st.page = pages;
  if (st.page < 1) st.page = 1;
  const from = (st.page - 1) * size;
  return {rows: out.slice(from, from + size), total: out.length, page: st.page, pages: pages, from: from, size: size};
}

/* pager strip — rendered only when there is more than one page */
function pager(id, res){
  if (res.pages <= 1){
    if (!res.total) return "";
    return '<div class="pager no-print"><span class="pinfo">'+
      esc(t("tbl.showingAll").split("{n}").join(res.total))+'</span></div>';
  }
  const p = res.page, last = res.pages;
  const nums = [];
  const push = n => { if (nums.indexOf(n) < 0 && n >= 1 && n <= last) nums.push(n); };
  push(1); push(2);
  for (let i = p - 1; i <= p + 1; i++) push(i);
  push(last - 1); push(last);
  nums.sort((a,b)=>a-b);

  let btns = "";
  let prev = 0;
  nums.forEach(n => {
    if (prev && n - prev > 1) btns += '<span class="gap">…</span>';
    btns += '<button class="pbtn'+(n===p?" on":"")+'" data-tid="'+esc(id)+'" data-page="'+n+'">'+n+'</button>';
    prev = n;
  });
  const back = isRTL() ? "chevR" : "chevL", fwd = isRTL() ? "chevL" : "chevR";
  return '<div class="pager no-print">'+
    '<span class="pinfo">'+esc(t("tbl.showing")
        .split("{a}").join(res.from + 1)
        .split("{b}").join(Math.min(res.from + res.size, res.total))
        .split("{n}").join(res.total))+'</span>'+
    '<div style="flex:1"></div>'+
    '<button class="pbtn" data-tid="'+esc(id)+'" data-page="'+(p-1)+'"'+(p<=1?' disabled':'')+'>'+icon(back,14)+'</button>'+
    btns+
    '<button class="pbtn" data-tid="'+esc(id)+'" data-page="'+(p+1)+'"'+(p>=last?' disabled':'')+'>'+icon(fwd,14)+'</button>'+
  '</div>';
}

/* one call wires every sortable header and every pager on the page */
function wireTables(root){
  $$("th.srt", root).forEach(el => el.onclick = () => {
    tSetSort(el.dataset.tid, el.dataset.sort);
    Router.render(true);
  });
  $$(".pbtn[data-page]", root).forEach(el => el.onclick = () => {
    const st = tState(el.dataset.tid);
    st.page = Math.max(1, parseInt(el.dataset.page, 10) || 1);
    Router.render(true);
    const card = el.closest(".card");
    if (card) card.scrollIntoView({block:"nearest", behavior:"smooth"});
  });
}

/* skeleton rows while something is being prepared */
function skeletonRows(n, cols){
  let h = "";
  for (let i = 0; i < (n || 6); i++){
    h += '<div class="skl-row"><div class="skl-c skl-av"></div><div style="flex:1">'+
      '<div class="skl-c" style="width:'+(45 + (i*7)%35)+'%"></div>'+
      '<div class="skl-c" style="width:'+(25 + (i*11)%25)+'%;margin-top:7px;height:9px"></div></div>';
    for (let c = 0; c < (cols || 2); c++)
      h += '<div class="skl-c" style="width:'+(60 + (c*20)%40)+'px"></div>';
    h += '</div>';
  }
  return '<div class="skl-wrap">' + h + '</div>';
}

/* ======= 03-store.js ======= */
/* ============================================================
   Data layer
   -----------------------------------------------------------
   All persistence goes through StorageAdapter. The default is
   LocalStorageAdapter. To move to Supabase / Firebase later you
   only implement the same 4 methods (read / write / all / clear)
   and swap the adapter in DB.use(...). No view code changes.
   ============================================================ */
const SCHEMA_VERSION = 1;
const NS = "aitms.v1.";

/* ------------------------------------------------------------
   Storage: IndexedDB first (quota is a share of free disk space —
   hundreds of MB to several GB, no practical limit for this app),
   with LocalStorage kept only as an automatic fallback for very old
   browsers. Data already saved in LocalStorage is migrated once.
   ------------------------------------------------------------ */
const IDB = {
  name: "IndexedDB",
  dbName: "aitms",
  store: "kv",
  db: null,
  queue: Promise.resolve(),
  open(){
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error("no indexedDB"));
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = () => { const d = req.result; if (!d.objectStoreNames.contains(this.store)) d.createObjectStore(this.store); };
      req.onsuccess = () => { this.db = req.result; resolve(this.db); };
      req.onerror = () => reject(req.error || new Error("indexedDB open failed"));
      req.onblocked = () => reject(new Error("indexedDB blocked"));
    });
  },
  _tx(mode){ return this.db.transaction(this.store, mode).objectStore(this.store); },
  getRaw(key){
    return new Promise((resolve) => {
      try{
        const r = this._tx("readonly").get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => resolve(undefined);
      }catch(e){ resolve(undefined); }
    });
  },
  putRaw(key, value){
    return new Promise((resolve) => {
      try{
        const r = this._tx("readwrite").put(value, key);
        r.onsuccess = () => resolve(true);
        r.onerror = () => { console.warn("idb put failed", key, r.error); resolve(false); };
      }catch(e){ console.warn("idb put threw", e); resolve(false); }
    });
  },
  delRaw(key){ return new Promise(res => { try{ const r=this._tx("readwrite").delete(key); r.onsuccess=()=>res(true); r.onerror=()=>res(false);}catch(e){res(false);} }); },
  /* the views call these synchronously — persistence happens in the background */
  write(coll, rows){
    const snapshot = JSON.parse(JSON.stringify(rows));
    this.queue = this.queue.then(() => this.putRaw(coll, snapshot)).catch(e => console.warn(e));
    return true;
  },
  writeObj(key, obj){
    const snapshot = JSON.parse(JSON.stringify(obj));
    this.queue = this.queue.then(() => this.putRaw(key, snapshot)).catch(e => console.warn(e));
    return true;
  },
  clearAll(){
    const keys = COLLECTIONS.concat(["settings"]);
    this.queue = this.queue.then(async () => { for (const k of keys) await this.delRaw(k); }).catch(e=>console.warn(e));
  },
  flush(){ return this.queue; }
};

const LocalStorageAdapter = {
  name: "localStorage",
  read(coll){
    try { return JSON.parse(localStorage.getItem(NS + coll) || "[]"); }
    catch(e){ console.warn("read failed", coll, e); return []; }
  },
  write(coll, rows){
    try { localStorage.setItem(NS + coll, JSON.stringify(rows)); return true; }
    catch(e){ console.warn("localStorage write failed", e); return false; }
  },
  readObj(key, def){
    try { const v = localStorage.getItem(NS + key); return v ? JSON.parse(v) : def; }
    catch(e){ return def; }
  },
  writeObj(key, obj){
    try { localStorage.setItem(NS + key, JSON.stringify(obj)); return true; } catch(e){ return false; }
  },
  clearAll(){ Object.keys(localStorage).filter(k=>k.indexOf(NS)===0).forEach(k=>localStorage.removeItem(k)); }
};

/* size of the data actually held, computed from memory — never from a quota */
function dataBytes(){
  let n = 0;
  COLLECTIONS.forEach(c => { try{ n += JSON.stringify(DB.cache[c]||[]).length; }catch(e){} });
  return n * 2;
}
/* real browser quota, only for display */
async function storageEstimate(){
  try{
    if (navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      return {usage: e.usage || 0, quota: e.quota || 0};
    }
  }catch(e){}
  return {usage: dataBytes(), quota: 0};
}
async function requestPersistentStorage(){
  try{
    if (navigator.storage && navigator.storage.persist){
      if (await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    }
  }catch(e){}
  return false;
}

/* Example of the interface a future backend adapter must satisfy:
const SupabaseAdapter = {
  name:"supabase",
  async read(coll){ const {data} = await sb.from(coll).select("*"); return data; },
  async write(coll, rows){ ... upsert ... },
  ...
}
Because every call site goes through DB.*, only DB needs to become async.
*/

const COLLECTIONS = ["companies","employees","jobtitles","tasks","submissions","evaluations","reports","salarytransfers","transferfiles"];

const DEFAULT_SETTINGS = {
  schema: SCHEMA_VERSION,
  orgName: "",
  lang: "ar",
  taskLang: "ar",
  provider: "offline",          // offline | openai | anthropic | gemini | openrouter | custom
  apiKey: "",
  model: "",
  baseUrl: "",
  temperature: 0.6,
  redactPII: true,
  useProxy: false,
  proxyUrl: "",
  defaultDeadlineDays: 5,
  taskStyle: "order",       // order = one-line WhatsApp order (default) | detailed = formal assessment task
  managerVoice: true,
  lastBackupAt: "",
  activeCompanyId: "",      // "" = all companies
  countryCode: "966",       // added ONLY when building a wa.me link; the stored number is never changed
  theme: "light",           // light | dark | auto
  density: "cozy",          // cozy | compact
  pageSize: 25,             // rows per page in the big tables
  brandName: "", brandTagline: "", brandLogo: "", brandCover: "", brandDescription: "", brandInfo: ""
};

const DB = {
  adapter: LocalStorageAdapter,
  cache: {},
  listeners: [],
  use(a){ this.adapter = a; this.cache = {}; },

  /* async: opens IndexedDB, migrates any old LocalStorage data, then fills the
     in-memory cache so every view can keep reading synchronously. */
  async init(){
    let ok = false;
    try{
      await IDB.open();
      this.adapter = IDB;
      const loaded = {};
      for (const c of COLLECTIONS) loaded[c] = (await IDB.getRaw(c)) || null;
      const st = await IDB.getRaw("settings");

      const idbEmpty = COLLECTIONS.every(c => !loaded[c] || !loaded[c].length) && !st;
      if (idbEmpty){
        /* one-time migration from the previous LocalStorage version */
        let migrated = false;
        COLLECTIONS.forEach(c => {
          const rows = LocalStorageAdapter.read(c);
          if (rows && rows.length){ loaded[c] = rows; migrated = true; }
        });
        const oldSettings = LocalStorageAdapter.readObj("settings", null);
        if (migrated || oldSettings){
          COLLECTIONS.forEach(c => IDB.write(c, loaded[c] || []));
          if (oldSettings) IDB.writeObj("settings", oldSettings);
          await IDB.flush();
        }
        this.settings = Object.assign({}, DEFAULT_SETTINGS, oldSettings || {}, st || {});
      } else {
        this.settings = Object.assign({}, DEFAULT_SETTINGS, st || {});
      }
      COLLECTIONS.forEach(c => { this.cache[c] = loaded[c] || []; });
      ok = true;
      requestPersistentStorage();
    }catch(e){
      console.warn("IndexedDB unavailable, falling back to localStorage:", e);
    }
    if (!ok){
      this.adapter = LocalStorageAdapter;
      COLLECTIONS.forEach(c => { this.cache[c] = this.adapter.read(c); });
      this.settings = Object.assign({}, DEFAULT_SETTINGS, this.adapter.readObj("settings", {}));
    }
  },
  all(coll){ return this.cache[coll] || []; },
  get(coll, id){ return this.all(coll).find(r => r.id === id) || null; },
  where(coll, fn){ return this.all(coll).filter(fn); },
  insert(coll, row){
    row.id = row.id || uid(coll.slice(0,3));
    row.createdAt = row.createdAt || new Date().toISOString();
    row.updatedAt = row.createdAt;
    this.cache[coll] = this.all(coll).concat([row]);
    this.adapter.write(coll, this.cache[coll]);
    this.emit(coll);
    return row;
  },
  insertMany(coll, rows){
    const now = new Date().toISOString();
    rows.forEach(r => { r.id = r.id || uid(coll.slice(0,3)); r.createdAt = r.createdAt || now; r.updatedAt = now; });
    this.cache[coll] = this.all(coll).concat(rows);
    this.adapter.write(coll, this.cache[coll]);
    this.emit(coll);
    return rows;
  },
  update(coll, id, patch){
    const rows = this.all(coll);
    const i = rows.findIndex(r => r.id === id);
    if (i < 0) return null;
    rows[i] = Object.assign({}, rows[i], patch, {updatedAt: new Date().toISOString()});
    this.cache[coll] = rows;
    this.adapter.write(coll, rows);
    this.emit(coll);
    return rows[i];
  },
  remove(coll, id){
    this.cache[coll] = this.all(coll).filter(r => r.id !== id);
    this.adapter.write(coll, this.cache[coll]);
    this.emit(coll);
  },
  removeWhere(coll, fn){
    this.cache[coll] = this.all(coll).filter(r => !fn(r));
    this.adapter.write(coll, this.cache[coll]);
    this.emit(coll);
  },
  saveSettings(patch){
    this.settings = Object.assign({}, this.settings, patch);
    this.adapter.writeObj("settings", this.settings);
    this.emit("settings");
    return this.settings;
  },
  emit(coll){ if (typeof clearRenderCache === "function") clearRenderCache();
    this.listeners.forEach(fn => { try{ fn(coll); }catch(e){ console.error(e); } }); },
  onChange(fn){ this.listeners.push(fn); },

  /* ---- backup / restore ---- */
  exportAll(){
    const out = { schema: SCHEMA_VERSION, exportedAt: new Date().toISOString(), settings: Object.assign({}, this.settings, {apiKey:""}) };
    COLLECTIONS.forEach(c => out[c] = this.all(c));
    return out;
  },
  importAll(obj, merge){
    if (!obj || typeof obj !== "object") throw new Error("bad");
    COLLECTIONS.forEach(c => {
      if (!Array.isArray(obj[c])) return;
      const rows = merge ? this.all(c).concat(obj[c].filter(r => !this.get(c, r.id))) : obj[c];
      this.cache[c] = rows;
      this.adapter.write(c, rows);
    });
    if (obj.settings) this.saveSettings(Object.assign({}, obj.settings, {apiKey: this.settings.apiKey}));
    this.emit("*");
  },
  wipe(){
    this.adapter.clearAll();
    LocalStorageAdapter.clearAll();
    COLLECTIONS.forEach(c => { this.cache[c] = []; this.adapter.write(c, []); });
    this.emit("*");
  }
};

/* ============================================================
   Domain helpers
   ============================================================ */
const LEVELS   = ["junior","mid","senior","manager"];
const STATUSES = ["active","onleave","probation","inactive"];
const DIFFS    = ["easy","medium","hard","expert"];
const TYPES    = ["practical","analytical","problem","case","research","report","scenario"];

function levelLabel(v){ return t("level." + v); }
function statusLabel(v){ return t("status." + v); }
function diffLabel(v){ return t("diff." + v); }
function typeLabel(v){ return t("type." + v); }

function effectiveTaskStatus(task){
  if (task.status === "evaluated" || task.status === "submitted") return task.status;
  if (task.deadline && new Date(task.deadline) < new Date(todayISO())) return "overdue";
  return task.status;
}
function taskStatusBadge(task){
  const s = effectiveTaskStatus(task);
  const map = { draft:"b-gray", sent:"b-blue", submitted:"b-purple", evaluated:"b-green", overdue:"b-red" };
  return '<span class="badge '+(map[s]||"b-gray")+'">'+esc(t("st."+s))+'</span>';
}
/* Band colours are read from CSS variables so the dark theme can lift them:
   the light-mode inks are too dark to read on a dark surface. */
function scoreBand(score){
  if (score >= 90) return {key:"excellent", cls:"b-green",  color:"var(--band-green)"};
  if (score >= 75) return {key:"good",      cls:"b-blue",   color:"var(--band-blue)"};
  if (score >= 60) return {key:"acceptable",cls:"b-amber",  color:"var(--band-amber)"};
  return {key:"needs", cls:"b-red", color:"var(--band-red)"};
}
/* charts need a real colour value, not a var() reference */
function bandInk(score){
  const key = scoreBand(score).key;
  const map = {excellent:"--band-green", good:"--band-blue", acceptable:"--band-amber", needs:"--band-red"};
  try{
    const v = getComputedStyle(document.documentElement).getPropertyValue(map[key]).trim();
    if (v) return v;
  }catch(e){}
  return {excellent:"#16a34a", good:"#2563eb", acceptable:"#d97706", needs:"#dc2626"}[key];
}
function bandLabel(score){ return t("ev." + scoreBand(score).key); }

/* ------------------------------------------------------------
   Multi-company scoping
   Every screen reads employees/tasks through these helpers, so the
   whole app follows the company selected in the top bar.
   ------------------------------------------------------------ */
function companies(){ return sortBy(DB.all("companies"), c => c.name); }
function activeCompany(){
  const id = DB.settings.activeCompanyId;
  return id ? DB.get("companies", id) : null;
}
function activeCompanyName(){ const c = activeCompany(); return c ? c.name : t("co.all"); }
function setActiveCompany(id){ DB.saveSettings({activeCompanyId: id || ""}); }

function scopedEmployees(){
  const id = DB.settings.activeCompanyId;
  const rows = DB.all("employees");
  return id ? rows.filter(e => e.companyId === id) : rows;
}
function inScope(employeeId){
  const id = DB.settings.activeCompanyId;
  if (!id) return true;
  const e = DB.get("employees", employeeId);
  return !!e && e.companyId === id;
}
function scopedTasks(){ return DB.all("tasks").filter(x => inScope(x.employeeId)); }
function scopedEvaluations(){ return DB.all("evaluations").filter(x => inScope(x.employeeId)); }
function scopedReports(){ return DB.all("reports").filter(x => inScope(x.employeeId)); }
function companyOf(emp){ const c = emp && emp.companyId ? DB.get("companies", emp.companyId) : null; return c ? c.name : "—"; }
function companyEmployeeCount(id){ return DB.all("employees").filter(e => e.companyId === id).length; }
function companyTaskCount(id){
  const ids = DB.all("employees").filter(e => e.companyId === id).map(e => e.id);
  return DB.all("tasks").filter(x => ids.indexOf(x.employeeId) >= 0).length;
}

function employeeName(id){ const e = DB.get("employees", id); return e ? e.fullName : "—"; }
/* One pass over tasks per paint builds the whole employee index, instead of
   one scan per employee. Sorting 500 employees by score used to walk the task
   array 500 times; now it walks it once. */
function taskIndex(){
  if (RenderCache.taskIdx) return RenderCache.taskIdx;
  const idx = {};
  DB.all("tasks").forEach(tk => { (idx[tk.employeeId] = idx[tk.employeeId] || []).push(tk); });
  RenderCache.taskIdx = idx;
  return idx;
}
function tasksOf(empId){ return taskIndex()[empId] || []; }

/* same idea for evaluations, keyed by task */
function evalIndex(){
  if (RenderCache.evalIdx) return RenderCache.evalIdx;
  const idx = {};
  DB.all("evaluations").forEach(ev => { idx[ev.taskId] = ev; });   // last one wins, as before
  RenderCache.evalIdx = idx;
  return idx;
}
function evalOfTask(taskId){ return evalIndex()[taskId] || null; }
function submissionOfTask(taskId){ return DB.where("submissions", s => s.taskId === taskId).slice(-1)[0] || null; }

/* ------------------------------------------------------------
   Per-render memo. Sorting a table by "score" asks for the stats of
   every employee, and then the visible rows ask again — without this
   a 500-employee list walked the task array a thousand times per
   paint. Router.render() clears it, so a value is never stale.
   ------------------------------------------------------------ */
const RenderCache = {emp:{}, taskIdx:null, evalIdx:null};
function clearRenderCache(){ RenderCache.emp = {}; RenderCache.taskIdx = null; RenderCache.evalIdx = null; }

function employeeStats(empId){
  if (RenderCache.emp[empId]) return RenderCache.emp[empId];
  const out = computeEmployeeStats(empId);
  RenderCache.emp[empId] = out;
  return out;
}
function computeEmployeeStats(empId){
  const tk = tasksOf(empId);
  const evs = tk.map(x => evalOfTask(x.id)).filter(Boolean);
  const scores = evs.map(e => e.score);
  return {
    total: tk.length,
    completed: tk.filter(x => x.status === "evaluated").length,
    submitted: tk.filter(x => x.status === "submitted").length,
    pending: tk.filter(x => ["draft","sent"].indexOf(effectiveTaskStatus(x)) >= 0).length,
    overdue: tk.filter(x => effectiveTaskStatus(x) === "overdue").length,
    avg: scores.length ? avg(scores) : null,
    scores: scores
  };
}
function globalStats(){
  const tasks = scopedTasks();
  const evs = scopedEvaluations();
  const scores = evs.map(e => e.score);
  const done = tasks.filter(x => x.status === "evaluated").length;
  return {
    employees: scopedEmployees().length,
    tasks: tasks.length,
    active: tasks.filter(x => ["sent","submitted"].indexOf(x.status) >= 0).length,
    completed: done,
    pending: tasks.filter(x => ["draft","sent"].indexOf(effectiveTaskStatus(x)) >= 0).length,
    overdue: tasks.filter(x => effectiveTaskStatus(x) === "overdue").length,
    avg: scores.length ? avg(scores) : null,
    rate: tasks.length ? (done / tasks.length) * 100 : 0
  };
}
function departments(){ return unique(scopedEmployees().map(e => e.department).filter(Boolean)).sort(); }
function jobTitles(){ return unique(scopedEmployees().map(e => e.jobTitle).filter(Boolean)).sort(); }

/* ------------------------------------------------------------
   Job-title library — one shared job description per title.
   The employee's own JD always wins; the library only fills the gap.
   Employee data itself is never modified by the library.
   ------------------------------------------------------------ */
function jtKey(title){
  return String(title == null ? "" : title)
    .replace(/[ً-ْـ]/g, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
    .replace(/\s+/g, " ").trim().toLowerCase();
}
function jobTitleRecord(title){
  const k = jtKey(title); if (!k) return null;
  return DB.all("jobtitles").filter(r => jtKey(r.title) === k)[0] || null;
}
function jobTitleJD(title){ const r = jobTitleRecord(title); return r && r.jd ? r.jd : ""; }
/* the JD actually used by every generator / evaluator */
function effectiveJD(emp){
  if (!emp) return "";
  if (emp.jd && String(emp.jd).trim()) return String(emp.jd).trim();
  return jobTitleJD(emp.jobTitle);
}
function jdSource(emp){
  if (!emp) return "none";
  if (emp.jd && String(emp.jd).trim()) return "own";
  return jobTitleJD(emp.jobTitle) ? "library" : "none";
}
/* distinct titles across the ACTIVE company scope + their library status */
function jobTitleGroups(){
  const map = {};
  scopedEmployees().forEach(e => {
    const k = jtKey(e.jobTitle); if (!k) return;
    if (!map[k]) map[k] = {key:k, title:(e.jobTitle||"").trim(), employees:[], depts:{}, withOwnJD:0};
    map[k].employees.push(e);
    if (e.department) map[k].depts[e.department] = (map[k].depts[e.department]||0) + 1;
    if (e.jd && String(e.jd).trim()) map[k].withOwnJD++;
  });
  return Object.keys(map).map(k => {
    const g = map[k];
    const rec = jobTitleRecord(g.title);
    g.record = rec;
    g.jd = rec && rec.jd ? rec.jd : "";
    g.department = Object.keys(g.depts).sort((a,b)=>g.depts[b]-g.depts[a])[0] || "";
    g.count = g.employees.length;
    g.covered = g.employees.filter(e => effectiveJD(e)).length;
    return g;
  }).sort((a,b) => b.count - a.count || a.title.localeCompare(b.title));
}
function saveJobTitleJD(title, jd, extra){
  const clean = String(title||"").trim(); if (!clean) return null;
  const rec = jobTitleRecord(clean);
  const data = Object.assign({title: clean, jd: String(jd||"").trim()}, extra || {});
  return rec ? DB.update("jobtitles", rec.id, data) : DB.insert("jobtitles", data);
}
function managers(){ return unique(scopedEmployees().map(e => e.manager).filter(Boolean)).sort(); }

/* ------------------------------------------------------------
   Phone numbers for WhatsApp links.
   The stored number is NEVER modified — the country code is added
   only while building the link, and a per-company code wins over
   the global default.
   ------------------------------------------------------------ */
function countryCodeFor(emp){
  const co = emp && emp.companyId ? DB.get("companies", emp.companyId) : null;
  const cc = (co && co.countryCode) || DB.settings.countryCode || "";
  return String(cc).replace(/[^\d]/g, "");
}
function rawPhone(emp){
  return String((emp && (emp.whatsapp || emp.mobile)) || "").replace(/[^\d]/g, "");
}
/* full international number used in the link only */
function waNumber(emp){
  let n = rawPhone(emp);
  if (!n) return "";
  const cc = countryCodeFor(emp);
  n = n.replace(/^00+/, "");
  if (cc && n.indexOf(cc) === 0 && n.length > cc.length + 6) return n;   // already international
  n = n.replace(/^0+/, "");                                              // local trunk prefix
  return cc ? (cc + n) : n;
}
function waLink(emp, text){
  const n = waNumber(emp);
  if (!n) return "";
  return "https://wa.me/" + n + (text ? ("?text=" + encodeURIComponent(text)) : "");
}

/* ---------- family detection ---------- */
function detectFamily(jobTitle, jd, department){
  const hay = ((jobTitle||"") + " " + (department||"") + " " + (jd||"")).toLowerCase();
  const titleHay = ((jobTitle||"") + " " + (department||"")).toLowerCase();
  let best = null, bestScore = 0;
  KB.forEach(fam => {
    let score = 0;
    fam.match.forEach(kw => {
      const k = kw.toLowerCase().trim();
      if (!k) return;
      if (titleHay.indexOf(k) >= 0) score += 6;
      else if (hay.indexOf(k) >= 0) score += 2;
    });
    if (score > bestScore){ bestScore = score; best = fam; }
  });
  return bestScore >= 4 ? best : null;
}
function familyName(fam){ return fam ? fam[isRTL()?"ar":"en"].name : null; }

/* ---------- job-description parsing ----------
   Used when no family matches, and to inject real JD wording into
   every generated task so the task is always tied to the actual job. */
const STOPWORDS_EN = "the a an and or of to for with in on at by from as is are be will shall must should any all other their our your his her its this that these those which who whom whose within into per across including etc".split(" ");
const STOPWORDS_AR = "في من على عن الى إلى مع أو و ثم التي الذي هذا هذه ذلك تلك كل بعض جميع أي كما بما عند لدى بين حول قد لقد كان يكون تكون سوف يجب ينبغي كذلك أيضا حيث بحسب وفق وفقا خلال ضمن لدي عبر".split(" ");

function jdSentences(jd){
  if (!jd) return [];
  return String(jd)
    .split(/[\n•\-–—;؛\.۔]|(?:\d+[\).])/g)
    .map(s => s.replace(/\s+/g," ").trim())
    .filter(s => s.length >= 18 && s.length <= 240);
}
function jdKeywords(jd, limit){
  if (!jd) return [];
  const words = String(jd).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(Boolean);
  const stop = STOPWORDS_EN.concat(STOPWORDS_AR);
  const freq = {};
  words.forEach(w => {
    if (w.length < 3 || stop.indexOf(w) >= 0) return;
    freq[w] = (freq[w]||0)+1;
  });
  return Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0, limit||12);
}
/* Build ad-hoc competencies straight out of the job description */
function competenciesFromJD(emp, lang){
  const sents = jdSentences(effectiveJD(emp));
  const ar = lang === "ar";
  const out = [];
  sents.slice(0, 8).forEach((s, i) => {
    const short = s.length > 90 ? s.slice(0, 88) + "…" : s;
    out.push({
      id: "jd_" + i,
      fromJD: true,
      raw: s,
      n: short,
      f: ar ? ("تنفيذ وتحسين المسؤولية التالية من وصفك الوظيفي: " + s) : ("executing and improving this responsibility from your job description: " + s),
      meth: ar
        ? "ابدأ بتوضيح الوضع الحالي، ثم حدّد المعايير التي يُقاس عليها الأداء، ثم قدّم خطوات تنفيذ مرتبة مع الأدلة والأرقام."
        : "Start from the current situation, define how performance is measured, then give ordered execution steps supported by evidence and numbers.",
      d: ar
        ? ["وصف الوضع الحالي والمعطيات المستخدمة","الخطوات التنفيذية مرتبة","المعايير أو المؤشرات المستخدمة","المخاطر أو المعوقات المتوقعة","التوصية النهائية"]
        : ["Current situation and inputs used","Ordered execution steps","Standards or KPIs applied","Expected risks or obstacles","Final recommendation"],
      k: ar
        ? ["ربط الإجابة مباشرة بالمسؤولية المذكورة في الوصف الوظيفي","تقديم خطوات تنفيذية واضحة وقابلة للتطبيق","استخدام معايير أو مؤشرات لقياس النتيجة","ذكر الافتراضات والمعطيات المستخدمة","الختام بتوصية عملية محددة"]
        : ["Ties the answer directly to the responsibility in the job description","Gives clear, executable steps","Uses standards or KPIs to measure the outcome","States the assumptions and inputs used","Ends with a specific, practical recommendation"],
      m: ar
        ? ["إجابة عامة لا ترتبط بالمسؤولية المذكورة","سرد نظري بلا خطوات تنفيذية","غياب أي مؤشر أو معيار للقياس"]
        : ["A generic answer not tied to the stated responsibility","Theory with no execution steps","No measure or standard applied"]
    });
  });
  return out;
}

function detectOrderFamily(emp){
  const titleHay = ((emp.jobTitle||"") + " " + (emp.department||"")).toLowerCase();
  const hay = titleHay + " " + (effectiveJD(emp)||"").toLowerCase();
  let best = null, bestScore = 0;
  ORDER_FAMILIES.forEach(f => {
    let score = 0;
    f.match.forEach(kw => {
      const k = kw.toLowerCase().trim(); if (!k) return;
      if (titleHay.indexOf(k) >= 0) score += 6;
      else if (hay.indexOf(k) >= 0) score += 2;
    });
    if (score > bestScore){ bestScore = score; best = f.key; }
  });
  return bestScore >= 4 ? best : null;
}

/* turn a job-description line into a short object for the generic orders */
function jdSubjects(emp, lang){
  const out = [];
  jdSentences(effectiveJD(emp)).forEach(s => {
    let x = s.replace(/^(مسؤول عن|يقوم بـ|القيام بـ|responsible for|manage|handle)\s*/i, "").trim();
    if (x.length > 70) x = x.slice(0, 68).trim();
    if (x.length >= 10) out.push(x);
  });
  return out;
}

/* simulated data blocks — keeps the employee from inventing facts */
function buildGiven(comp, emp, type, rnd, lang){
  const ar = lang === "ar";
  const monthsEn = ["Month 1","Month 2","Month 3","Month 4","Month 5","Month 6"];
  const monthsAr = ["الشهر 1","الشهر 2","الشهر 3","الشهر 4","الشهر 5","الشهر 6"];
  const months = ar ? monthsAr : monthsEn;
  const base = 400 + Math.floor(rnd()*900);
  const trend = (rnd() > .45 ? 1 : -1) * (0.02 + rnd()*0.08);
  const series = months.map((m,i) => {
    const season = 1 + Math.sin((i+1)/2) * 0.09;
    const noise  = 1 + (rnd()-0.5) * 0.10;
    return m + ": " + Math.round(base * Math.pow(1+trend, i) * season * noise);
  });
  const given = [];
  const needsData = ["analytical","case","report","problem"].indexOf(type) >= 0;
  if (needsData){
    given.push((ar ? "سلسلة بيانات محاكاة لآخر 6 فترات (وحدات/عدد): " : "Simulated series for the last 6 periods (units / count): ") + series.join(" | "));
    given.push(ar
      ? "مدة التوريد / مدة التنفيذ المعتمدة: " + (5 + Math.floor(rnd()*20)) + " يومًا، ومستوى الخدمة المستهدف: " + (90 + Math.floor(rnd()*8)) + "%."
      : "Assumed lead / processing time: " + (5 + Math.floor(rnd()*20)) + " days, target service level: " + (90 + Math.floor(rnd()*8)) + "%.");
    given.push(ar
      ? "حدث خلال الفترة 4 حدث استثنائي (عرض ترويجي / توقف مؤقت) أثّر على الأرقام."
      : "In period 4 an exceptional event (promotion / temporary stoppage) affected the numbers.");
  } else {
    given.push(ar
      ? "الفريق المعني يتكون من 4 أشخاص، والوقت المتاح لإنجاز المهمة محدود بأسبوع عمل واحد."
      : "The team involved is 4 people and the available window is one working week.");
    given.push(ar
      ? "لا توجد ميزانية إضافية؛ الحل يجب أن يعتمد على الموارد الحالية."
      : "There is no extra budget; the solution must work with existing resources.");
  }
  given.push(ar
    ? "أي معلومة غير مذكورة هنا يجب أن تُكتب كافتراض صريح في إجابتك، ولا يجوز اختلاق بيانات حقيقية عن الشركة."
    : "Anything not stated here must be written as an explicit assumption in your answer. Do not invent real company data.");
  return given;
}

/* ------------------------------------------------------------
   Task style
     simple   (default) — an everyday task the way a manager writes it
                          to their employee: short, plain, no simulated
                          data, no exam language.
     detailed           — the formal assessment / case-study format.
   ------------------------------------------------------------ */
function buildOfflineTask(emp, opts, idx, salt){
  const style = opts.style || (DB.settings && DB.settings.taskStyle) || "order";
  if (style === "detailed") return buildDetailedTask(emp, opts, idx, salt);
  if (style === "simple")   return buildSimpleTask(emp, opts, idx, salt);
  return buildOrderTask(emp, opts, idx, salt);
}

/* ------------------------------------------------------------
   ORDER STYLE (default) — a task the way a manager sends it on
   WhatsApp: one short line, one verb, nothing else.
   ------------------------------------------------------------ */
function buildOrderTask(emp, opts, idx, salt){
  const lang = (opts.lang === "en") ? "en" : "ar";
  const famKey = detectOrderFamily(emp);
  const rnd = seedRand((emp.id||"e") + "|ord|" + idx + "|" + (salt||""));
  const ord = seedRand((emp.id||"e") + "|ordpool|" + (salt||""));

  let pool = [];
  if (famKey && ORDERS[famKey]) pool = shuffle(ORDERS[famKey], ord).map(e => e[lang]);

  /* generic orders built from the employee's own job description */
  const subjects = jdSubjects(emp, lang);
  const generics = [];
  GENERIC_ORDERS[lang].forEach((g, gi) => {
    const subj = subjects.length ? subjects[gi % subjects.length]
                                 : (lang === "ar" ? "مهامك الأساسية" : "your main duties");
    generics.push({t: g.t, o: g.o.split("{x}").join(subj), m: g.m, k: g.k});
  });
  if (!pool.length) pool = shuffle(generics, ord);
  else pool = pool.concat(shuffle(generics, ord));

  /* skip orders already used for this employee, or already used earlier in
     the same bulk batch, so two people never receive the same line */
  const avoid = (opts.avoid || []).map(x => String(x||"").trim());
  let entry = null;
  for (let step = 0; step < pool.length; step++){
    const cand = pool[(idx + step) % pool.length];
    if (avoid.indexOf(String(cand.t||"").trim()) < 0){ entry = cand; break; }
  }
  if (!entry) entry = pool[idx % pool.length];
  const diff = opts.difficulty || "medium";
  const time = {easy:20, medium:35, hard:60, expert:90}[diff] || 35;

  return {
    title: entry.t,
    scenario: entry.o,
    given: [],
    objective: "",
    instructions: [],
    deliverable: [],
    difficulty: diff,
    type: "practical",
    estimatedTime: time,
    competency: entry.t,
    competencyId: "order",
    family: famKey || "jd",
    lang: lang,
    isSimulation: false,
    style: "order",
    solution: {
      expectedAnswer: entry.m,
      steps: [],
      keyPoints: entry.k || [],
      criteria: orderCriteria(lang),
      commonMistakes: lang === "ar"
        ? ["إجابة عامة بدون أرقام أو أسماء","ما فيها نتيجة واضحة أو خطوة تالية"]
        : ["A vague answer with no numbers or names","No clear result or next step"],
      rubric: standardRubric(lang)
    },
    engine: "builtin"
  };
}

/* pool of competencies for this employee (KB family first, then the JD) */
function competencyPool(emp, opts, salt){
  const lang = opts.lang || "ar";
  const fam = detectFamily(emp.jobTitle, effectiveJD(emp), emp.department);
  let famComps = fam ? fam.comps.map(c => Object.assign({id:c.id, family:fam.key}, c[lang])) : [];
  let jdComps = competenciesFromJD(emp, lang);
  if (opts.focus){
    const f = opts.focus.toLowerCase();
    const rank = (list) => {
      const hit = list.filter(c => (c.n+" "+c.f).toLowerCase().indexOf(f) >= 0);
      return hit.length ? hit.concat(list.filter(c => hit.indexOf(c) < 0)) : list;
    };
    famComps = rank(famComps); jdComps = rank(jdComps);
  }
  const ord = seedRand(emp.id + "|order|" + (salt||""));
  let pool = shuffle(famComps, ord).concat(shuffle(jdComps, ord));
  if (!pool.length) pool = competenciesFromJD({jd: (emp.jobTitle||"") + ". " + (emp.department||"")}, lang);
  if (!pool.length) pool = [{
    id:"generic", n: lang==="ar" ? "المهام الأساسية للوظيفة" : "Core job duties",
    f: lang==="ar" ? ("متابعة المهام الأساسية لوظيفة " + (emp.jobTitle||"")) : ("handling the core duties of a " + (emp.jobTitle||"role")),
    meth: lang==="ar" ? "وضّح الوضع الحالي، ثم الخطوات، ثم النتيجة." : "Describe the situation, the steps, then the result.",
    d: lang==="ar" ? ["الخطوات اللي سويتها","النتيجة","الملاحظات"] : ["Steps taken","The result","Notes"],
    k: lang==="ar" ? ["خطوات واضحة","نتيجة محددة","ذكر الملاحظات"] : ["Clear steps","A specific result","Notes included"],
    m: lang==="ar" ? ["إجابة عامة","بدون نتيجة واضحة"] : ["Generic answer","No clear result"]
  }];
  return {pool: pool, fam: fam};
}

    ? ("الإجابة القوية تعالج " + comp.f + " بشكل منظم: تبدأ بتحديد المعطيات والافتراضات، ثم تطبّق منهجية واضحة (" + comp.meth + ") ، ثم تعرض جميع بنود المخرج المطلوب (" + deliverable.join("، ") + ") بأرقام أو أدلة، وتنتهي بتوصية محددة قابلة للتنفيذ. الإجابة المقبولة تغطي أغلب النقاط الأساسية أدناه حتى لو اختلفت الصياغة أو المنهجية، فالمعيار هو صحة المعنى والمنطق وليس تطابق الكلمات.")
    : ("A strong answer handles " + comp.f + " in a structured way: it starts by separating the given data from the assumptions, applies a clear methodology (" + comp.meth + "), presents every required deliverable (" + deliverable.join(", ") + ") with numbers or evidence, and closes with a specific, actionable recommendation. An acceptable answer covers most of the key points below even if the wording or the chosen method differs — what matters is the reasoning, not matching words.");

  const criteria = ar ? [
    {name:"الدقة", weight:25, description:"صحة الحسابات والمعلومات والمنهجية المستخدمة، وخلوّ الإجابة من الأخطاء الجوهرية."},
    {name:"الاكتمال", weight:25, description:"تغطية جميع بنود المخرج المطلوب دون نقص."},
    {name:"الفهم", weight:20, description:"فهم سياق المهمة ومسؤوليات الوظيفة وليس مجرد إعادة صياغة السؤال."},
    {name:"حل المشكلات", weight:15, description:"جودة التحليل وربط السبب بالنتيجة والمفاضلة بين البدائل."},
    {name:"التطبيق العملي", weight:15, description:"قابلية التنفيذ الفعلي: خطوات محددة، مسؤول، تاريخ، وأرقام."}
  ] : [
    {name:"Accuracy", weight:25, description:"Correctness of the calculations, facts and methodology; no material errors."},
    {name:"Completeness", weight:25, description:"Every required deliverable item is covered."},
    {name:"Understanding", weight:20, description:"Real understanding of the context and the role, not a restatement of the question."},
    {name:"Problem Solving", weight:15, description:"Quality of the analysis, cause-effect reasoning and trade-offs between options."},
    {name:"Practical Application", weight:15, description:"Can actually be executed: concrete steps, owner, date and numbers."}
  ];

  const rubric = ar ? [
    {band:"ممتاز", range:"90-100", description:"يغطي جميع البنود بدقة، منهجية واضحة ومبررة، أرقام صحيحة، وتوصية قابلة للتنفيذ فورًا."},
    {band:"جيد", range:"75-89", description:"يغطي معظم البنود بمنهجية سليمة مع نقص محدود في التفاصيل أو الأدلة."},
    {band:"مقبول", range:"60-74", description:"فهم أساسي صحيح لكن مع نقص في التغطية أو ضعف في الأدلة والأرقام."},
    {band:"يحتاج تحسين", range:"أقل من 60", description:"إجابة عامة أو ناقصة أو غير مرتبطة بالمعطيات والمسؤوليات."}
  ] : [
    {band:"Excellent", range:"90-100", description:"All items covered accurately, methodology clear and justified, numbers correct, recommendation immediately actionable."},
    {band:"Good", range:"75-89", description:"Most items covered with a sound method; limited gaps in detail or evidence."},
    {band:"Acceptable", range:"60-74", description:"Basic understanding is right but coverage is incomplete or evidence is weak."},
    {band:"Needs Improvement", range:"below 60", description:"Generic, incomplete, or disconnected from the given data and the role."}
  ];

  return {
    title: titlePrefix + ": " + comp.n,
    scenario: opener,
    given: given,
    objective: objective,
    instructions: instructions,
    deliverable: deliverable,
    difficulty: diff,
    type: type,
    estimatedTime: meta.time,
    competency: comp.n,
    competencyId: comp.id,
    family: fam ? fam.key : "jd",
    lang: lang,
    isSimulation: true,
    style: "detailed",
    solution: {
      expectedAnswer: expectedAnswer,
      steps: steps,
      keyPoints: comp.k,
      criteria: criteria,
      commonMistakes: comp.m,
      rubric: rubric
    },
    engine: "builtin"
  };
}
function levelLabelIn(level, lang){
  const m = {en:{junior:"Junior",mid:"Mid-Level",senior:"Senior",manager:"Manager"},
             ar:{junior:"مبتدئ",mid:"متوسط",senior:"خبير",manager:"مدير"}};
  return (m[lang]||m.en)[level] || (m[lang]||m.en).mid;
}

/* ============================================================
   Offline evaluation — multi-signal, not plain keyword matching
   ============================================================ */
const AR_DIACRITICS = /[ً-ْٰـ]/g;
function normText(s){
  return String(s||"")
    .toLowerCase()
    .replace(AR_DIACRITICS,"")
    .replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[^\p{L}\p{N}\s%]/gu," ")
    .replace(/\s+/g," ").trim();
}
function stem(w){
  if (/[؀-ۿ]/.test(w)){
    let x = w;
    x = x.replace(/^(وال|بال|فال|كال|ال|و|ف|ب|ل|ك)/,"");
    x = x.replace(/(ات|ون|ين|ان|ها|هم|هن|كم|نا|يه|ية|يه)$/,"");
    return x.length >= 3 ? x : w;
  }
  return w.replace(/(ing|ed|es|s)$/,"").replace(/(ies)$/,"y");
}
const STOP_ALL = new Set(STOPWORDS_EN.concat(STOPWORDS_AR).concat(
  "على من في عن مع الى إلى هذا هذه ذلك التي الذي كل بعض كان يكون قد ما لا نعم بين حول عند لدى".split(" ")));
function tokens(s){
  return normText(s).split(" ").filter(w => w.length >= 3 && !STOP_ALL.has(w)).map(stem);
}
/* concept groups let a different wording still count as covered */
const CONCEPTS = [
  ["method","methodology","approach","منهج","منهجيه","طريقه","اسلوب"],
  ["assumption","assume","افتراض","افتراضات","نفترض"],
  ["risk","مخاطر","خطر","تهديد"],
  ["recommend","recommendation","اوصي","توصيه","توصيات","مقترح","اقترح"],
  ["trend","اتجاه","نمو","تراجع","انخفاض","ارتفاع"],
  ["season","seasonality","موسم","موسميه"],
  ["accuracy","error","mape","دقه","خطا","انحراف","انحياز"],
  ["cause","root","سبب","اسباب","جذري"],
  ["owner","responsible","مسؤول","المسؤول","مالك"],
  ["deadline","date","timeline","تاريخ","موعد","جدول","زمني"],
  ["cost","تكلفه","تكاليف","ميزانيه"],
  ["policy","سياسه","نظام","لائحه","اجراء","إجراء"],
  ["document","توثيق","مستند","سجل","ارشفه"],
  ["kpi","metric","measure","مؤشر","مؤشرات","قياس","معيار","معايير"],
  ["compare","comparison","مقارنه","قارن","مقابل"],
  ["step","خطوه","خطوات","مرحله","مراحل"],
  ["service","level","خدمه","مستوى"],
  ["stock","inventory","مخزون","رصيد","تغطيه"],
  ["forecast","تنبؤ","توقع","خطه الطلب"],
  ["quality","جوده","مطابقه"],
  ["train","coach","تدريب","توجيه","تطوير"],
  ["escalate","تصعيد","رفع"],
  ["evidence","دليل","ادله","اثبات","مرفق"]
];
const CONCEPT_INDEX = (function(){
  const m = {};
  CONCEPTS.forEach((g, i) => g.forEach(w => { m[stem(normText(w))] = i; }));
  return m;
})();
function conceptSet(toks){
  const s = new Set();
  toks.forEach(w => { const c = CONCEPT_INDEX[w]; if (c !== undefined) s.add("c"+c); });
  return s;
}
function coverageOf(target, answerToks, answerConcepts){
  const tt = tokens(target);
  if (!tt.length) return 0;
  const aset = new Set(answerToks);
  let hits = 0;
  const seen = new Set();
  tt.forEach(w => {
    if (seen.has(w)) return; seen.add(w);
    if (aset.has(w)) { hits++; return; }
    const c = CONCEPT_INDEX[w];
    if (c !== undefined && answerConcepts.has("c"+c)) { hits += 0.9; return; }
    // partial (prefix) match handles morphology the stemmer missed
    for (const a of aset){ if (a.length>4 && (a.indexOf(w)===0 || w.indexOf(a)===0)) { hits += 0.75; return; } }
  });
  return clamp(hits / seen.size, 0, 1);
}

function evaluateOffline(task, answerText){
  const ans = String(answerText||"");
  const lang = task.lang || "ar";
  const ar = lang === "ar";
  const aToks = tokens(ans);
  const aCon  = conceptSet(aToks);
  const sol = task.solution || {};
  const keyPoints = sol.keyPoints || [];
  const deliver   = task.deliverable || [];
  const mistakes  = sol.commonMistakes || [];

  const words = ans.trim().split(/\s+/).filter(Boolean).length;
  const lines = ans.split(/\n/).filter(l => l.trim().length > 1).length;
  const hasNumbers   = (ans.match(/\d+([.,]\d+)?/g) || []).length;
  const hasPercent   = /%|بالمائه|بالمئة|percent/i.test(ans);
  const hasStructure = /(^|\n)\s*([-•*]|\d+[\).])/.test(ans) || lines >= 4;
  const reasonRe = ar
    ? /(لان|بسبب|بالتالي|لذلك|نتيجه|السبب|مما ادى|يترتب|وبناء عليه|مقارنه|بينما|في المقابل)/
    : /(because|therefore|as a result|due to|which means|caused by|compared to|whereas|however|trade-?off)/i;
  const actionRe = ar
    ? /(اوصي|نوصي|التوصيه|خطه|خطوات|سنقوم|يجب|المسؤول|تاريخ|خلال|موعد)/
    : /(recommend|action plan|next step|owner|by \d|deadline|within \d|we will|should)/i;
  const normAns = normText(ans);
  const normDesc = normText((task.scenario||"") + " " + (task.instructions||[]).join(" "));
  // how much of the answer is just the question copied back
  let copied = 0;
  if (normDesc.length > 40){
    const dToks = new Set(tokens(normDesc));
    const same = aToks.filter(w => dToks.has(w)).length;
    copied = aToks.length ? same / aToks.length : 0;
  }

  /* --- key point coverage --- */
  const kpCov = keyPoints.map(k => coverageOf(k, aToks, aCon));
  const kpScore = kpCov.length ? avg(kpCov) : 0.5;
  /* --- deliverable coverage --- */
  const dCov = deliver.map(d => coverageOf(d, aToks, aCon));
  const dScore = dCov.length ? avg(dCov) : (kpCov.length ? avg(kpCov) : 0.5);
  /* --- mistakes detected --- */
  const mistakeHits = mistakes.filter(m => coverageOf(m, aToks, aCon) > 0.72).length;

  /* --- length adequacy: enough substance for the difficulty --- */
  const expectWords = (task.style === "detailed")
    ? ({easy:90, medium:160, hard:260, expert:360}[task.difficulty] || 160)
    : (task.style === "order"
        ? ({easy:25, medium:40, hard:60, expert:90}[task.difficulty] || 40)
        : ({easy:45, medium:80, hard:130, expert:190}[task.difficulty] || 80));
  const lenFactor = clamp(words / expectWords, 0, 1.15);

  /* --- dimensions (0..100) --- */
  let accuracy = 100 * (0.60*kpScore + 0.20*clamp(hasNumbers/4,0,1) + 0.20*(reasonRe.test(ans)?1:0.35));
  accuracy -= mistakeHits * 9;
  let completeness = 100 * (0.65*dScore + 0.20*clamp(lenFactor,0,1) + 0.15*(hasStructure?1:0.3));
  let understanding = 100 * (0.55*kpScore + 0.25*(reasonRe.test(ans)?1:0.3) + 0.20*(1-clamp(copied*1.4,0,1)));
  let problem = 100 * (0.45*kpScore + 0.30*(reasonRe.test(ans)?1:0.25) + 0.25*clamp((hasNumbers?1:0.4) * (hasPercent?1:0.85),0,1));
  let practical = 100 * (0.40*dScore + 0.30*(actionRe.test(ans)?1:0.3) + 0.30*(hasStructure?1:0.35));

  /* very short or empty answers cannot score well */
  const minWords = (task.style === "detailed") ? 25 : (task.style === "order" ? 8 : 15);
  if (words < minWords){ const f = clamp(words/minWords, 0.05, 1); accuracy*=f; completeness*=f; understanding*=f; problem*=f; practical*=f; }

  const dims = {
    accuracy: clamp(Math.round(accuracy),0,100),
    completeness: clamp(Math.round(completeness),0,100),
    understanding: clamp(Math.round(understanding),0,100),
    problemSolving: clamp(Math.round(problem),0,100),
    practicalApplication: clamp(Math.round(practical),0,100)
  };
  const score = clamp(Math.round(
    dims.accuracy*0.25 + dims.completeness*0.25 + dims.understanding*0.20 +
    dims.problemSolving*0.15 + dims.practicalApplication*0.15), 0, 100);

  /* --- narrative --- */
  const strengths = [];
  const improvements = [];
  keyPoints.forEach((k,i) => { if (kpCov[i] >= 0.6) strengths.push(k); });
  keyPoints.forEach((k,i) => { if (kpCov[i] < 0.4) improvements.push((ar? "لم تُعالج بوضوح: " : "Not clearly addressed: ") + k); });
  deliver.forEach((d,i) => { if (dCov[i] < 0.35) improvements.push((ar? "بند ناقص من المخرج المطلوب: " : "Missing deliverable item: ") + d); });
  if (hasNumbers < 2) improvements.push(ar ? "دعّم الإجابة بأرقام أو حسابات واضحة." : "Support the answer with explicit numbers or calculations.");
  if (!reasonRe.test(ans)) improvements.push(ar ? "اربط النتائج بأسبابها (لماذا حدث ذلك وماذا يترتب عليه)." : "Connect findings to their causes (why it happened and what follows).");
  if (!actionRe.test(ans)) improvements.push(ar ? "اختم بتوصية تنفيذية محددة مع مسؤول وتاريخ." : "Close with a specific recommendation, an owner and a date.");
  if (copied > 0.55) improvements.push(ar ? "جزء كبير من الإجابة إعادة صياغة لنص المهمة — أضف تحليلك أنت." : "A large part of the answer restates the task text — add your own analysis.");
  if (mistakeHits) improvements.push(ar ? "ظهرت مؤشرات على أخطاء شائعة مذكورة في معايير التقييم." : "Signals of the documented common mistakes were detected.");
  if (hasStructure) strengths.push(ar ? "إجابة منظمة وسهلة المتابعة" : "Well structured and easy to follow");
  if (words >= expectWords*0.8) strengths.push(ar ? "عمق كافٍ يتناسب مع مستوى صعوبة المهمة" : "Depth appropriate to the difficulty level");

  const band = scoreBand(score);
  const finalTxt = ar
    ? {excellent:"أداء قوي جدًا — الإجابة مكتملة ومدعّمة وقابلة للتنفيذ.",
       good:"أداء جيد — الأساس صحيح مع فجوات محدودة في التفاصيل أو الأدلة.",
       acceptable:"أداء مقبول — الفهم الأساسي موجود لكن التغطية والأدلة تحتاج تقوية.",
       needs:"يحتاج تحسين — الإجابة عامة أو ناقصة مقارنة بما تتطلبه المهمة."}[band.key]
    : {excellent:"Strong Performance — complete, evidenced and ready to act on.",
       good:"Good Performance — sound basis with limited gaps in detail or evidence.",
       acceptable:"Acceptable — the basic understanding is there but coverage and evidence need work.",
       needs:"Needs Improvement — the answer is generic or incomplete against what the task required."}[band.key];

  return {
    score: score,
    dimensions: dims,
    strengths: unique(strengths).slice(0,6),
    improvements: unique(improvements).slice(0,7),
    finalAssessment: finalTxt,
    band: band.key,
    rationale: ar
      ? ("تمت المقارنة مع الحل المتوقع: تغطية النقاط الأساسية " + Math.round(kpScore*100) + "%، تغطية بنود المخرج " + Math.round(dScore*100) + "%، عدد الكلمات " + words + "، مؤشرات تحليل سببي: " + (reasonRe.test(ans)?"نعم":"لا") + ".")
      : ("Compared against the expected solution: key-point coverage " + Math.round(kpScore*100) + "%, deliverable coverage " + Math.round(dScore*100) + "%, " + words + " words, causal reasoning markers: " + (reasonRe.test(ans)?"yes":"no") + "."),
    engine: "builtin"
  };
}

/* ---------- offline report ---------- */
function buildOfflineReport(emp, tasks, evals, lang, periodLabel){
  const ar = lang === "ar";
  const scores = evals.map(e => e.score);
  const a = scores.length ? avg(scores) : null;
  const dimNames = ["accuracy","completeness","understanding","problemSolving","practicalApplication"];
  const dimLabels = {
    accuracy: ar?"الدقة":"Accuracy", completeness: ar?"الاكتمال":"Completeness",
    understanding: ar?"الفهم":"Understanding", problemSolving: ar?"حل المشكلات":"Problem Solving",
    practicalApplication: ar?"التطبيق العملي":"Practical Application"
  };
  const dimAvg = {};
  dimNames.forEach(d => { const v = evals.map(e => (e.dimensions||{})[d]).filter(x => typeof x === "number"); dimAvg[d] = v.length ? avg(v) : null; });
  const ranked = dimNames.filter(d => dimAvg[d] !== null).sort((x,y) => dimAvg[y]-dimAvg[x]);
  const strong = ranked.slice(0,2).map(d => dimLabels[d] + " (" + num(dimAvg[d]) + ")");
  const weak   = ranked.slice(-2).map(d => dimLabels[d] + " (" + num(dimAvg[d]) + ")");

  const compStrength = {};
  tasks.forEach(tk => { const e = evals.find(x => x.taskId === tk.id); if (e && tk.competency){ (compStrength[tk.competency] = compStrength[tk.competency]||[]).push(e.score); } });
  const compRank = Object.keys(compStrength).map(k => ({k:k, v:avg(compStrength[k])})).sort((x,y)=>y.v-x.v);

  const completed = tasks.filter(x => x.status === "evaluated").length;
  const overdue = tasks.filter(x => effectiveTaskStatus(x) === "overdue").length;

  const overall = a === null
    ? (ar ? "لا توجد مهام مُقيّمة في هذه الفترة، لذلك لا يمكن إصدار حكم على الأداء." : "No evaluated tasks in this period, so no performance judgement can be made.")
    : (ar ? ("متوسط الأداء " + num(a) + "/100 وهو ضمن مستوى «" + bandLabelIn(a, lang) + "». أنجز الموظف " + completed + " مهمة مُقيّمة من أصل " + tasks.length + (overdue?("، مع " + overdue + " مهمة متأخرة"):"") + ".")
          : ("Average performance is " + num(a) + "/100, which falls in the \"" + bandLabelIn(a, lang) + "\" band. " + completed + " of " + tasks.length + " tasks were completed and evaluated" + (overdue?(", with " + overdue + " overdue"):"") + "."));

  const recs = [];
  if (a !== null && a < 75) recs.push(ar ? ("التركيز التدريبي على: " + (weak[0]||"") + " من خلال مهمة تطبيقية أسبوعية مع مراجعة مباشرة.") : ("Focus development on: " + (weak[0]||"") + " through one applied task per week with direct review."));
  if (compRank.length > 1) recs.push(ar ? ("أضعف جدارة حاليًا: " + compRank[compRank.length-1].k + " — أعطِ مهمتين متتاليتين في هذه الجدارة بمستوى أعلى.") : ("Weakest competency: " + compRank[compRank.length-1].k + " — assign two consecutive tasks in it at a higher level."));
  if (overdue) recs.push(ar ? "معالجة التأخر في التسليم بالاتفاق على مواعيد أقصر وأكثر وضوحًا." : "Address late delivery by agreeing shorter, clearer deadlines.");
  if (a !== null && a >= 90) recs.push(ar ? "الأداء متقدم — ارفع مستوى الصعوبة إلى Expert وأسند مهامًا ذات أثر على القسم." : "Performance is advanced — raise difficulty to Expert and assign department-impact tasks.");
  if (!recs.length) recs.push(ar ? "الاستمرار على نفس الوتيرة مع مهمة واحدة على الأقل شهريًا لضمان استمرارية القياس." : "Keep the current pace with at least one task per month to maintain a measurement trend.");

  return {
    period: periodLabel,
    numTasks: tasks.length,
    completed: completed,
    avgScore: a,
    strongAreas: strong.concat(compRank.slice(0,1).map(c => c.k + " (" + num(c.v) + ")")),
    weakAreas: weak.concat(compRank.slice(-1).map(c => c.k + " (" + num(c.v) + ")")).filter((v,i,s)=>s.indexOf(v)===i),
    overall: overall,
    recommendations: recs,
    engine: "builtin"
  };
}
function bandLabelIn(score, lang){
  const k = scoreBand(score).key;
  const m = {en:{excellent:"Excellent",good:"Good",acceptable:"Acceptable",needs:"Needs Improvement"},
             ar:{excellent:"ممتاز",good:"جيد",acceptable:"مقبول",needs:"يحتاج تحسين"}};
  return (m[lang]||m.en)[k];
}

/* ============================================================
   Offline job-description builder (job-title library)

   competency knowledge base. Never invents company-specific data.

function buildOfflineJD(title, department, level, lang){
  const ar = (lang || (isRTL() ? "ar" : "en")) === "ar";
  const fam = detectFamily(title, "", department);
  const L = level || "mid";
  const jt = String(title || "").trim();
  const dp = String(department || "").trim();

  const head = ar
    ? (jt + (dp ? " — " + dp : "") + ".")
    : (jt + (dp ? " — " + dp : "") + ".");

  const scope = ar
    ? ({junior:"يعمل تحت إشراف مباشر وينفّذ المهام اليومية المتكررة ويصعّد الحالات غير المعتادة.",
        mid:"يعمل باستقلالية في المهام اليومية ويرجع لمديره في الحالات الاستثنائية أو القرارات ذات الأثر.",
        senior:"يتولى الحالات المعقّدة، ويراجع عمل زملائه، ويقترح تحسينات على طريقة العمل.",
        lead:"يوزّع العمل على الفريق ويتابع الإنجاز ويقدّم تقارير الأداء لإدارته."}[L] || "يعمل باستقلالية في المهام اليومية ويرجع لمديره في الحالات الاستثنائية.")
    : ({junior:"Works under direct supervision, handles the routine day-to-day work and escalates anything unusual.",
        mid:"Works independently on day-to-day duties and refers exceptions or high-impact decisions to the manager.",
        senior:"Handles the complex cases, reviews colleagues' work and suggests improvements to how the work is done.",
        lead:"Distributes work across the team, tracks completion and reports performance to management."}[L] || "Works independently on day-to-day duties and refers exceptions to the manager.");

  let duties = [];
  if (fam){
    duties = fam.comps.slice(0, 6).map(c => {
      const o = c[ar ? "ar" : "en"];
      let f = String(o.f || "").trim();
      if (f) f = f.charAt(0).toUpperCase() + f.slice(1);
      return ar ? (o.n + ": " + (o.f || "")) : (o.n + ": " + (o.f || ""));
    });
  } else {
    duties = ar
      ? ["تنفيذ المهام اليومية الخاصة بالمسمى في الوقت المحدد.",
         "متابعة الطلبات الواردة والرد عليها وإغلاقها.",
         "تجهيز التقارير والملفات المطلوبة من المدير المباشر.",
         "التنسيق مع الأقسام الأخرى لإنهاء ما يخص القسم.",
         "حفظ المستندات والبيانات محدّثة وصحيحة."]
      : ["Delivers the day-to-day duties of the role on time.",
         "Follows up on incoming requests, responds to them and closes them.",
         "Prepares the reports and files the direct manager asks for.",
         "Coordinates with other departments to finish work related to the team.",
         "Keeps documents and data accurate and up to date."];
  }

  const measures = ar
    ? ["إنجاز المهام في وقتها.","دقة البيانات والمستندات.","سرعة الرد والمتابعة.","جودة التقارير المقدّمة."]
    : ["Tasks completed on time.","Accuracy of data and documents.","Response and follow-up speed.","Quality of the reports produced."];

  const lines = [];
  lines.push(head);
  lines.push(scope);
  lines.push("");
  lines.push(ar ? "المهام والمسؤوليات:" : "Duties and responsibilities:");
  duties.forEach(d => lines.push("- " + d));
  lines.push("");
  lines.push(ar ? "كيف يُقاس الأداء:" : "How performance is measured:");
  measures.forEach(m => lines.push("- " + m));
  return lines.join("\n");
}

             defaultBase:"https://generativelanguage.googleapis.com/v1beta"},
  openrouter:{label:"OpenRouter",     models:["openai/gpt-4o-mini","anthropic/claude-sonnet-4.5","google/gemini-2.0-flash-001"], needsKey:true,
             defaultBase:"https://openrouter.ai/api/v1"},

function aiEnabled(){
  const s = DB.settings;
  if (s.useProxy && s.proxyUrl) return true;
  return s.provider !== "offline" && !!s.apiKey;
}
function aiLabel(){
  const s = DB.settings;
  if (s.useProxy && s.proxyUrl) return "Proxy";
  if (!aiEnabled()) return t("ai.builtin");
  return (PROVIDERS[s.provider] ? (PROVIDERS[s.provider].label.indexOf("set.")===0 ? t(PROVIDERS[s.provider].label) : PROVIDERS[s.provider].label) : s.provider) + (s.model ? " · " + s.model : "");
}

/* ---------- employee context sent to the model (PII-aware) ---------- */
function employeeContext(emp){
  const s = DB.settings;
  const ctx = {
    jobTitle: emp.jobTitle || "",
    department: emp.department || "",
    experienceLevel: emp.level || "mid",
    skills: emp.skills || [],
    jobDescription: effectiveJD(emp)
  };
  if (!s.redactPII){
    ctx.fullName = emp.fullName;
    ctx.employeeId = emp.empId || "";

  const fam = detectFamily(emp.jobTitle, effectiveJD(emp), emp.department);
  if (fam) ctx.domainHint = fam.en.name + " — typical competencies: " + fam.comps.map(c => c.en.n).join(", ");
  return ctx;
}

      ? "Write ALL output values in formal, professional Arabic (the Modern Standard Arabic used in Gulf corporate HR). Keep JSON keys in English."
      : "Write ALL output values in natural, everyday professional Arabic — the way a Gulf manager actually writes to their team: clear and human, not stiff or academic. Keep JSON keys in English.";
