    '<button class="btn btn-primary" id="mfSave">'+esc(t("common.save"))+'</button></div>';

  Modal.open(html, {wide:true, onOpen(m){
    const read = () => {
      const eId = fieldVal(m,"employeeId");
      const emp = DB.get("employees", eId);
      return {
        employeeId: eId,
        employeeSnapshot: emp ? {name:emp.fullName, jobTitle:emp.jobTitle, department:emp.department, level:emp.level} : null,
        title: fieldVal(m,"title"),
        scenario: $('[name="scenario"]', m).value.trim(),
        type: fieldVal(m,"type"),
        difficulty: fieldVal(m,"difficulty"),
        deadline: fieldVal(m,"deadline") || isoDate(addDays(new Date(),5)),
        estimatedTime: clamp(parseInt(fieldVal(m,"estimatedTime"),10)||45, 5, 600),
        competency: fieldVal(m,"competency"),
        lang: fieldVal(m,"lang"),
        objective: fieldVal(m,"objective"),
        deliverable: linesToArr($('[name="deliverable"]', m).value),
        instructions: linesToArr($('[name="instructions"]', m).value),
        given: linesToArr($('[name="given"]', m).value)
      };
    };

    $("#mfFill", m).onclick = async () => {
      const core = read();
      if (!core.title || !core.scenario){ toast(t("manual.needTitle"),"err"); return; }
      const emp = DB.get("employees", core.employeeId);
      Busy.show(t("common.working"), core.title);
      await nextFrame();
      try{
        const s = await generateExpectedSolution(emp, Object.assign({style: tk.style || DB.settings.taskStyle || "simple"}, core));
        $('[name="expectedAnswer"]', m).value = s.expectedAnswer || "";
        $('[name="keyPoints"]', m).value = arrToLines(s.keyPoints);
        $('[name="steps"]', m).value = arrToLines(s.steps);
        $('[name="commonMistakes"]', m).value = arrToLines(s.commonMistakes);
        m._criteria = s.criteria; m._rubric = s.rubric;
        Busy.hide(); toast(t("manual.filled"),"ok");
      }catch(e){ Busy.hide(); toast(String(e.message||e),"err"); }
    };

    $("#mfSave", m).onclick = () => {
      const core = read();
      if (!core.employeeId || !core.title || !core.scenario){ toast(t("common.required"),"err"); return; }
      const solution = {
        expectedAnswer: $('[name="expectedAnswer"]', m).value.trim(),
        keyPoints: linesToArr($('[name="keyPoints"]', m).value),
        steps: linesToArr($('[name="steps"]', m).value),
        commonMistakes: linesToArr($('[name="commonMistakes"]', m).value),
        criteria: m._criteria || sol.criteria || simpleCriteria(core.lang),
        rubric: m._rubric || sol.rubric || standardRubric(core.lang)
      };
      const payload = Object.assign({}, core, {
        solution: solution,
        isSimulation: tk.isSimulation || false,
        style: tk.style || DB.settings.taskStyle || "simple",
        engine: task ? (tk.engine || "manual") : "manual"
      });
      let row;
      if (task) row = DB.update("tasks", task.id, payload);
      else row = DB.insert("tasks", Object.assign({status:"draft", version:1, parentId:null, family:"manual", competencyId:"manual"}, payload));
      Modal.close();
      toast(t("manual.saved"),"ok");
      if (task) Router.render(); else location.hash = "#/task/" + row.id;
    };
  }});
}

function manualEvaluationForm(tk){
  const ev = evalOfTask(tk.id) || {};
  const d = ev.dimensions || {};
  const nf = (label, name, val) =>
    '<div class="field"><label>'+esc(label)+'</label><input class="inp" type="number" min="0" max="100" name="'+name+'" value="'+(val===undefined?"":val)+'"></div>';
  Modal.open(
    '<div class="modal-h"><h3>'+esc(t("ev.manualTitle"))+'</h3><button class="x" data-close>&times;</button></div>'+
    '<div class="modal-b">'+
      '<div class="note note-blue" style="margin-bottom:14px">'+esc(t("ev.manualHint"))+'</div>'+
      '<div class="field"><label class="req">'+esc(t("ev.score"))+' (0-100)</label>'+
        '<input class="inp" type="number" min="0" max="100" name="score" value="'+(ev.score!==undefined?ev.score:"")+'"></div>'+
      '<div class="sec-title">'+esc(t("ev.breakdown"))+'</div>'+
      '<div class="grid g3">'+
        nf(t("ev.accuracy"),"accuracy",d.accuracy)+
        nf(t("ev.completeness"),"completeness",d.completeness)+
        nf(t("ev.understanding"),"understanding",d.understanding)+
        nf(t("ev.problem"),"problemSolving",d.problemSolving)+
        nf(t("ev.practical"),"practicalApplication",d.practicalApplication)+
      '</div>'+
      '<div class="field"><label>'+esc(t("ev.strengths"))+'</label>'+
        '<textarea class="ta" name="strengths" style="min-height:80px" placeholder="'+esc(t("ev.strengthsPh"))+'">'+esc(arrToLines(ev.strengths))+'</textarea></div>'+
      '<div class="field"><label>'+esc(t("ev.improve"))+'</label>'+
        '<textarea class="ta" name="improvements" style="min-height:80px" placeholder="'+esc(t("ev.improvePh"))+'">'+esc(arrToLines(ev.improvements))+'</textarea></div>'+
      '<div class="field"><label>'+esc(t("ev.final"))+'</label><input class="inp" name="finalAssessment" value="'+esc(ev.finalAssessment||"")+'"></div>'+
      '<div class="field"><label>'+esc(t("ev.rationale"))+'</label><textarea class="ta" name="rationale" style="min-height:70px">'+esc(ev.rationale||"")+'</textarea></div>'+
    '</div>'+
    '<div class="modal-f"><button class="btn" data-close>'+esc(t("common.cancel"))+'</button>'+
    '<button class="btn btn-primary" id="meSave">'+esc(t("common.save"))+'</button></div>',
    {onOpen(m){
      $("#meSave", m).onclick = () => {
        const g = n => { const v = parseInt(fieldVal(m,n),10); return isNaN(v) ? null : clamp(v,0,100); };
        let score = g("score");
        const dims = {
          accuracy: g("accuracy"), completeness: g("completeness"), understanding: g("understanding"),
          problemSolving: g("problemSolving"), practicalApplication: g("practicalApplication")
        };
        const filled = Object.keys(dims).filter(k => dims[k] !== null);
        if (score === null && filled.length)
          score = Math.round(dims.accuracy*.25 + dims.completeness*.25 + dims.understanding*.2 + dims.problemSolving*.15 + dims.practicalApplication*.15);
        if (score === null){ toast(t("common.required"),"err"); return; }
        Object.keys(dims).forEach(k => { if (dims[k] === null) dims[k] = score; });

        const sub = submissionOfTask(tk.id);
        const row = {
          taskId: tk.id, employeeId: tk.employeeId, submissionId: sub ? sub.id : null,
          score: score, dimensions: dims,
          strengths: linesToArr($('[name="strengths"]', m).value),
          improvements: linesToArr($('[name="improvements"]', m).value),
          finalAssessment: fieldVal(m,"finalAssessment") || bandLabel(score),
          band: scoreBand(score).key,
          rationale: $('[name="rationale"]', m).value.trim(),
          engine: "manual",
          evaluatedAt: new Date().toISOString()
        };
        DB.removeWhere("evaluations", e => e.taskId === tk.id);
        DB.insert("evaluations", row);
        DB.update("tasks", tk.id, {status:"evaluated"});
        Modal.close(); toast(t("common.saved"),"ok"); Router.render();
      };
    }});
}

const LibFilters = {q:"", emp:"", dept:"", job:"", diff:"", type:"", status:"", from:"", to:""};
const LibSel = {};
const LibView = {mode: (localStorage.getItem("aitms.libView") || "table")};

function libMatches(tk){
  const emp = DB.get("employees", tk.employeeId) || {};
  const q = LibFilters.q.toLowerCase().trim();
  if (q){
    const hay = [tk.title, tk.competency, tk.scenario, emp.fullName, emp.jobTitle].join(" ").toLowerCase();
    if (hay.indexOf(q) < 0) return false;
  }
  if (LibFilters.emp  && tk.employeeId !== LibFilters.emp) return false;
  if (LibFilters.dept && emp.department !== LibFilters.dept) return false;
  if (LibFilters.job  && emp.jobTitle !== LibFilters.job) return false;
  if (LibFilters.diff && tk.difficulty !== LibFilters.diff) return false;
  if (LibFilters.type && tk.type !== LibFilters.type) return false;
  if (LibFilters.status && effectiveTaskStatus(tk) !== LibFilters.status) return false;
  if (LibFilters.from && isoDate(tk.createdAt) < LibFilters.from) return false;
  if (LibFilters.to   && isoDate(tk.createdAt) > LibFilters.to) return false;
  return true;
}

/* selection helpers — a selected id only counts while its task still exists
   inside the active company scope, so the counter can never go stale */
function libSelectedTasks(){ return scopedTasks().filter(tk => LibSel[tk.id]); }
function libSelectedIds(){ return libSelectedTasks().map(tk => tk.id); }
function libClearSel(){ Object.keys(LibSel).forEach(k => delete LibSel[k]); }
function libSetSel(tasks, on){
  tasks.forEach(tk => { if (on) LibSel[tk.id] = true; else delete LibSel[tk.id]; });
}

        '<label class="no-print" data-nosel style="float:'+(isRTL()?"left":"right")+';margin-inline-start:8px;cursor:pointer">'+

const LIB_SORTS = {
  title:    tk => tk.title || "",
  emp:      tk => { const e = DB.get("employees", tk.employeeId); return e ? e.fullName : ""; },
  type:     tk => typeLabel(tk.type),
  diff:     tk => DIFFS.indexOf(tk.difficulty),
  deadline: tk => tk.deadline || "",
  status:   tk => effectiveTaskStatus(tk),
  score:    tk => { const ev = evalOfTask(tk.id); return ev ? ev.score : null; }
};

function wireLibrary(root){
  const q = $("#libQ", root); if (q) q.oninput = debounce(function(){ LibFilters.q = this.value; tState("lib").page = 1; Router.render(true); }, 250);
  const bind = (id,key) => { const e = $(id, root); if (e) e.onchange = function(){ LibFilters[key] = this.value; tState("lib").page = 1; Router.render(true); }; };
  bind("#lEmp","emp"); bind("#lDept","dept"); bind("#lJob","job"); bind("#lDiff","diff");
  bind("#lType","type"); bind("#lStatus","status"); bind("#lFrom","from"); bind("#lTo","to");
  const rs = $("#lReset", root); if (rs) rs.onclick = () => { Object.keys(LibFilters).forEach(k=>LibFilters[k]=""); Router.render(); };
  [$("#libManual",root), $("#libManual2",root)].forEach(b => { if (b) b.onclick = () => taskForm(null, LibFilters.emp || null); });
  $$("[data-lview]", root).forEach(b => b.onclick = () => { LibView.mode = b.dataset.lview; localStorage.setItem("aitms.libView", LibView.mode); Router.render(true); });

  $$("[data-open]", root).forEach(b => b.onclick = (e) => {
    if (e.target.closest("[data-nosel]")) return;          // the card checkbox is not a click-through
    location.hash = "#/task/" + b.dataset.open;
  });
  $$("[data-nosel]", root).forEach(el => el.onclick = (e) => e.stopPropagation());

  /* one row / one card */
  $$("[data-lsel]", root).forEach(cb => cb.onchange = function(e){
    if (e) e.stopPropagation();
    if (this.checked) LibSel[this.dataset.lsel] = true; else delete LibSel[this.dataset.lsel];
    Router.render(true);
  });

  /* the header checkbox and the "select all" button do the same thing:
     everything the current filters return — not only what is on screen */
  const visible = () => sortBy(scopedTasks().filter(libMatches), x => x.createdAt, true);   // all filtered rows, every page
  const toggleFiltered = () => {
    const list = visible();
    const on = !(list.length && list.every(tk => LibSel[tk.id]));
    libSetSel(list, on);
    Router.render(true);
  };
  const headAll = $("#libAll", root);   if (headAll) headAll.onchange = toggleFiltered;
  const selAll  = $("#libSelAll", root); if (selAll) selAll.onclick = toggleFiltered;

  /* every task in the library, even the ones the filters are hiding */
  const selEvery = $("#libSelEvery", root);
  if (selEvery) selEvery.onclick = () => { libSetSel(scopedTasks(), true); Router.render(true); };

  const selNone = $("#libSelNone", root);
  if (selNone) selNone.onclick = () => { libClearSel(); Router.render(true); };

  /* bulk delete */
  const delSel = $("#libDelSel", root);
  if (delSel) delSel.onclick = () => {
    const ids = libSelectedIds();
    if (!ids.length){ toast(t("lib.nothingSelected"), "warn"); return; }
    confirmDialog(t("lib.deleteSelectedConfirm"), () => {
      DB.removeWhere("evaluations", e => ids.indexOf(e.taskId) >= 0);
      DB.removeWhere("submissions", s => ids.indexOf(s.taskId) >= 0);
      DB.removeWhere("tasks", tk => ids.indexOf(tk.id) >= 0);
      libClearSel();
      toast(t("lib.deletedN").split("{n}").join(ids.length), "ok");
      Router.render();
    }, true);
  };
  $$("[data-ldel]", root).forEach(b => b.onclick = (e) => { e.stopPropagation(); confirmDialog(t("task.deleteConfirm"), () => {
    const id = b.dataset.ldel;
    DB.removeWhere("evaluations", e => e.taskId === id);
    DB.removeWhere("submissions", s => s.taskId === id);
    DB.remove("tasks", id); delete LibSel[id]; toast(t("common.deleted"),"ok"); Router.render();
  }, true); });
  $$("[data-reuse]", root).forEach(b => b.onclick = (e) => { e.stopPropagation(); reuseTaskDialog(DB.get("tasks", b.dataset.reuse)); });

  const ex = $("#libExport", root);
  if (ex) ex.onclick = () => {
    const selected = scopedTasks().filter(tk => LibSel[tk.id]);
    const list = selected.length ? selected : scopedTasks().filter(libMatches);
    if (!list.length){ toast(t("common.noData"),"warn"); return; }
    exportDialog(list);
  };
}

function reuseTaskDialog(tk){

        const empId = $("#ruEmp", m).value;
        const emp = DB.get("employees", empId);
        const days = clamp(parseInt($("#ruDays", m).value,10)||5, 1, 90);
        const copy = Object.assign({}, tk);

      };
    }});
}

/* one merged, newest-first stream across the collections that matter */
function recentActivity(limit){
  const out = [];
  scopedTasks().forEach(tk => {
    out.push({at: tk.createdAt, icon: "sparkle",
              text: t("tl.created") + " — " + tk.title + " · " + employeeName(tk.employeeId)});
    if (tk.status === "sent" && tk.sentAt)
      out.push({at: tk.sentAt, icon: "send", text: t("tl.sent") + " — " + employeeName(tk.employeeId)});
  });
  scopedEvaluations().forEach(ev => out.push({at: ev.evaluatedAt || ev.createdAt, icon: "check",
    text: t("tl.evaluated") + " — " + employeeName(ev.employeeId) + " · " + ev.score + "/100"}));
  scopedTransfers().forEach(r => {
    const e = DB.get("employees", r.employeeId);
    out.push({at: r.createdAt, icon: "file",
              text: t("tr.title") + " — " + (e ? e.fullName : "") + " · " + monthName(r.month) + " " + r.year});
  });
  return sortBy(out.filter(x => x.at), x => x.at, true).slice(0, limit || 8);
}

    (emps.length?'':'<a class="btn" href="#/import">'+icon("upload",16)+' '+esc(t("dash.quickImport"))+'</a>')+'</div></div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>'+esc(t("task.task"))+'</th><th>'+esc(t("emp.fullName"))+'</th>'+
      '<th>'+esc(t("common.status"))+'</th><th>'+esc(t("common.score"))+'</th><th>'+esc(t("common.date"))+'</th></tr></thead><tbody>';

const EvFilters = {emp:"", dept:"", band:""};
function viewEvaluations(){
  let evs = sortBy(scopedEvaluations(), e => e.evaluatedAt || e.createdAt, true);
  evs = evs.filter(e => {
    const emp = DB.get("employees", e.employeeId) || {};
    if (EvFilters.emp && e.employeeId !== EvFilters.emp) return false;
    if (EvFilters.dept && emp.department !== EvFilters.dept) return false;
    if (EvFilters.band && scoreBand(e.score).key !== EvFilters.band) return false;
    return true;
  });

  const scores = evs.map(e=>e.score);
  const dist = [
    {label:t("ev.excellent"),  value: scores.filter(s=>s>=90).length, color:"#12a150"},
    {label:t("ev.good"),       value: scores.filter(s=>s>=75&&s<90).length, color:"#2f6bff"},
    {label:t("ev.acceptable"), value: scores.filter(s=>s>=60&&s<75).length, color:"#e08600"},
    {label:t("ev.needs"),      value: scores.filter(s=>s<60).length, color:"#e02424"}
  ];

  let html = '<div class="stack">';
  html += '<div class="grid g3">'+
    '<div class="card anim d1" style="grid-column:span 2"><div class="card-b">'+
      '<div class="filters">'+
        '<select class="sel" id="eEmp"><option value="">'+esc(t("emp.fullName")+": "+t("common.all"))+'</option>'+

        '<select class="sel" id="eDept"><option value="">'+esc(t("emp.department")+": "+t("common.all"))+'</option>'+
          departments().map(d=>'<option value="'+esc(d)+'"'+(d===EvFilters.dept?" selected":"")+'>'+esc(d)+'</option>').join("")+'</select>'+
        '<select class="sel" id="eBand"><option value="">'+esc(t("ev.final")+": "+t("common.all"))+'</option>'+
          ["excellent","good","acceptable","needs"].map(b=>'<option value="'+b+'"'+(b===EvFilters.band?" selected":"")+'>'+esc(t("ev."+b))+'</option>').join("")+'</select>'+
        '<button class="btn" id="eReset">'+esc(t("common.reset"))+'</button>'+
      '</div>'+
      '<div class="hr"></div>'+
      '<div class="row" style="gap:28px">'+
        '<div><div class="mut sm" style="font-weight:700">'+esc(t("common.total"))+'</div><div style="font-size:26px;font-weight:800;color:var(--text-strong)" data-count="'+evs.length+'">0</div></div>'+
        '<div><div class="mut sm" style="font-weight:700">'+esc(t("common.average"))+'</div><div style="font-size:26px;font-weight:800;color:'+(scores.length?scoreBand(avg(scores)).color:"var(--navy)")+'"'+(scores.length?' data-count="'+avg(scores)+'" data-dec="1"':'')+'>'+(scores.length?"0":"—")+'</div></div>'+
      '</div>'+
    '</div></div>'+
    '<div class="card anim d2"><div class="card-h"><h3>'+esc(t("ev.title"))+'</h3></div><div class="card-b">'+donutChart(dist,{centerLabel:t("ev.title")})+'</div></div>'+
  '</div>';

  html += '<div class="card anim d3"><div class="card-h"><h3>'+esc(t("ev.title"))+'</h3></div>';
  if (!evs.length) html += '<div class="empty"><div class="e-ic">'+icon("check",30)+'</div><h4>'+esc(t("ev.empty"))+'</h4></div>';
  else {
    const res = tApply("ev", evs, EV_SORTS);
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
      th("ev","emp",t("emp.fullName"))+th("ev","task",t("task.task"))+th("ev","score",t("common.score"))+
      th("ev","acc",t("ev.accuracy"))+th("ev","comp",t("ev.completeness"))+th("ev","und",t("ev.understanding"))+
      '<th>'+esc(t("ev.final"))+'</th>'+th("ev","date",t("common.date"))+'</tr></thead><tbody>';
    res.rows.forEach(e => {
      const tk = DB.get("tasks", e.taskId) || {};
      const d = e.dimensions || {};
      html += '<tr data-task="'+esc(e.taskId)+'" style="cursor:pointer">'+
        '<td class="nm">'+esc(employeeName(e.employeeId))+'</td>'+

        '<td><span class="badge '+scoreBand(e.score).cls+'"><span class="bdot"></span>'+e.score+'</span></td>'+
        '<td>'+num(d.accuracy)+'</td><td>'+num(d.completeness)+'</td><td>'+num(d.understanding)+'</td>'+
        '<td class="sm">'+esc(bandLabel(e.score))+'</td>'+
        '<td class="mut mono">'+esc(fmtDate(e.evaluatedAt||e.createdAt))+'</td></tr>';
    });
    html += '</tbody></table></div>' + pager("ev", res);
  }
  html += '</div></div>';
  return html;
}

const EV_SORTS = {
  emp:   e => employeeName(e.employeeId),
  task:  e => { const tk = DB.get("tasks", e.taskId); return tk ? tk.title : ""; },
  score: e => e.score,

  comp:  e => (e.dimensions||{}).completeness,
  und:   e => (e.dimensions||{}).understanding,

    t("rep.weak")+":", (rep.weakAreas||[]).map(x=>"- "+x).join("\n"), "",

async function generateReportFor(emp, month){
  if (!emp) return;
  let tasks = tasksOf(emp.id);
  if (month) tasks = tasks.filter(x => monthKey(x.createdAt) === month);
  if (!tasks.length){ toast(t("rep.noTasks"),"warn"); return; }
  const evals = tasks.map(x => evalOfTask(x.id)).filter(Boolean);
  const period = month ? monthLabel(month) : (isRTL() ? "كل الفترات" : "All time");
  Busy.show(t("rep.working"), emp.fullName);
  await nextFrame();
  try{
    const rep = await generateEmployeeReport(emp, tasks, evals, period, DB.settings.taskLang || LANG);
    rep.tasksTable = sortBy(tasks, x=>x.createdAt, true).map(tk => {
      const ev = evalOfTask(tk.id);
      return [tk.title, fmtDate(tk.createdAt), t("st."+effectiveTaskStatus(tk)), ev?String(ev.score):"—"];
    });
    const pack = DB.insert("reports", {employeeId: emp.id, type: month?"monthly":"employee", month: month||"", content: rep});
    RepState.last = pack; RepState.empId = emp.id;
    Busy.hide();
    toast(t("common.saved"),"ok");
    if (location.hash.indexOf("#/reports") !== 0) location.hash = "#/reports"; else Router.render();
    window.scrollTo(0,0);
  }catch(e){ Busy.hide(); toast(String(e.message||e),"err",5000); }
}

function wireSettings(root){
  $$("[data-stab]", root).forEach(b => b.onclick = () => { SetTab.current = b.dataset.stab; Router.render(true); });

  const g = id => $(id, root);

  /* ---- appearance ---- */
  $$("[data-theme-set]", root).forEach(b => b.onclick = () => { applyTheme(b.dataset.themeSet, true); Router.render(true); });
  $$("[data-dens]", root).forEach(b => b.onclick = () => {
    DB.saveSettings({density: b.dataset.dens}); applyDensity(b.dataset.dens); Router.render(true);
  });
  if (g("#stPageSize")) g("#stPageSize").onchange = function(){
    DB.saveSettings({pageSize: parseInt(this.value,10) || 25});
    Object.keys(TableState).forEach(k => TableState[k].page = 1);
    toast(t("set.savedOk"), "ok");
  };

  /* ---- brand ---- */
  const pickFile = (btnId, inputId, handler) => {
    const btn = g(btnId), inp = g(inputId);
    if (!btn || !inp) return;
    btn.onclick = () => inp.click();
    inp.onchange = async function(){
      const f = this.files && this.files[0]; this.value = "";
      if (!f) return;
      btn.disabled = true;
      try{ await handler(f); }
      catch(err){ toast(err.message || String(err), "err"); }
      btn.disabled = false;
    };
  };
  pickFile("#logoPick", "#logoFile", async (f) => {
    const out = await prepareBrandImage(f, 320);
    const prev = g("#logoPrev");
    if (prev) prev.innerHTML = '<span class="brand-logo" style="width:72px;height:72px"><img src="'+esc(out.data)+'" alt=""></span>';
    saveBrand({brandLogo: out.data});
    toast(t("brand.saved"), "ok");
    Router.render(true);
  });
  pickFile("#coverPick", "#coverFile", async (f) => {
    const out = await prepareBrandImage(f, 1600, 0.8);
    saveBrand({brandCover: out.data});
    toast(t("brand.saved"), "ok");
    Router.render(true);
  });
  if (g("#logoDel")) g("#logoDel").onclick = () => { saveBrand({brandLogo: ""}); toast(t("common.deleted"),"ok"); Router.render(true); };
  if (g("#coverDel")) g("#coverDel").onclick = () => { saveBrand({brandCover: ""}); toast(t("common.deleted"),"ok"); Router.render(true); };
  if (g("#brSave")) g("#brSave").onclick = () => {
    saveBrand({
      brandName: g("#brName").value.trim(),
      brandTagline: g("#brTag").value.trim(),
      brandDescription: g("#brDesc").value.trim(),
      brandInfo: g("#brInfo").value.trim()
    });
    toast(t("brand.saved"), "ok");
    Router.render(true);
  };
  if (g("#stSaveGeneral")) g("#stSaveGeneral").onclick = () => {
    DB.saveSettings({orgName:g("#stOrg").value.trim(), lang:g("#stLang").value, taskLang:g("#stTaskLang").value,
      defaultDeadlineDays: clamp(parseInt(g("#stDays").value,10)||5,1,90),
      countryCode: String(g("#stCC").value||"").replace(/[^\d]/g,""),
      taskStyle: g("#stStyle") ? g("#stStyle").value : (DB.settings.taskStyle||"order")});
    GenState.style = DB.settings.taskStyle;
    setLang(DB.settings.lang, false);
    toast(t("set.savedOk"),"ok"); Router.render();
  };
  if (g("#stProvider")) g("#stProvider").onchange = function(){
    DB.saveSettings({provider:this.value, model:"", baseUrl:""}); Router.render(true);
  };
  if (g("#stTemp")) g("#stTemp").oninput = function(){ g("#tempVal").textContent = this.value; };
  if (g("#stSaveAI")) g("#stSaveAI").onclick = () => {
    DB.saveSettings({provider:g("#stProvider").value, model:g("#stModel").value.trim(), apiKey:g("#stKey").value.trim(),
      baseUrl:g("#stBase").value.trim(), temperature: Number(g("#stTemp").value),
      useProxy: g("#stProxy").checked, proxyUrl: g("#stProxyUrl").value.trim()});
    toast(t("set.savedOk"),"ok"); updateAIBadge(); Router.render();
  };
  if (g("#stTest")) g("#stTest").onclick = async () => {
    DB.saveSettings({provider:g("#stProvider").value, model:g("#stModel").value.trim(), apiKey:g("#stKey").value.trim(),
      baseUrl:g("#stBase").value.trim(), useProxy: g("#stProxy").checked, proxyUrl: g("#stProxyUrl").value.trim()});
    const out = g("#stTestOut"); out.textContent = t("set.testing"); out.className = "sm mut";
    try{ await testAIConnection(); out.textContent = "✓ " + t("set.testOk"); out.className = "sm"; out.style.color = "#16a34a"; updateAIBadge(); }
    catch(e){ out.textContent = "✕ " + t("set.testFail") + " — " + String(e.message||e).slice(0,140); out.className="sm"; out.style.color="#dc2626"; }
  };
  if (g("#stSavePrivacy")) g("#stSavePrivacy").onclick = () => { DB.saveSettings({redactPII:g("#stRedact").checked}); toast(t("set.savedOk"),"ok"); };

  if (g("#dtExport")) g("#dtExport").onclick = () => {
    downloadFile("aitms_backup_"+todayISO()+".json", JSON.stringify(DB.exportAll(), null, 2), "application/json");
    DB.saveSettings({lastBackupAt: new Date().toISOString()});
    toast(t("common.saved"),"ok");
    Router.render(true);
  };
  if (g("#dtEmp")) g("#dtEmp").onclick = exportEmployeesCSV;
  if (g("#stQuota")) storageEstimate().then(e => {
    const q = g("#stQuota"), f = g("#stFree"), pr = g("#stPersist");
    if (q) q.textContent = e.quota ? (num((dataBytes()/e.quota)*100, 2) + "% " + (isRTL()?"من المساحة المتاحة":"of the available space")) : "";
    if (f) f.textContent = e.quota ? (num((e.quota - e.usage)/1073741824,1) + " GB") : "—";
    if (pr && navigator.storage && navigator.storage.persisted)
      navigator.storage.persisted().then(p => { pr.textContent = p ? (isRTL()?"تخزين دائم مفعّل":"Persistent storage on") : (isRTL()?"تخزين عادي":"Best-effort storage"); });
    else if (pr) pr.textContent = "";
  });
  if (g("#dtImport")) g("#dtImport").onclick = () => g("#dtFile").click();
  if (g("#dtFile")) g("#dtFile").onchange = function(){
    const f = this.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(r.result);
        const merge = g("#dtMerge") && g("#dtMerge").checked;
        const apply = () => { DB.importAll(data, merge); setLang(DB.settings.lang, false); toast(t("set.imported"),"ok"); Router.render(); };
        if (merge) apply(); else confirmDialog(t("set.restoreConfirm"), apply);
      }
      catch(e){ toast(t("set.importBad"),"err"); }
    };
    r.readAsText(f);
  };
  if (g("#dtDemo")) g("#dtDemo").onclick = () => { loadDemoData(); toast(t("set.demoAdded"),"ok"); Router.render(); };
  if (g("#dtWipe")) g("#dtWipe").onclick = () => confirmDialog(t("set.wipeConfirm"), () => {
    const keep = DB.settings; DB.wipe(); DB.saveSettings(keep); toast(t("common.deleted"),"ok"); Router.render();
  }, true);
}

const Router = {
  parse(){
    const h = (location.hash || "#/dashboard").replace(/^#\/?/,"");
    const parts = h.split("/").filter(Boolean);
    return {name: parts[0] || "dashboard", param: parts[1] || ""};
  },
  render(keepScroll){
    clearRenderCache();                 // stats are memoised for the length of one paint only
    const r = this.parse();
    const view = $("#view");
    const y = window.scrollY;
    let html = "", wire = null, titleKey = "", subKey = "";

    if (r.name === "employee" && r.param){
      const e = DB.get("employees", r.param);
      html = viewEmployeeProfile(r.param);
      wire = root => wireEmployeeProfile(root, r.param);
      titleKey = "emp.profile"; subKey = "";
      $("#pageTitle").textContent = e ? e.fullName : t("emp.profile");
      $("#pageSub").textContent = e ? ((e.jobTitle||"") + (e.department? " · "+e.department : "")) : "";
    } else if (r.name === "task" && r.param){
      const tk = DB.get("tasks", r.param);
      html = viewTask(r.param);
      wire = root => wireTask(root, r.param);
      $("#pageTitle").textContent = tk ? tk.title : t("task.task");
      $("#pageSub").textContent = tk ? employeeName(tk.employeeId) : "";
    } else {
      const route = ROUTES[r.name] || ROUTES.dashboard;
      html = route.param ? route.view(r.param) : route.view();
      wire = route.param ? (root => route.wire(root, r.param)) : route.wire;
      const head = route.head ? route.head(r.param) : null;
      $("#pageTitle").textContent = head ? head.title : t(route.title);
      $("#pageSub").textContent = head ? (head.sub || "") : (route.sub ? t(route.sub) : "");
    }

    view.innerHTML = html;
    paintIcons(view);
    if (wire) try{ wire(view); }catch(e){ console.error("wire error", e); }
    try{ wireTables(view); }catch(e){ console.error("table wire error", e); }
    animateCounters(view);

    $$("#nav a").forEach(a => {
      const cur = ROUTES[r.name] || {};
      const active = a.dataset.route === r.name ||
        (cur.navAs && a.dataset.route === cur.navAs) ||
        (r.name === "employee" && a.dataset.route === "employees") ||
        (r.name === "task" && a.dataset.route === "library");
      a.classList.toggle("active", active);
    });
    updateStorageInfo();
    if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
    closeSidebar();
  }
};

function updateAIBadge(){
  const el = $("#aiStatus"), tx = $("#aiStatusTxt");

function updateStorageInfo(){
  const el = $("#storageInfo"); if (!el) return;
  el.textContent = DB.all("employees").length + " " + t("emp.count") + " · " + DB.all("tasks").length + " " + t("task.tasks") +

}
/* animated counters — any element with data-count */
function animateCounters(root){
  $$("[data-count]", root).forEach(el => {
    const target = parseFloat(el.dataset.count);
    if (!isFinite(target)) return;
    const dec = el.dataset.dec ? parseInt(el.dataset.dec,10) : 0;
    const suffix = el.dataset.suffix || "";
    /* money-sized numbers read better grouped: 53,000 not 53000 */
    const group = el.dataset.group === "1" || Math.abs(target) >= 10000;
    const fmt = v => {
      const n = Number(v.toFixed(dec));
      return (group ? n.toLocaleString("en-US", {minimumFractionDigits:dec, maximumFractionDigits:dec}) : v.toFixed(dec)) + suffix;
    };
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      el.textContent = fmt(target); return;
    }
    const dur = 900, t0 = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(target * e);
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function globalSearchGo(q){
  q = String(q||"").trim();
  if (!q) return;
  const emp = scopedEmployees().find(e => (e.fullName+" "+(e.nameEn||"")+" "+(e.empId||"")+" "+(e.email||"")).toLowerCase().indexOf(q.toLowerCase()) >= 0);
  if (emp){ location.hash = "#/employee/" + emp.id; return; }
  const co = companies().find(c => c.name.toLowerCase().indexOf(q.toLowerCase()) >= 0);
  if (co){ setActiveCompany(co.id); refreshCompanySwitcher(); location.hash = "#/employees"; return; }
  LibFilters.q = q; location.hash = "#/library";
}

function greeting(){
  const h = new Date().getHours();
  if (h < 12) return t("dash.greetMorning");
  if (h < 17) return t("dash.greetAfternoon");
  return t("dash.greetEvening");
}

/* every employee belongs to a company; older data is migrated into a default one */
function ensureCompany(){
  let list = DB.all("companies");
  const orphans = DB.all("employees").filter(e => !e.companyId);
  if (!list.length && orphans.length){
    const name = DB.settings.orgName || (LANG === "ar" ? "شركتي" : "My Company");
    const c = DB.insert("companies", {name: name, industry:"", contact:"", notes:""});
    list = DB.all("companies");
  }
  if (orphans.length && list.length){
    const target = DB.settings.activeCompanyId && DB.get("companies", DB.settings.activeCompanyId)
      ? DB.settings.activeCompanyId : list[0].id;
    orphans.forEach(e => DB.update("employees", e.id, {companyId: target}));
  }
  if (DB.settings.activeCompanyId && !DB.get("companies", DB.settings.activeCompanyId)) setActiveCompany("");
}

/* ---------- boot ---------- */
async function boot(){
  applyTheme(storedTheme(), false);        // before the first paint — no white flash on a dark desktop
  bootSkeleton();                          // real content is behind an async IndexedDB open
  await DB.init();
  if (DB.settings.theme && DB.settings.theme !== storedTheme()) applyTheme(DB.settings.theme, true);
  else applyTheme(storedTheme(), true);
  watchSystemTheme();
  applyDensity(DB.settings.density);
  setLang(DB.settings.lang || "ar", false);
  paintBrand();

  $$(".lang-sw button").forEach(b => b.onclick = () => {
    setLang(b.dataset.lang, false);
    DB.saveSettings({lang: b.dataset.lang});
    updateAIBadge();
    paintThemeButton();
    paintBrand();
    refreshNavTips();
    Router.render(true);
  });
  const themeBtn = $("#themeBtn");
  if (themeBtn) themeBtn.onclick = cycleTheme;
  $("#burger").onclick = () => $("#sidebar").classList.contains("open") ? closeSidebar() : openSidebar();
  $("#scrim").onclick = closeSidebar;

  /* sidebar collapse */
  if (localStorage.getItem("aitms.collapsed") === "1") document.body.classList.add("collapsed");
  $("#sideToggle").onclick = () => {
    document.body.classList.toggle("collapsed");
    localStorage.setItem("aitms.collapsed", document.body.classList.contains("collapsed") ? "1" : "0");
  };

  /* profile dropdown */
  const pm = $("#profMenu");
  $("#profBtn").onclick = (e) => { e.stopPropagation(); pm.classList.toggle("show"); };
  document.addEventListener("click", () => pm.classList.remove("show"));
  $$("#profMenu [data-go]").forEach(b => b.onclick = () => { location.hash = "#/" + b.dataset.go; pm.classList.remove("show"); });
  $("#profBackup").onclick = () => {
    downloadFile("aitms_backup_"+todayISO()+".json", JSON.stringify(DB.exportAll(), null, 2), "application/json");
    DB.saveSettings({lastBackupAt: new Date().toISOString()});
    toast(t("common.saved"),"ok"); pm.classList.remove("show");
  };

  /* notifications = overdue tasks */
  $("#notifBtn").onclick = () => {
    const over = scopedTasks().filter(x => effectiveTaskStatus(x) === "overdue");
    if (!over.length){ toast(isRTL()?"ما فيه مهام متأخرة":"No overdue tasks","ok"); return; }
    LibFilters.status = "overdue"; location.hash = "#/library";
  };

  /* global search */
  const gs = $("#globalSearch");
  gs.placeholder = t("search.ph");
  gs.onkeydown = (e) => { if (e.key === "Enter") globalSearchGo(gs.value); };

  paintIcons(document);
  /* collapsed sidebar needs the label as a tooltip */
  $$("#nav a").forEach(a => {
    a.onclick = () => { location.hash = "#/" + a.dataset.route; };
    const lbl = a.querySelector(".lbl");
    if (lbl && !a.querySelector(".tip")){
      const tip = document.createElement("span");
      tip.className = "tip";
      tip.textContent = lbl.textContent;
      a.appendChild(tip);
    }
  });
  $("#modalBg").onclick = (e) => { if (e.target.id === "modalBg") Modal.close(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") Modal.close(); });

  window.addEventListener("hashchange", () => Router.render());
  DB.onChange(() => updateStorageInfo());

  if (DB.settings.taskStyle === "simple") DB.saveSettings({taskStyle:"order"});
  ensureCompany();
  refreshCompanySwitcher();
  wireCompanySwitcher();
  updateAIBadge();
  Sync.start();                       // live updates between open windows
  if (!location.hash) location.hash = "#/dashboard";
  Router.render();
}

/* what the user sees while IndexedDB opens — shaped like the real page,
   so nothing jumps when the data lands */
function bootSkeleton(){
  const v = document.getElementById("view");
  if (!v) return;
  v.innerHTML =
    '<div class="stack">'+
      '<div class="skl-c" style="height:150px;border-radius:20px"></div>'+
      '<div class="grid g4">'+
        '<div class="skl-c" style="height:104px;border-radius:14px"></div>'.repeat(4)+
      '</div>'+
      '<div class="grid g4">'+
        '<div class="skl-c" style="height:104px;border-radius:14px"></div>'.repeat(4)+
      '</div>'+
      '<div class="card">'+ skeletonRows(5, 2) +'</div>'+
    '</div>';
}

document.addEventListener("DOMContentLoaded", () => { boot().catch(e => { console.error(e); alert("Startup error: " + (e.message||e)); }); });
